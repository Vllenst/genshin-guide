<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>原神一图流生成器</title>
<style>
/* =========================================================================
 * 【样式 1】设计令牌（云上舞白 · 暖调 iOS）
 * ========================================================================= */
:root {
  --bg-base: #EDE8E1;
  --bg-surface: #FFFFFF;
  --bg-surface-2: #FAF8F5;
  --bg-sunken: #EBE7E0;
  --bg-hover: #E8E2D9;
  --bg-seg-track: #EFEAE3;

  --border-subtle: #E7E1D8;
  --border-default: #D8D0C5;
  --border-strong: #BFB5A8;

  --text-primary: #1F1D1A;
  --text-secondary: #6B655C;
  --text-tertiary: #8A8279;

  --accent: #8B7355;
  --accent-dark: #75604A;

  --danger: #CE4A36;
  --danger-bg: #FBE7E2;
  --danger-hover: #F7D9D2;
  --danger-border: rgba(206, 74, 54, 0.22);

  --radius-sm: 10px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --ctl-h: 38px;

  --shadow-btn: 0 1px 2px rgba(31, 29, 26, 0.05);
  --shadow-btn-hover: 0 2px 6px rgba(31, 29, 26, 0.09);
  --shadow-card: 0 1px 2px rgba(31, 29, 26, 0.04);

  --std-font: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

/* =========================================================================
 * 【样式 2】基础重置
 * ========================================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body, input, button, select, textarea {
  font-family: var(--std-font); font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
body { background: var(--bg-base); color: var(--text-primary); font-size: 13px; min-height: 100vh; overflow-x: hidden; letter-spacing: -0.2px; }
button, input[type="button"], input[type="submit"] { -webkit-appearance: none; appearance: none; }
.icon { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; display: block; }

/* =========================================================================
 * 【样式 3】顶部导航栏
 * ========================================================================= */
.app-header {
  position: sticky; top: 0; z-index: 50; height: 52px; padding: 0 16px;
  background: rgba(237, 232, 225, 0.88);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 8px;
}
.brand { font-size: 15px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; letter-spacing: -0.3px; }
.header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: auto; }

.app-container {
  max-width: 1400px; margin: 0 auto; padding: 12px 14px;
  display: grid; grid-template-columns: 1fr; gap: 14px;
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
}
@media (max-width: 1023px) {
  body { overflow: hidden; }
  .app-container {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    height: calc(100dvh - 52px);
    padding: 12px 14px 0;
    padding-bottom: 0;
    gap: 0;
    overflow: hidden;
  }
}
@media (min-width: 1024px) {
  .app-container {
    grid-template-columns: minmax(480px, 1.2fr) minmax(440px, 1fr);
    height: calc(100vh - 52px); padding: 16px 20px; overflow: hidden;
  }
}

/* =========================================================================
 * 【样式 4】预览区
 * ========================================================================= */
.preview-pane { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
@media (max-width: 1023px) {
  .preview-pane {
    position: static;
    background: var(--bg-base);
    padding: 0 0 5px 0;
    margin: 0;
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }
}
@media (min-width: 1024px) {
  .preview-pane { position: sticky; top: 68px; height: 100%; overflow-y: auto; padding-right: 6px; }
}
.preview-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); padding: 10px;
  display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-card);
}
@media (max-width: 1023px) {
  .preview-card {
    padding: 0 !important;
    border: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    gap: 0 !important;
  }
  .preview-header { display: none !important; }
}
.preview-header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.preview-title { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.preview-frame {
  background: #1c1c22; border-radius: var(--radius-md); overflow: hidden;
  outline: 1px solid var(--border-default); outline-offset: -1px;
  aspect-ratio: 16 / 9; position: relative;
}
@media (max-width: 1023px) {
  .preview-frame {
    aspect-ratio: 16 / 9;
    max-height: 32vh;
    width: auto;
    max-width: 100%;
    align-self: center;
    margin: 0 auto;
    background: transparent;
    outline: 0;
    border-radius: var(--radius-md);
    overflow: hidden;
  }
}
#svgPreviewHost { width: 100%; height: 100%; }
#svgPreviewHost > svg { width: 100%; height: 100%; display: block; }

/* =========================================================================
 * 【样式 5】检查器主面板
 * ========================================================================= */
.inspector-pane { display: flex; flex-direction: column; gap: 12px; overflow: hidden; min-width: 0; }
@media (min-width: 1024px) { .inspector-pane { height: 100%; } }
@media (max-width: 1023px) {
  .inspector-pane { overflow: hidden; padding-top: 5px; gap: 5px; min-height: 0; }
}

/* =========================================================================
 * 【样式 6】Tab 触发按钮（替代 9-tab 行）
 * ========================================================================= */
.tab-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 44px;
  padding: 0 14px 0 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  box-shadow: var(--shadow-card);
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  letter-spacing: -0.2px;
}
.tab-trigger:hover { background: var(--bg-hover); }
.tab-trigger:active { transform: scale(0.99); }
.tab-trigger[aria-expanded="true"] {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
}
.tab-trigger-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.tab-trigger-caret {
  width: 16px;
  height: 16px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.15s;
}
.tab-trigger:hover .tab-trigger-caret { color: var(--text-secondary); }
.tab-trigger[aria-expanded="true"] .tab-trigger-caret { transform: rotate(180deg); color: var(--accent); }

/* =========================================================================
 * 【样式 7】Tab 内容区
 * ========================================================================= */
.tabs-content { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; min-height: 0; }
@media (max-width: 1023px) {
  .tabs-content {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
    min-height: 0;
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
  }
}
.tab-panel { display: none; flex-direction: column; gap: 12px; }
.tab-panel.active { display: flex; }

/* =========================================================================
 * 【样式 8】Bottom Sheet / Popover 弹层
 * ========================================================================= */
.tab-sheet-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(31, 29, 26, 0.35);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.tab-sheet-backdrop.show { opacity: 1; pointer-events: auto; }

.tab-sheet {
  position: fixed;
  z-index: 201;
  background: var(--bg-surface);
  overflow-y: auto;
  overscroll-behavior: contain;
  font-family: inherit;
  /* 移动端默认：底部滑起 */
  left: 0; right: 0; bottom: 0;
  border-radius: 16px 16px 0 0;
  max-height: 80dvh;
  padding: 6px 0 calc(10px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -12px 40px rgba(31, 29, 26, 0.14);
  will-change: transform;
}
.tab-sheet.show { transform: translateY(0); }

/* 桌面端：居中弹窗 */
@media (min-width: 1024px) {
  .tab-sheet {
    left: 50%; right: auto; bottom: auto;
    top: 50%;
    width: 340px;
    max-height: 70vh;
    border-radius: 16px;
    padding: 8px 0 10px;
    transform: translate(-50%, -48%) scale(0.96);
    opacity: 0;
    transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
    box-shadow: 0 24px 60px rgba(31, 29, 26, 0.24);
  }
  .tab-sheet.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}

.tab-sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border-strong);
  margin: 6px auto 4px;
  opacity: 0.55;
}
@media (min-width: 1024px) { .tab-sheet-handle { display: none; } }

.tab-sheet-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 8px 22px 8px;
}
@media (min-width: 1024px) { .tab-sheet-header { padding: 10px 20px 8px; } }

.tab-sheet-list {
  display: flex;
  flex-direction: column;
  padding: 0 8px;
}

.tab-sheet-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  height: 50px;
  padding: 0 14px;
  background: transparent;
  border: 0;
  border-radius: 10px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: -0.2px;
  -webkit-appearance: none; appearance: none;
}
.tab-sheet-item:hover { background: var(--bg-hover); }
.tab-sheet-item:active { background: var(--bg-sunken); }
.tab-sheet-item.active {
  color: var(--accent);
  font-weight: 600;
}

.tab-sheet-item-check {
  width: 16px; height: 16px;
  color: var(--accent);
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.15s;
}
.tab-sheet-item.active .tab-sheet-item-check { opacity: 1; }

/* =========================================================================
 * 【样式 9】分组 / 表单
 * ========================================================================= */
.ios-section-header {
  font-size: 12px; font-weight: 600; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.5px; padding: 0 8px 6px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap;
}
.ios-group {
  background: var(--bg-surface); border-radius: var(--radius-md); overflow: hidden;
  border: 1px solid var(--border-subtle); display: flex; flex-direction: column;
  box-shadow: var(--shadow-card);
}
.ios-row { padding: 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-subtle); }
.ios-row:last-child { border-bottom: 0; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px; }
.field-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 640px) { .field-grid, .field-grid.three { grid-template-columns: 1fr; } }
label.ios-field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-secondary); font-weight: 500; }

/* =========================================================================
 * 【样式 10】输入框 / 下拉框
 * ========================================================================= */
input[type="text"], input[type="number"], select {
  width: 100%;
  height: var(--ctl-h);
  background: var(--bg-sunken);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  padding: 0 12px;
  outline: none;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus {
  background: var(--bg-surface);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
select {
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%236B655C' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 11px 7px;
  padding-right: 34px;
}

/* =========================================================================
 * 【样式 11】滑块（iOS 自定义外观）
 * ========================================================================= */
.slider-box { display: flex; align-items: center; gap: 10px; padding: 0 10px 10px 10px; }
.slider-box > span:first-child { font-size: 11px; color: var(--text-secondary); flex: 1; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  height: 28px;
  flex: 1;
  cursor: pointer;
  margin: 0;
  outline: none;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-sunken);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: -8px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  box-shadow: 0 1px 3px rgba(31, 29, 26, 0.2), 0 0 0 0.5px rgba(31, 29, 26, 0.08);
  transition: transform 0.12s ease;
  cursor: grab;
}
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.06); cursor: grabbing; }
input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-sunken);
  border: none;
}
input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  box-shadow: 0 1px 3px rgba(31, 29, 26, 0.2), 0 0 0 0.5px rgba(31, 29, 26, 0.08);
  cursor: grab;
}
input[type="range"]:active::-moz-range-thumb { cursor: grabbing; }

.slider-box input[type="number"] {
  width: 68px;
  height: 32px;
  text-align: center;
  padding: 0 6px;
  font-size: 12px;
  border-radius: 8px;
}

/* =========================================================================
 * 【样式 12】按钮
 * ========================================================================= */
button, .file-btn {
  font-family: inherit; border: 1px solid var(--border-default); border-radius: var(--radius-sm);
  height: var(--ctl-h); padding: 0 14px; font-size: 13px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap; flex-shrink: 0; background: var(--bg-surface);
  color: var(--text-primary); box-shadow: var(--shadow-btn);
  -webkit-appearance: none; appearance: none; user-select: none;
}
button:hover:not(:disabled), .file-btn:hover { background: var(--bg-hover); box-shadow: var(--shadow-btn-hover); }
button:active:not(:disabled), .file-btn:active { transform: scale(0.97); box-shadow: var(--shadow-btn); }
button:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-sm { height: 32px; padding: 0 10px; font-size: 12px; gap: 4px; }
.btn-xs { height: 26px; padding: 0 8px; font-size: 11px; gap: 4px; border-radius: 8px; font-weight: 500; }

.btn-danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.btn-danger:hover:not(:disabled) { background: var(--danger-hover); box-shadow: var(--shadow-btn-hover); }

.ios-btn-fill {
  background: var(--text-primary); border-color: var(--text-primary);
  color: #fff; box-shadow: 0 2px 6px rgba(31, 29, 26, 0.15);
}
.ios-btn-fill:hover:not(:disabled) { background: var(--accent-dark); box-shadow: 0 3px 10px rgba(31, 29, 26, 0.2); }
.ios-btn-fill:active:not(:disabled) { background: var(--accent); transform: scale(0.97); }

.file-btn input[type="file"] { display: none !important; }

/* =========================================================================
 * 【样式 13】缩略图 / 卡片列表
 * ========================================================================= */
.clickable-thumb {
  width: var(--ctl-h); height: var(--ctl-h); border-radius: var(--radius-sm);
  background: var(--bg-sunken); border: 1px solid var(--border-default);
  object-fit: cover; flex-shrink: 0; cursor: pointer;
  transition: transform 0.12s, filter 0.12s, border-color 0.12s;
}
.clickable-thumb:hover { filter: brightness(0.94); border-color: var(--accent); }
.clickable-thumb:active { transform: scale(0.92); }

.item-card {
  background: var(--bg-surface-2); border-radius: var(--radius-md); padding: 10px;
  display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border-subtle);
}
.item-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.item-actions {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  justify-content: flex-end; margin-left: auto;
}
.item-row { display: flex; align-items: center; gap: 8px; }

/* =========================================================================
 * 【样式 14】命座编辑
 * ========================================================================= */
.cons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px; }
@media (max-width: 600px) { .cons-grid { grid-template-columns: 1fr; } }
.cons-item {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-surface-2); border-radius: var(--radius-sm); padding: 6px 8px;
  border: 1px solid var(--border-subtle);
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.cons-item.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.cons-badge {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  background: var(--bg-sunken); border: 1px solid var(--border-default);
  color: var(--text-secondary); cursor: pointer; flex-shrink: 0;
  transition: all 0.2s;
}
.cons-item.active .cons-badge { background: var(--accent); color: #fff; border-color: var(--accent); }

/* =========================================================================
 * 【样式 15】元素/主题色选择
 * ========================================================================= */
.color-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; }
.swatch-btn {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  background: var(--bg-surface-2); border-radius: var(--radius-sm);
  height: var(--ctl-h); cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--text-secondary); border: 1px solid var(--border-subtle);
  transition: all 0.15s;
}
.swatch-btn:hover { background: var(--bg-hover); }
.swatch-btn.active {
  border-color: currentColor;
  box-shadow: 0 0 0 1.5px currentColor;
  background: var(--bg-surface);
}
.swatch-icon { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; display: block; }

/* =========================================================================
 * 【样式 16】底部操作栏 + 主按钮
 * ========================================================================= */
.bottom-dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: rgba(237, 232, 225, 0.9);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-top: 1px solid var(--border-subtle);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; align-items: center; justify-content: center;
}
@media (min-width: 1024px) { .bottom-dock { display: none; } }
.export-btn-main {
  width: 100%; max-width: 480px; height: 48px;
  font-size: 15px; font-weight: 600;
  background: var(--text-primary); color: #fff;
  border: 1px solid var(--text-primary);
  border-radius: var(--radius-pill);
  box-shadow: 0 4px 16px rgba(31, 29, 26, 0.18);
}
.export-btn-main:active:not(:disabled) { background: var(--accent-dark); }

/* =========================================================================
 * 【样式 17】Toast + Modal
 * ========================================================================= */
.toast-container {
  position: fixed; top: 64px; right: 16px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  background: var(--bg-surface); border: 1px solid var(--border-default);
  border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px;
  color: var(--text-primary); box-shadow: 0 4px 20px rgba(31, 29, 26, 0.12);
  max-width: 320px; pointer-events: auto;
  opacity: 0; transform: translateX(20px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast.toast-error { border-color: var(--danger-border); color: var(--danger); }
.toast.toast-success { border-color: rgba(48, 209, 88, 0.4); }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 9998;
  background: rgba(31, 29, 26, 0.35);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.modal-backdrop.show { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--bg-surface); border-radius: var(--radius-lg);
  padding: 20px; max-width: 320px; width: calc(100% - 32px);
  box-shadow: 0 20px 60px rgba(31, 29, 26, 0.25);
  transform: scale(0.94);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-backdrop.show .modal-box { transform: scale(1); }
.modal-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; text-align: center; }
.modal-message { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 18px; text-align: center; }
.modal-actions { display: flex; gap: 8px; }
.modal-actions button {
  flex: 1;
  height: 42px;
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--radius-pill);
}
</style>
</head>

<body>

<header class="app-header">
  <div class="brand">原神一图流生成器</div>
  <div class="header-actions">
    <button type="button" class="btn-sm" onclick="App.exportConfig()">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19ZM14 9V15H10V9H5L12 2L19 9H14Z"></path></svg>
      导出
    </button>
    <label class="btn-sm file-btn">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19ZM14 9H19L12 16L5 9H10V3H14V9Z"></path></svg>
      导入
      <input type="file" id="importJsonInput" accept=".json" onchange="App.importConfig(this)" />
    </label>
    <button type="button" class="btn-sm btn-danger" onclick="App.clearAllData()" title="清空全部数据">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 10.5858L9.17157 7.75736L7.75736 9.17157L10.5858 12L7.75736 14.8284L9.17157 16.2426L12 13.4142L14.8284 16.2426L16.2426 14.8284L13.4142 12L16.2426 9.17157L14.8284 7.75736L12 10.5858Z"></path></svg>
      清空
    </button>
  </div>
</header>

<main class="app-container">
  <section class="preview-pane">
    <div class="preview-card">
      <div class="preview-header">
        <span class="preview-title">实时卡片渲染视口</span>
        <button class="ios-btn-fill btn-sm" onclick="App.exportPNG()" id="exportDesktopBtn">导出 4K PNG</button>
      </div>
      <div class="preview-frame">
        <div id="svgPreviewHost"></div>
      </div>
    </div>
  </section>

  <section class="inspector-pane">
    <button type="button" class="tab-trigger" id="tabTrigger" onclick="App.openTabSheet()" aria-haspopup="true" aria-expanded="false">
      <span class="tab-trigger-label" id="tabTriggerLabel">外观样式</span>
      <svg class="tab-trigger-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <div class="tabs-content">

      <div class="tab-panel active" id="tab-style">
        <div>
          <div class="ios-section-header">角色信息</div>
          <div class="ios-group">
            <div class="field-grid">
              <label class="ios-field">角色名称<input type="text" id="charName" oninput="App.setField('charName', this.value)" /></label>
              <label class="ios-field">适用版本<input type="text" id="version" oninput="App.setField('version', this.value)" /></label>
              <label class="ios-field">制作日期<input type="text" id="date" oninput="App.setField('date', this.value)" /></label>
              <label class="ios-field">攻略作者<input type="text" id="author" oninput="App.setField('author', this.value)" /></label>
            </div>
          </div>
        </div>
        <div>
          <div class="ios-section-header">元素主题色</div>
          <div class="ios-group">
            <div class="color-swatches" id="colorPicker"></div>
          </div>
        </div>
        <div>
          <div class="ios-section-header">卡片嵌入字体（仅作用于图片导出，不影响网页）</div>
          <div class="ios-group">
            <div class="ios-row">
              <div style="flex:1;">
                <div style="font-size:13px;" id="labelCustomFont">默认标准字体</div>
              </div>
              <label class="file-btn ios-btn-fill">
                载入字体
                <input type="file" id="inputFont" accept=".ttf,.otf,.woff,.woff2" style="display:none" onchange="App.uploadFontHandler(this)" />
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-base">
        <div>
          <div class="ios-section-header">图片素材（点击缩略图更换）</div>
          <div class="ios-group">
            <div class="ios-row">
              <img id="thumbCharImg" class="clickable-thumb" onclick="App.triggerUpload('inputCharImg')" title="点击上传立绘" alt="" />
              <div style="flex:1;cursor:pointer;" onclick="App.triggerUpload('inputCharImg')">
                <div style="font-size:13px;font-weight:500;" id="labelCharImg">点击上传立绘</div>
              </div>
              <button class="btn-xs btn-danger" onclick="App.clearImage('charImg', 'thumbCharImg', 'labelCharImg')" title="删除立绘">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7ZM13.4142 13.9997L15.182 12.232L13.7678 10.8178L12 12.5855L10.2322 10.8178L8.81802 12.232L10.5858 13.9997L8.81802 15.7675L10.2322 17.1817L12 15.4139L13.7678 17.1817L15.182 15.7675L13.4142 13.9997ZM9 4V6H15V4H9Z"></path></svg>
                删除
              </button>
              <input type="file" id="inputCharImg" accept="image/*" style="display:none" onchange="App.uploadImageHandler(this, (v, w, h) => { State.data.charImg = v; State.data.charImgMeta = { w, h }; App.updateImgXHint(); App.updateThumb('thumbCharImg', 'labelCharImg', v, '已载入立绘（点击更换）'); })" />
            </div>
            <div class="slider-box" style="padding-top:10px;">
              <span id="imgXHint">立绘偏移（左右移动）</span>
              <input type="range" min="-400" max="400" value="0" id="imgXSlider" oninput="App.setField('imgX', this.value)" />
              <input type="number" id="imgX" value="0" oninput="App.setField('imgX', this.value)" />
            </div>
            <div class="ios-row">
              <img id="thumbNameBg" class="clickable-thumb" onclick="App.triggerUpload('inputNameBg')" title="点击上传元素图" alt="" />
              <div style="flex:1;cursor:pointer;" onclick="App.triggerUpload('inputNameBg')">
                <div style="font-size:13px;font-weight:500;" id="labelNameBg">点击上传元素图</div>
              </div>
              <button class="btn-xs btn-danger" onclick="App.clearImage('nameBgImg', 'thumbNameBg', 'labelNameBg')" title="删除元素图">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7ZM13.4142 13.9997L15.182 12.232L13.7678 10.8178L12 12.5855L10.2322 10.8178L8.81802 12.232L10.5858 13.9997L8.81802 15.7675L10.2322 17.1817L12 15.4139L13.7678 17.1817L15.182 15.7675L13.4142 13.9997ZM9 4V6H15V4H9Z"></path></svg>
                删除
              </button>
              <input type="file" id="inputNameBg" accept="image/*" style="display:none" onchange="App.uploadImageHandler(this, (v, w, h) => { State.data.nameBgImg = v; State.data.nameBgImgMeta = { w, h }; App.updateThumb('thumbNameBg', 'labelNameBg', v, '已载入元素图（点击更换）'); })" />
            </div>
            <div class="ios-row">
              <img id="thumbBg" class="clickable-thumb" onclick="App.triggerUpload('inputBg')" title="点击上传大背景" alt="" />
              <div style="flex:1;cursor:pointer;" onclick="App.triggerUpload('inputBg')">
                <div style="font-size:13px;font-weight:500;" id="labelBg">默认暗黑原力色</div>
              </div>
              <button class="btn-xs btn-danger" onclick="App.clearImage('bgImg', 'thumbBg', 'labelBg')" title="删除大背景">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7ZM13.4142 13.9997L15.182 12.232L13.7678 10.8178L12 12.5855L10.2322 10.8178L8.81802 12.232L10.5858 13.9997L8.81802 15.7675L10.2322 17.1817L12 15.4139L13.7678 17.1817L15.182 15.7675L13.4142 13.9997ZM9 4V6H15V4H9Z"></path></svg>
                删除
              </button>
              <input type="file" id="inputBg" accept="image/*" style="display:none" onchange="App.uploadImageHandler(this, v => { State.data.bgImg = v; App.updateThumb('thumbBg', 'labelBg', v, '已载入大背景（点击更换）'); })" />
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-weapon">
        <div>
          <div class="ios-section-header">武器推荐</div>
          <div id="weaponEditor" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-artifact">
        <div>
          <div class="ios-section-header" id="artifactSectionHead"></div>
          <div id="artifactEditor" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-talent">
        <div>
          <div class="ios-section-header">天赋加点优先级</div>
          <div class="ios-group">
            <div class="field-grid three">
              <label class="ios-field">普通攻击<input type="text" id="talentA" oninput="App.setField('talentA', this.value)" /></label>
              <label class="ios-field">元素战技<input type="text" id="talentE" oninput="App.setField('talentE', this.value)" /></label>
              <label class="ios-field">元素爆发<input type="text" id="talentQ" oninput="App.setField('talentQ', this.value)" /></label>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-stats">
        <div>
          <div class="ios-section-header">主副词条推荐</div>
          <div class="ios-group">
            <div class="field-grid three">
              <label class="ios-field">时之沙<input type="text" id="sandMain" oninput="App.setField('sandMain', this.value)" /></label>
              <label class="ios-field">空之杯<input type="text" id="gobMain" oninput="App.setField('gobMain', this.value)" /></label>
              <label class="ios-field">理之冠<input type="text" id="cirMain" oninput="App.setField('cirMain', this.value)" /></label>
            </div>
            <div style="padding:0 10px 10px 10px;">
              <label class="ios-field">副词条优先顺序<input type="text" id="subStats" oninput="App.setField('subStats', this.value)" /></label>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-panel">
        <div>
          <div class="ios-section-header">主属性（三选一）</div>
          <div class="ios-group">
            <div class="ios-row" style="gap:10px;flex-wrap:wrap;">
              <label class="ios-field" style="flex:1;min-width:130px;">属性类型
                <select id="panelPrimaryKey" onchange="App.setPanelPrimaryKey(this.value)">
                  <option value="hp">生命值</option>
                  <option value="atk">攻击力</option>
                  <option value="def">防御力</option>
                </select>
              </label>
              <label class="ios-field" style="flex:1;min-width:130px;">数值
                <input type="text" id="panelPrimaryValue" placeholder="留空显示「任意」" oninput="App.setPanelField('primaryValue', this.value)" />
              </label>
            </div>
          </div>
        </div>
        <div>
          <div class="ios-section-header">副属性面板</div>
          <div class="ios-group">
            <div class="field-grid">
              <label class="ios-field">暴击率<input type="text" id="panelCr" placeholder="留空显示「任意」" oninput="App.setPanelField('cr', this.value)" /></label>
              <label class="ios-field">暴击伤害<input type="text" id="panelCd" placeholder="留空显示「任意」" oninput="App.setPanelField('cd', this.value)" /></label>
              <label class="ios-field">元素精通<input type="text" id="panelEm" placeholder="留空显示「任意」" oninput="App.setPanelField('em', this.value)" /></label>
              <label class="ios-field">充能效率<input type="text" id="panelEr" placeholder="留空显示「任意」" oninput="App.setPanelField('er', this.value)" /></label>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-cons">
        <div>
          <div class="ios-section-header">核心命座说明（点击圆圈点亮）</div>
          <div class="ios-group">
            <div class="cons-grid" id="constellationEditor"></div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-team">
        <div>
          <div class="ios-section-header">1号位主角色头像</div>
          <div class="ios-group">
            <div class="ios-row">
              <img id="thumbTeamCore" class="clickable-thumb" onclick="App.triggerUpload('inputTeamCore')" title="点击上传1号位头像" alt="" />
              <div style="flex:1;cursor:pointer;" onclick="App.triggerUpload('inputTeamCore')">
                <div style="font-size:13px;font-weight:500;" id="labelTeamCore">主角色一号位头像（点击更换）</div>
              </div>
              <button class="btn-xs btn-danger" onclick="App.clearImage('teamCoreImg', 'thumbTeamCore', 'labelTeamCore')" title="删除头像">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7ZM13.4142 13.9997L15.182 12.232L13.7678 10.8178L12 12.5855L10.2322 10.8178L8.81802 12.232L10.5858 13.9997L8.81802 15.7675L10.2322 17.1817L12 15.4139L13.7678 17.1817L15.182 15.7675L13.4142 13.9997ZM9 4V6H15V4H9Z"></path></svg>
                删除
              </button>
              <input type="file" id="inputTeamCore" accept="image/*" style="display:none" onchange="App.uploadImageHandler(this, v => { State.data.teamCoreImg = v; App.updateThumb('thumbTeamCore', 'labelTeamCore', v, '已载入1号位头像（点击更换）'); })" />
            </div>
          </div>
        </div>
        <div>
          <div class="ios-section-header">
            <span>配队参考方案（最多 3 组）</span>
            <button class="ios-btn-fill btn-xs" style="margin-left:auto;" onclick="App.addTeam()">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM11 11H7V13H11V17H13V13H17V11H13V7H11V11Z"></path></svg>
              添加
            </button>
          </div>
          <div id="teamEditor" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
      </div>

    </div>
  </section>

</main>

<div class="bottom-dock">
  <button class="export-btn-main" onclick="App.exportPNG()" id="exportMobileBtn">生成并导出 4K PNG</button>
</div>

<div class="toast-container" id="toastContainer"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">提示</div>
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-actions">
      <button type="button" id="modalCancel">取消</button>
      <button type="button" class="ios-btn-fill" id="modalConfirm">确定</button>
    </div>
  </div>
</div>

<!-- Tab 切换弹层：移动端 Bottom Sheet / 桌面端居中弹窗 -->
<div class="tab-sheet-backdrop" id="tabSheetBackdrop" onclick="App.closeTabSheet()"></div>

  <div class="tab-sheet-handle" aria-hidden="true"></div>
  <div class="tab-sheet-header" id="tabSheetTitle">选择编辑区域</div>
  <div class="tab-sheet-list" id="tabSheetList"></div>
</div>

let saveTimer = null;
function openDatabase() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_KEY, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveStateToIDB() {
  try {
    const db = await openDatabase();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(State.data, 'current_state');
  } catch (e) {}
}

function debouncedSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; saveStateToIDB(); }, 500);
}

async function loadStateFromIDB() {
  try {
    const db = await openDatabase();
    return new Promise(resolve => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get('current_state');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

/* =========================================================================
 * 【JS 模块 4】Toast 与 Confirm
 * ========================================================================= */
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'success' ? ' toast-success' : '');
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2400);
}

function showConfirm(title, message) {
  return new Promise(resolve => {
    const backdrop = document.getElementById('modalBackdrop');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    const cancelBtn = document.getElementById('modalCancel');
    const confirmBtn = document.getElementById('modalConfirm');
    const cleanup = (result) => {
      backdrop.classList.remove('show');
      cancelBtn.onclick = null;
      confirmBtn.onclick = null;
      backdrop.onclick = null;
      resolve(result);
    };
    cancelBtn.onclick = () => cleanup(false);
    confirmBtn.onclick = () => cleanup(true);
    backdrop.onclick = (e) => { if (e.target === backdrop) cleanup(false); };
    backdrop.classList.add('show');
  });
}

function esc(v) {
  return String(v ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function darken(hex, amt) {
  if (!hex || typeof hex !== 'string') return '#333333';
  let h = hex.startsWith('#') ? hex.slice(1) : hex;
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (h.length !== 6) return '#333333';
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  if ([r, g, b].some(v => isNaN(v))) return '#333333';
  const rr = Math.max(0, r - amt);
  const gg = Math.max(0, g - amt);
  const bb = Math.max(0, b - amt);
  return `#${rr.toString(16).padStart(2,'0')}${gg.toString(16).padStart(2,'0')}${bb.toString(16).padStart(2,'0')}`;
}

function placeholder(label) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><text x="100" y="112" font-size="52" text-anchor="middle" fill="#666" font-family="sans-serif">${esc(label)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function formatBytes(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function moveItem(arr, from, dir) {
  const to = from + dir;
  if (to < 0 || to >= arr.length) return false;
  [arr[from], arr[to]] = [arr[to], arr[from]];
  return true;
}

/* =========================================================================
 * 【JS 模块 5.5】图标 viewBox 收紧
 * ========================================================================= */
function tightenSvgToSquareViewBox(svgString) {
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  host.style.position = 'absolute';
  host.style.left = '-9999px';
  host.style.top = '-9999px';
  host.style.width = '1px';
  host.style.height = '1px';
  host.style.visibility = 'hidden';
  host.setAttribute('aria-hidden', 'true');
  document.body.appendChild(host);

  const wrap = document.createElementNS(ns, 'svg');
  wrap.innerHTML = svgString;
  host.appendChild(wrap);

  const paths = wrap.querySelectorAll('path');
  if (!paths.length) { host.remove(); return svgString; }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  paths.forEach(p => {
    let b;
    try { b = p.getBBox(); } catch (e) { return; }
    if (!b || (b.width === 0 && b.height === 0)) return;
    minX = Math.min(minX, b.x);
    minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.width);
    maxY = Math.max(maxY, b.y + b.height);
  });
  host.remove();
  if (!isFinite(minX) || !isFinite(minY)) return svgString;

  const w = maxX - minX;
  const h = maxY - minY;
  const side = Math.max(w, h);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const nx = cx - side / 2;
  const ny = cy - side / 2;
  const fmt = n => +n.toFixed(4);
  const vb = `${fmt(nx)} ${fmt(ny)} ${fmt(side)} ${fmt(side)}`;
  return svgString.replace(/viewBox="[^"]*"/, `viewBox="${vb}"`);
}

function tightenAllIconViewBoxes() {
  Object.keys(ICONS).forEach(k => {
    ICONS[k] = tightenSvgToSquareViewBox(ICONS[k]);
  });
  Object.keys(ELEMENT_ICONS).forEach(k => {
    ELEMENT_ICONS[k] = tightenSvgToSquareViewBox(ELEMENT_ICONS[k]);
  });
  document.querySelectorAll('svg.icon').forEach(svg => {
    const outer = svg.outerHTML;
    const fixed = tightenSvgToSquareViewBox(outer);
    if (fixed !== outer) {
      const tpl = document.createElement('div');
      tpl.innerHTML = fixed;
      const next = tpl.firstElementChild;
      if (next) svg.replaceWith(next);
    }
  });
}

/* =========================================================================
 * 【JS 模块 6】SVG 绘制辅助
 * ========================================================================= */
function measureTextWidth(content, fontSize) {
  content = String(content || '');
  const family = State.data.fontData ? FONT_FAMILY_CUSTOM : FONT_FAMILY_DEFAULT;
  const canvas = measureTextWidth.canvas || (measureTextWidth.canvas = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  ctx.font = `${fontSize}px ${family}`;
  return ctx.measureText(content).width;
}
function fitSize(textContent, maxW, base, min = 8) {
  textContent = String(textContent || '');
  if (!textContent) return base;
  let size = base;
  while (size > min) { if (measureTextWidth(textContent, size) <= maxW) break; size -= 1; }
  return size;
}
function text(x, y, content, size, opts = {}) {
  const fill = opts.fill || '#fff';
  const anchor = opts.anchor || 'start';
  const weight = opts.weight || '400';
  const opacity = opts.opacity == null ? 1 : opts.opacity;
  const baseline = opts.baseline || 'middle';
  const parts = [
    `x="${x}"`, `y="${y}"`,
    `fill="${fill}"`, `font-size="${size}"`,
    `font-weight="${weight}"`, `text-anchor="${anchor}"`,
    `dominant-baseline="${baseline}"`, `opacity="${opacity}"`
  ];
  if (opts.stroke) {
    parts.push(
      `stroke="${opts.stroke}"`,
      `stroke-width="${opts.strokeWidth || 0}"`,
      `stroke-linejoin="round"`, `stroke-linecap="round"`,
      `paint-order="stroke fill"`
    );
  }
  if (opts.extra) parts.push(opts.extra);
  if (opts.field) parts.push(`data-field="${esc(opts.field)}"`);
  if (opts.fit) {
    parts.push(
      `data-fit-max-w="${opts.fit.maxW}"`,
      `data-fit-base="${opts.fit.base}"`,
      `data-fit-min="${opts.fit.min || 8}"`
    );
  }
  return `<text ${parts.join(' ')}>${esc(content)}</text>`;
}
function rect(x, y, w, h, fill, stroke = '', sw = 0, rx = 8, opacity = 1, clip = '') {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" opacity="${opacity}" ${stroke ? `stroke="${stroke}" stroke-width="${sw}"` : ''}${clip ? ` clip-path="url(#${clip})"` : ''}/>`;
}
function image(href, x, y, w, h, fit = 'xMidYMid slice', clip = '') {
  return `<image href="${href}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="${fit}" ${clip}/>`;
}
function wrapTextLines(content, maxW, size, maxLines) {
  const chars = Array.from(String(content || ''));
  if (!chars.length) return [];
  const lines = [];
  let line = '';
  chars.forEach(ch => {
    const next = line + ch;
    if (!line || measureTextWidth(next, size) <= maxW) { line = next; }
    else { lines.push(line); line = ch; }
  });
  if (line) lines.push(line);
  if (lines.length > maxLines) return null;
  if (lines.some(l => measureTextWidth(l, size) > maxW)) return null;
  return lines;
}
function wrappedCenteredText(x, areaTop, areaW, areaH, content, maxW, base, min, fill = '#ddd') {
  const centerX = x + areaW / 2;
  for (let size = base; size >= min; size -= 1) {
    const lineH = Math.round(size * 1.08);
    const maxLines = Math.max(1, Math.floor(areaH / lineH));
    const lines = wrapTextLines(content, maxW, size, maxLines);
    if (!lines) continue;
    const blockH = lines.length * lineH;
    const firstY = areaTop + (areaH - blockH) / 2 + lineH / 2;
    return lines.map((line, i) => text(centerX, firstY + i * lineH, line, size, { fill, anchor: 'middle' })).join('');
  }
  return text(centerX, areaTop + areaH / 2, content, min, { fill, anchor: 'middle' });
}
function wrappedLeftText(x, areaTop, areaW, areaH, content, maxW, base, min, fill = '#ddd', padY = 0) {
  const fitH = areaH - padY * 2;
  for (let size = base; size >= min; size -= 1) {
    const lineH = Math.round(size * 1.08);
    const maxLines = Math.max(1, Math.floor(fitH / lineH));
    const lines = wrapTextLines(content, maxW, size, maxLines);
    if (!lines) continue;
    const blockH = lines.length * lineH;
    const firstY = areaTop + (areaH - blockH) / 2 + lineH / 2;
    return lines.map((line, i) => text(x, firstY + i * lineH, line, size, { fill })).join('');
  }
  const lineH = Math.round(min * 1.08);
  const forcedLines = wrapTextLines(content, maxW, min, 999);
  if (forcedLines && forcedLines.length) {
    const firstY = areaTop + lineH / 2;
    return forcedLines.map((line, i) => text(x, firstY + i * lineH, line, min, { fill })).join('');
  }
  return text(x, areaTop + areaH / 2, content, min, { fill });
}

function sectionTitle(x, y, title) {
  const fs = LAYOUT.title.fs;
  const dotR = LAYOUT.title.dotR;
  const dotGap = LAYOUT.title.dotGap;
  const textX = x + dotR * 2 + dotGap;
  return `
    <circle cx="${x + dotR}" cy="${y}" r="${dotR}" fill="${State.data.theme || '#939393'}" filter="url(#glowTheme)"/>
    ${text(textX, y, title, fs, { weight: 500 })}
  `;
}

function slot(x, y, size, img, name, key, field) {
  const cp = `clip_${key}`;
  const radius = Math.round(size * LAYOUT.radius.slotFactor);
  const labelH = Math.round(size / 5);
  const maxW = size - (radius / 3) * 2;
  const base = labelH * 0.8;
  const labelSize = fitSize(name, maxW, base, 3);
  const labelTextY = y + size - labelH / 2 + labelSize * 0.35;
  const showLabel = !!(name || field);
  let labelEl = '';
  if (showLabel) {
    const opts = { anchor: 'middle', baseline: 'alphabetic' };
    if (field) {
      opts.field = field;
      opts.fit = { maxW, base, min: 3 };
    }
    labelEl = text(x + size / 2, labelTextY, name || '', labelSize, opts);
  }
  const bg = showLabel
    ? `<rect x="${x}" y="${y + size - labelH}" width="${size}" height="${labelH}" fill="url(#slotBottomGrad)" clip-path="url(#${cp})"/>`
    : '';
  return `
    <clipPath id="${cp}"><rect x="${x}" y="${y}" width="${size}" height="${size}" rx="${radius}"/></clipPath>
    ${rect(x, y, size, size, 'rgba(0,0,0,.5)', '', 0, radius)}
    ${image(img || placeholder(''), x, y, size, size, 'xMidYMid slice', `clip-path="url(#${cp})"`)}
    ${bg}${labelEl}
  `;
}

function doubleArtifact(x, y, size, a, key, field) {
  const gap = LAYOUT.doubleGap;
  const w = size * 2 + gap;
  const h = size;
  const radius = Math.round(size * LAYOUT.radius.slotFactor);
  const cpL = `clip_${key}_l`;
  const cpR = `clip_${key}_r`;
  const labelH = Math.round(h / 5);
  const maxW = w - (radius / 3) * 2;
  const base = labelH * 0.8;
  const fs = fitSize(a.name, maxW, base, 4);
  const labelTextY = y + h - labelH / 2 + fs * 0.35;
  const showLabel = !!(a.name || field);
  let labelEl = '';
  if (showLabel) {
    const opts = { anchor: 'middle', baseline: 'alphabetic' };
    if (field) {
      opts.field = field;
      opts.fit = { maxW, base, min: 4 };
    }
    labelEl = text(x + w / 2, labelTextY, a.name || '', fs, opts);
  }
  const bg = showLabel ? `
    <rect x="${x}" y="${y + h - labelH}" width="${size}" height="${labelH}" fill="url(#slotBottomGrad)" clip-path="url(#${cpL})"/>
    <rect x="${x + size}" y="${y + h - labelH}" width="${gap}" height="${labelH}" fill="url(#slotBottomGrad)"/>
    <rect x="${x + size + gap}" y="${y + h - labelH}" width="${size}" height="${labelH}" fill="url(#slotBottomGrad)" clip-path="url(#${cpR})"/>
  ` : '';
  return `
    <clipPath id="${cpL}"><path d="M${x + radius} ${y}H${x + size}V${y + size}H${x + radius}Q${x} ${y + size} ${x} ${y + size - radius}V${y + radius}Q${x} ${y} ${x + radius} ${y}Z"/></clipPath>
    <clipPath id="${cpR}"><path d="M${x + size + gap} ${y}H${x + size + gap + size - radius}Q${x + size + gap + size} ${y} ${x + size + gap + size} ${y + radius}V${y + size - radius}Q${x + size + gap + size} ${y + size} ${x + size + gap + size - radius} ${y + size}H${x + size + gap}Z"/></clipPath>
    <rect x="${x}" y="${y}" width="${size}" height="${size}" fill="rgba(0,0,0,.5)" clip-path="url(#${cpL})"/>
    <rect x="${x + size + gap}" y="${y}" width="${size}" height="${size}" fill="rgba(0,0,0,.5)" clip-path="url(#${cpR})"/>
    ${image(a.img1 || placeholder(''), x, y, size, size, 'xMidYMid slice', `clip-path="url(#${cpL})"`)}
    ${image(a.img2 || placeholder(''), x + size + gap, y, size, size, 'xMidYMid slice', `clip-path="url(#${cpR})"`)}
    ${bg}${labelEl}
  `;
}

function midSection(layerCfg, title, contentSvg) {
  const y = LAYOUT.layers.mid.y;
  const h = LAYOUT.layers.mid.h;
  return `
    ${panelRect(layerCfg.x, y, layerCfg.w, h, LAYOUT.radius.panel)}

    ${contentSvg}`;
}

function buildWeapons() {
  const keys = WEAPON_ORDER.filter(k => State.data.weaponData[k].length);
  if (!keys.length) return '';
  let out = '';
  const step = LAYOUT.iconSize + LAYOUT.iconGap;
  const size = LAYOUT.iconSize;
  const slotY = LAYOUT.weaponSlotY;
  const labelFs = LAYOUT.weaponLabelFs;
  const labelOffsetY = LAYOUT.weaponLabelOffsetY;
  const sepGap = 20;
  let x = LAYOUT.right.x + LAYOUT.padX;
  keys.forEach((k, groupIndex) => {
    if (groupIndex > 0) {
      out += `<rect x="${x - sepGap - 1}" y="${slotY}" width="2" height="${size}" fill="url(#sepGrad)"/>`;
    }
    const group = State.data.weaponData[k];
    group.slice(0, WEAPON_MAX).forEach((w, i) => {
      out += slot(x + i * step, slotY, size, w.img, w.name, `w_${k}_${i}`, `weapon.${k}.${i}.name`);
    });
    const labelTop = slotY + size + labelOffsetY;
    const labelY = labelTop + labelFs / 2;
    const labelX = x + Math.max(26, (group.length * step - (step - size)) / 2);
    out += text(labelX, labelY, WEAPON_LABELS[k], labelFs, { fill: LAYOUT.labelColor, anchor: 'middle', weight: 500 });
    x += group.length * step + (sepGap + 2 + sepGap) - (step - size);
  });
  return out;
}

function buildArtifacts() {
  if (!State.data.artifactData.length) return '';
  let out = '';
  const step = LAYOUT.iconSize + LAYOUT.iconGap;
  const size = LAYOUT.iconSize;
  const doubleStep = size * 2 + LAYOUT.doubleGap + LAYOUT.iconGap;
  const iconY = LAYOUT.artifactSlotY;
  let x = LAYOUT.layers.artifact.x + LAYOUT.padX;
  State.data.artifactData.forEach((a, i) => {
    if (a.type === 'double') {
      out += doubleArtifact(x, iconY, size, a, `a_${i}`, `artifact.${i}.name`);
      x += doubleStep;
    } else {
      out += slot(x, iconY, size, a.img, a.name, `a_${i}`, `artifact.${i}.name`);
      x += step;
    }
  });
  return out;
}

function renderArtifactIcon(iconKey, cx, cy, size) {
  const paths = ARTIFACT_ICON_PATHS[iconKey];
  if (!paths) return '';
  const scale = size / 1024;
  const iconX = cx - size / 2;
  const iconY = cy - size / 2;
  const pathsStr = paths.map(d => `<path d="${d}"/>`).join('');
  return `<g transform="translate(${iconX}, ${iconY}) scale(${scale})" fill="${State.data.theme}" filter="url(#glowThemeSmall)">${pathsStr}</g>`;
}

function statBox(x, y, w, h, iconKey, title, value, field) {
  const boxRx = LAYOUT.radius.inner;
  const iconSize = LAYOUT.stat.iconSize;
  const gap = 4;
  const labelFs = LAYOUT.stat.labelFs;
  const labelW = measureTextWidth(title, labelFs);
  const totalW = iconSize + gap + labelW;
  const startX = x + (w - totalW) / 2;
  const centerY = y + 16;
  const iconCx = startX + iconSize / 2;
  const textX = startX + iconSize + gap;
  const iconElem = renderArtifactIcon(iconKey, iconCx, centerY, iconSize);
  const valueAreaTop = y + 32;
  const valueAreaH = h - 36;
  const valueMidY = valueAreaTop + valueAreaH / 2;
  const maxW = w - boxRx * 2;
  const opts = { fill: '#fff', anchor: 'middle' };
  if (field) {
    opts.field = field;
    opts.fit = { maxW, base: 12, min: 6 };
  }
  return `
    ${rect(x, y, w, h, LAYOUT.innerBoxFill, '', 0, boxRx)}
    ${iconElem}
    ${text(textX, centerY, title, labelFs, { fill: LAYOUT.labelColor, weight: 500 })}
    ${text(x + w / 2, valueMidY, value || '', fitSize(value, maxW, 12, 6), opts)}
  `;
}

function buildStats() {
  const layer = LAYOUT.layers.mid.stat;
  const contentX = layer.x + LAYOUT.padX;
  const contentW = layer.w - LAYOUT.padX * 2;
  const contentY = MID_CONTENT_Y;
  const boxW = LAYOUT.stat.boxW;
  const boxH = LAYOUT.stat.boxH;
  const gap = LAYOUT.stat.gap;
  const subH = LAYOUT.stat.subH;
  const subGap = LAYOUT.stat.subGap;
  const subY = contentY + boxH + subGap;
  const totalW = boxW * 3 + gap * 2;
  const offsetX = contentX + (contentW - totalW) / 2;

  const subLabelX = offsetX + 10;
  const subLabelFs = LAYOUT.stat.subLabelFs;
  const subLabelW = measureTextWidth('副词条：', subLabelFs);
  const subTextX = subLabelX + subLabelW + 5;
  const subRightLimit = offsetX + totalW - 10;
  const subTextW = subRightLimit - subTextX;

    ${statBox(offsetX, contentY, boxW, boxH, 'flower', '时之沙', State.data.sandMain, 'stat.sandMain')}

    ${statBox(offsetX + (boxW + gap) * 2, contentY, boxW, boxH, 'crown', '理之冠', State.data.cirMain, 'stat.cirMain')}

function buildTalents() {
  const layer = LAYOUT.layers.talent;
  const contentX = layer.x + LAYOUT.padX;
  const contentW = layer.w - LAYOUT.padX * 2;
  const contentY = LAYOUT.layers.row2.y + LAYOUT.contentOffsetY;
  const contentH = LAYOUT.talent.boxH;
  const colGap = LAYOUT.talent.colGap;
  const colW = (contentW - colGap * 2) / 3;
  const r = LAYOUT.radius.inner;
  const items = [
    ['普通攻击', State.data.talentA, 'talent.A'],

    return `
      ${rect(x, contentY, colW, contentH, LAYOUT.innerBoxFill, '', 0, r)}

function buildPanel() {
  const d = State.data.panel || {};
  const P = LAYOUT.panel;
  const layer = LAYOUT.layers.mid.panel;
  const contentX = layer.x + LAYOUT.padX;
  const baseY = MID_CONTENT_Y;
  const r = LAYOUT.radius.inner;

  const primaryLabel = PANEL_PRIMARY_LABELS[d.primaryKey] || PANEL_PRIMARY_LABELS.hp;

  const items = [
    { key: 'primaryValue', label: primaryLabel, value: d.primaryValue || '' },
    { key: 'em',           label: '元素精通',   value: d.em || '' },
    { key: 'cr',           label: '暴击率',     value: d.cr || '' },
    { key: 'cd',           label: '暴击伤害',   value: d.cd || '' },
    { key: 'er',           label: '充能效率',   value: d.er || '' }
  ];

  const { cols, cellW, cellH, gapX, gapY, innerPadX, labelFs, valueFs } = P;

  return items.map((it, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = contentX + col * (cellW + gapX);
    const cy = baseY + row * (cellH + gapY);
    const midY = cy + cellH / 2;
    const empty = !it.value;
    return `
      ${rect(cx, cy, cellW, cellH, LAYOUT.innerBoxFill, '', 0, r)}
      ${text(cx + innerPadX, midY, it.label, labelFs,
             { fill: LAYOUT.labelColor, weight: 500 })}
      ${text(cx + cellW - innerPadX, midY, empty ? PANEL_EMPTY_TEXT : it.value, valueFs,
             { fill: empty ? EMPTY_FILL : '#fff', anchor: 'end', weight: 400,
               field: `panel.${it.key}` })}`;
  }).join('');
}

function buildConstellations() {
  const layer = LAYOUT.layers.mid.cons;
  const colX = layer.x + LAYOUT.padX;
  const boxW = LAYOUT.cons.boxW;
  const boxH = LAYOUT.cons.boxH;
  const gapX = LAYOUT.cons.gapX;
  const gapY = LAYOUT.cons.gapY;
  const contentY = MID_CONTENT_Y;
  const theme = State.data.theme;
  const list = State.data.constellationData;
  return list.map((c, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const x = colX + col * (boxW + gapX);
    const y = contentY + row * (boxH + gapY);
    const active = !!c.active;
    const boxRx = LAYOUT.radius.inner;
    const badgeCx = x + 15;
    const badgeCy = y + boxH / 2;
    const descX = x + 30;
    const descRightLimit = x + boxW - 5;
    const descAreaW = descRightLimit - descX;
    const descText = c.desc
      ? wrappedLeftText(descX, y + 2, descAreaW, boxH - 4, c.desc, descAreaW, LAYOUT.cons.descFs, 6, '#fff')
      : '';
    const badgeFill = active ? theme : 'rgba(0,0,0,.35)';
    if (active) {
      return `<rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="${boxRx}" fill="${theme}" fill-opacity="0.15" stroke="${theme}" stroke-width="2" stroke-opacity="0.75"/>
        <circle cx="${badgeCx}" cy="${badgeCy}" r="10" fill="${badgeFill}" filter="url(#glowTheme)"/>
        ${text(badgeCx, badgeCy + 0.5, i + 1, LAYOUT.cons.seqFs, { fill: '#fff', anchor: 'middle', weight: 500 })}
        ${descText}`;
    }
    return `<rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="${boxRx}" fill="${LAYOUT.innerBoxFill}"/>
      <circle cx="${badgeCx}" cy="${badgeCy}" r="10" fill="${badgeFill}"/>
      ${text(badgeCx, badgeCy + 0.5, i + 1, LAYOUT.cons.seqFs, { fill: '#fff', anchor: 'middle', weight: 500 })}
