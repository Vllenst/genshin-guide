<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORS 测试</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 16px; font-size: 16px; line-height: 1.8; background: #1a1a1a; color: #fff; }
  .row { padding: 12px; border-radius: 8px; margin-bottom: 10px; background: #2a2a2a; }
  .ok { border-left: 5px solid #4CAF50; }
  .fail { border-left: 5px solid #F44336; }
  .pending { border-left: 5px solid #FFC107; }
  .label { font-weight: 600; font-size: 14px; color: #aaa; margin-bottom: 4px; }
  .value { font-size: 14px; word-break: break-all; }
  pre { background: #000; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>

<div id="out"></div>

<script>
const TEST_URL = 'https://fastcdn.hoyoverse.com/content-v2/hk4e/155630/bba9c2465080286db1fc992f0fbfda2b_3302179026631189762.png';

const out = document.getElementById('out');
function addRow(id, cls, label, value) {
  const div = document.createElement('div');
  div.className = 'row ' + cls;
  div.innerHTML = '<div class="label">' + label + '</div><div class="value" id="' + id + '">' + value + '</div>';
  out.appendChild(div);
}

addRow('t1', 'pending', '① fetch + CORS 模式', '测试中…');
addRow('t2', 'pending', '② 服务器返回的 ACAO 头', '等 ① 完成');
addRow('t3', 'pending', '③ new Image() + crossOrigin 加载', '待测试');
addRow('t4', 'pending', '④ canvas drawImage + toDataURL', '待测试');

(async function () {
  /* ① fetch */
  let blob = null;
  try {
    const res = await fetch(TEST_URL, { mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const acao = res.headers.get('access-control-allow-origin');
    blob = await res.blob();
    document.getElementById('t1').parentElement.className = 'row ok';
    document.getElementById('t1').textContent = '成功 · ' + Math.round(blob.size / 1024) + ' KB';
    document.getElementById('t2').parentElement.className = 'row ok';
    document.getElementById('t2').textContent = acao === null ? '(null)' : acao;
  } catch (e) {
    document.getElementById('t1').parentElement.className = 'row fail';
    document.getElementById('t1').textContent = '失败：' + e.message;
    document.getElementById('t2').parentElement.className = 'row fail';
    document.getElementById('t2').textContent = '（fetch 失败，无法读取头）';
  }

  /* ③ new Image */
  let imgOk = false;
  let img = null;
  try {
    img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.crossOrigin = 'anonymous';
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('图片加载失败'));
      i.src = TEST_URL;
    });
    imgOk = true;
    document.getElementById('t3').parentElement.className = 'row ok';
    document.getElementById('t3').textContent = '成功 · ' + img.naturalWidth + '×' + img.naturalHeight;
  } catch (e) {
    document.getElementById('t3').parentElement.className = 'row fail';
    document.getElementById('t3').textContent = '失败：' + e.message;
  }

  /* ④ canvas */
  if (imgOk && img) {
    try {
      const c = document.createElement('canvas');
      c.width = 100; c.height = 100;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 100, 100);
      const dataURL = c.toDataURL('image/png');
      document.getElementById('t4').parentElement.className = 'row ok';
      document.getElementById('t4').textContent = '成功 · ' + Math.round(dataURL.length / 1024) + ' KB（前 60 字符：' + dataURL.slice(0, 60) + '）';
    } catch (e) {
      document.getElementById('t4').parentElement.className = 'row fail';
      document.getElementById('t4').textContent = '失败：' + e.message;
    }
  } else {
    document.getElementById('t4').parentElement.className = 'row fail';
    document.getElementById('t4').textContent = '跳过（③ 已失败）';
  }
})();
</script>

</body>
</html>
