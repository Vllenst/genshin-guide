<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2EFEA">
<title>原神攻略工具集</title>
<link rel="stylesheet" href="shared-theme.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: 100dvh; }
html, body, button { font-family: var(--std-font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  background: var(--bg-base);
  color: var(--text-primary);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  letter-spacing: -0.2px;
}

.app-navbar {
  flex: none;
  height: 52px;
  padding: 0 12px;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 40;
}
.nav-btn {
  width: 34px;
  height: 34px;
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 8px;
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
  padding: 0;
  flex-shrink: 0;
}
.nav-btn:hover { background: var(--bg-hover); }
.nav-btn:active { transform: scale(.94); }
.nav-btn svg { width: 18px; height: 18px; display: block; }

.nav-title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 4px;
}
.nav-title-icon { width: 18px; height: 18px; flex-shrink: 0; color: var(--accent); }
.nav-title-icon svg { width: 100%; height: 100%; display: block; }
.nav-title-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nav-title-sep {
  color: var(--text-tertiary);
  font-weight: 400;
  margin: 0 1px;
}

.sidebar-backdrop {
  position: fixed; inset: 0;
  background: var(--mask);
  z-index: 90;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s cubic-bezier(.16,1,.3,1);
}
.sidebar-backdrop.active { opacity: 1; pointer-events: auto; }

.sidebar-drawer {
  position: fixed;
  top: 0; bottom: 0; left: 0;
  width: 270px;
  max-width: 85vw;
  background: var(--bg-base);
  border-right: 1px solid var(--border-subtle);
  z-index: 100;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.16,1,.3,1);
  box-shadow: 12px 0 32px var(--shadow-nav);
}
.sidebar-drawer.open { transform: translateX(0); }

.sidebar-header {
  padding: 14px 14px 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.sidebar-header h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}

.sidebar-menu {
  padding: 10px 8px 20px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}

.menu-main {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: color .15s, border-color .15s;
  position: relative;
  margin-top: 4px;
}
.menu-main:first-child { margin-top: 0; }
.menu-main:hover { color: var(--text-primary); }
.menu-main.active {
  color: var(--text-primary);
  font-weight: 600;
  background: var(--bg-surface);
  border-color: var(--border-subtle);
}
.menu-main.active::before {
  content: '';
  position: absolute;
  left: 3px; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  border-radius: 2px;
  background: var(--accent);
}
.menu-main-icon {
  width: 22px; height: 22px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.menu-main-icon svg { width: 20px; height: 20px; display: block; }
.menu-main.active .menu-main-icon { color: var(--accent); }
.menu-main-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.menu-main-arrow {
  width: 16px; height: 16px;
  flex-shrink: 0;
  color: var(--text-tertiary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .25s cubic-bezier(.16,1,.3,1);
}
.menu-main-arrow svg { width: 100%; height: 100%; display: block; }
.menu-main.expanded .menu-main-arrow { transform: rotate(180deg); }

.menu-sub {
  overflow: hidden;
  max-height: 0;
  transition: max-height .3s cubic-bezier(.16,1,.3,1);
}
.menu-sub.open { max-height: 600px; }
.menu-sub-inner {
  padding: 4px 0 6px 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.menu-sub-item {
  width: 100%;
  display: flex;
  align-items: center;
  padding: 9px 10px 9px 42px;
  border-radius: 10px;
  background: transparent;
  border: 0;
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: color .15s;
  position: relative;
}
.menu-sub-item:hover { color: var(--text-primary); }
.menu-sub-item.active {
  color: var(--accent);
  font-weight: 600;
  background: var(--accent-soft);
}
.menu-sub-item .dot {
  position: absolute;
  left: 24px;
  top: 50%;
  transform: translateY(-50%);
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--border-default);
  transition: background .15s, transform .15s;
}
.menu-sub-item.active .dot {
  background: var(--accent);
  transform: translateY(-50%) scale(1.35);
}

.frame-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg-base);
}
.frame-view {
  position: absolute;
  inset: 0;
  display: none;
}
.frame-view.active { display: block; }
.frame-view iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: var(--bg-base);
}

.loading-mask {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: var(--bg-base);
  color: var(--text-secondary);
  font-size: 13px;
  pointer-events: none;
}
.loading-mask.show { display: flex; }
.spinner {
  width: 24px; height: 24px;
  border: 2.5px solid var(--border-subtle);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="app-navbar">
  <button type="button" class="nav-btn" id="btnMenu" aria-label="打开菜单"></button>
  <div class="nav-title">
    <span class="nav-title-icon" id="navIcon"></span>
    <span class="nav-title-text" id="navText">原神攻略工具集</span>
  </div>
  <button type="button" class="nav-btn" id="btnTheme" aria-label="切换主题"></button>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar-drawer" id="sidebarDrawer">
  <div class="sidebar-header">
    <h3>工具导航</h3>
    <button type="button" class="nav-btn" id="btnClose" aria-label="关闭菜单"></button>
  </div>
  <nav class="sidebar-menu" id="sidebarMenu"></nav>
</aside>

<main class="frame-container" id="frameContainer">
  <div class="loading-mask" id="loadingMask">
    <div class="spinner"></div>
    <span>正在载入工具…</span>
  </div>
</main>

<script src="icons.js"></script>
<script>
'use strict';

const TOOLS = [
  { key: 'character',   label: '角色一图流', src: 'tools/character.html',   icon: 'character',   iconBold: 'characterBold' },
  { key: 'image-tools', label: '图片处理',   src: 'tools/image-tools.html', icon: 'imageTools',  iconBold: 'imageToolsBold' },
  { key: 'video-cover', label: '封面制作',   src: 'tools/video-cover.html', icon: 'videoCover',  iconBold: 'videoCoverBold' },
  { key: 'chart',       label: '图表',       src: 'tools/chart.html',       icon: 'chart',       iconBold: 'chartBold' },
  { key: 'tier',        label: '角色梯队',   src: 'tools/tier.html',        icon: 'tier',        iconBold: 'tierBold' }
];

const FALLBACK_SUBTOOLS = {
  'character':   [],
  'image-tools': [
    { key: 'background',  label: '背景修改' },
    { key: 'blend',       label: '双图羽化' },
    { key: 'overlay',     label: '对位裁切' },
    { key: 'collage',     label: '图层拼接' },
    { key: 'weapon-icon', label: '武器图标' },
    { key: 'weapon-card', label: '武器卡片' },
    { key: 'achievement', label: '成就制作' }
  ],
  'video-cover': [
    { key: 'video',      label: '视频封面' },
    { key: 'collection', label: '合集封面' }
  ],
  'chart': [
    { key: 'radar', label: '雷达图' },
    { key: 'bar',   label: '柱状图' }
  ],
  'tier': []
};

const SUBTOOLS = JSON.parse(JSON.stringify(FALLBACK_SUBTOOLS));
const DEFAULT_TOOL = 'character';
const STORAGE_KEY = 'gtt_active_tool';
const THEME_KEY = 'gtt_theme';

const frameContainer = document.getElementById('frameContainer');
const sidebarDrawer  = document.getElementById('sidebarDrawer');
const sidebarBackdrop= document.getElementById('sidebarBackdrop');
const sidebarMenu    = document.getElementById('sidebarMenu');
const loadingMask    = document.getElementById('loadingMask');
const navIcon        = document.getElementById('navIcon');
const navText        = document.getElementById('navText');
const btnMenu        = document.getElementById('btnMenu');
const btnClose       = document.getElementById('btnClose');
const btnTheme       = document.getElementById('btnTheme');

const frameCache = new Map();

let currentTheme = 'light';

function applyTheme(theme) {
  currentTheme = theme === 'dark' ? 'dark' : 'light';

  document.documentElement.classList.add('theme-switching');
  document.documentElement.setAttribute('data-theme', currentTheme);

  frameCache.forEach(record => {
    if (!record.loaded) return;
    try {
      var doc = record.iframe.contentDocument;
      if (doc && doc.documentElement) {
        doc.documentElement.classList.add('theme-switching');
        doc.documentElement.setAttribute('data-theme', currentTheme);
      }
    } catch (e) {}
    try {
      if (record.iframe.contentWindow) {
        record.iframe.contentWindow.postMessage({ type: 'theme', theme: currentTheme }, '*');
      }
    } catch (e) {}
  });

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', currentTheme === 'dark' ? '#121212' : '#F2EFEA');

  btnTheme.innerHTML = currentTheme === 'dark' ? ICONS.app.moonBold : ICONS.app.sunBold;

  try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {}

  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.documentElement.classList.remove('theme-switching');
    frameCache.forEach(record => {
      if (!record.loaded) return;
      try {
        var doc = record.iframe.contentDocument;
        if (doc && doc.documentElement) {
          doc.documentElement.classList.remove('theme-switching');
        }
      } catch (e) {}
    });
  }));
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

function openSidebar() {
  sidebarDrawer.classList.add('open');
  sidebarBackdrop.classList.add('active');
}
function closeSidebar() {
  sidebarDrawer.classList.remove('open');
  sidebarBackdrop.classList.remove('active');
}

function renderMenu() {
  sidebarMenu.innerHTML = '';

  TOOLS.forEach(tool => {
    const subs = SUBTOOLS[tool.key] || [];
    const isActive = tool.key === activeTool;
    const isExpanded = isActive;

    const mainBtn = document.createElement('button');
    mainBtn.type = 'button';
    mainBtn.className = 'menu-main' + (isActive ? ' active' : '') + (isExpanded && subs.length ? ' expanded' : '');
    mainBtn.dataset.tool = tool.key;

    const iconKey = isActive ? tool.iconBold : tool.icon;
    const iconSvg = (ICONS.nav && ICONS.nav[iconKey]) || '';

    mainBtn.innerHTML =
      '<span class="menu-main-icon">' + iconSvg + '</span>' +
      '<span class="menu-main-label">' + tool.label + '</span>' +
      (subs.length ? '<span class="menu-main-arrow">' + ICONS.ui.chevronDown + '</span>' : '');

    mainBtn.addEventListener('click', () => {
      if (subs.length) {
        if (tool.key === activeTool) {
          const subWrap = sidebarMenu.querySelector('.menu-sub[data-tool="' + tool.key + '"]');
          if (subWrap) {
            const willOpen = !subWrap.classList.contains('open');
            subWrap.classList.toggle('open', willOpen);
            mainBtn.classList.toggle('expanded', willOpen);
          }
        } else {
          selectSubtool(tool.key, subs[0].key);
        }
      } else {
        selectTool(tool.key);
      }
    });

    sidebarMenu.appendChild(mainBtn);

    if (subs.length) {
      const subWrap = document.createElement('div');
      subWrap.className = 'menu-sub' + (isExpanded ? ' open' : '');
      subWrap.dataset.tool = tool.key;

      const inner = document.createElement('div');
      inner.className = 'menu-sub-inner';

      subs.forEach(sub => {
        const subBtn = document.createElement('button');
        subBtn.type = 'button';
        subBtn.className = 'menu-sub-item' + (isActive && sub.key === activeSubtool ? ' active' : '');
        subBtn.dataset.tool = tool.key;
        subBtn.dataset.sub = sub.key;
        subBtn.innerHTML = '<span class="dot"></span><span>' + sub.label + '</span>';
        subBtn.addEventListener('click', () => selectSubtool(tool.key, sub.key));
        inner.appendChild(subBtn);
      });

      subWrap.appendChild(inner);
      sidebarMenu.appendChild(subWrap);
    }
  });
}

function ensureFrame(tool) {
  if (frameCache.has(tool.key)) return frameCache.get(tool.key);

  const view = document.createElement('div');
  view.className = 'frame-view';
  view.dataset.tool = tool.key;

  const iframe = document.createElement('iframe');
  iframe.title = tool.label;
  iframe.setAttribute('loading', 'lazy');
  iframe.src = tool.src;

  const record = { view, iframe, loaded: false, tool: tool };

  iframe.addEventListener('load', () => {
    record.loaded = true;
    if (view.classList.contains('active')) {
      loadingMask.classList.remove('show');
    }
    try {
      var doc = iframe.contentDocument;
      if (doc && doc.documentElement) {
        doc.documentElement.setAttribute('data-theme', currentTheme);
      }
    } catch (e) {}
    try {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'theme', theme: currentTheme }, '*');
      }
    } catch (e) {}
  });

  view.appendChild(iframe);
  frameContainer.appendChild(view);
  frameCache.set(tool.key, record);
  return record;
}

let activeTool = DEFAULT_TOOL;
let activeSubtool = '';

function selectTool(toolKey, opts) {
  const silent = opts && opts.silent;
  const tool = TOOLS.find(t => t.key === toolKey) || TOOLS[0];
  const subs = SUBTOOLS[tool.key] || [];

  activeTool = tool.key;
  activeSubtool = subs.length ? (activeSubtool && subs.some(s => s.key === activeSubtool) ? activeSubtool : subs[0].key) : '';

  updateNavTitle();
  renderMenu();

  const record = ensureFrame(tool);
  frameCache.forEach((r, k) => {
    r.view.classList.toggle('active', k === tool.key);
  });

  if (!record.loaded) {
    loadingMask.classList.add('show');
  } else {
    loadingMask.classList.remove('show');
  }

  try { localStorage.setItem(STORAGE_KEY, tool.key); } catch (e) {}
  if (!silent) {
    try { history.replaceState(null, '', '#' + tool.key); } catch (e) {}
  }

  closeSidebar();
}

function selectSubtool(toolKey, subKey, opts) {
  const silent = opts && opts.silent;
  const tool = TOOLS.find(t => t.key === toolKey);
  if (!tool) return;
  const subs = SUBTOOLS[toolKey] || [];
  if (!subs.some(s => s.key === subKey)) return;

  activeTool = toolKey;
  activeSubtool = subKey;

  updateNavTitle();
  renderMenu();

  const record = ensureFrame(tool);
  frameCache.forEach((r, k) => {
    r.view.classList.toggle('active', k === toolKey);
  });

  if (!record.loaded) {
    loadingMask.classList.add('show');
  } else {
    loadingMask.classList.remove('show');
  }

  if (record.loaded && record.iframe.contentWindow) {
    try {
      record.iframe.contentWindow.postMessage({
        type: 'navigate',
        subtool: subKey
      }, '*');
    } catch (e) {}
  }

  try { localStorage.setItem(STORAGE_KEY, toolKey); } catch (e) {}
  if (!silent) {
    try { history.replaceState(null, '', '#' + toolKey); } catch (e) {}
  }

  closeSidebar();
}

function updateNavTitle() {
  const tool = TOOLS.find(t => t.key === activeTool);
  if (!tool) return;

  const iconKey = tool.iconBold;
  const iconSvg = (ICONS.nav && ICONS.nav[iconKey]) || '';
  navIcon.innerHTML = iconSvg;

  const subs = SUBTOOLS[tool.key] || [];
  const sub = subs.find(s => s.key === activeSubtool);
  if (sub) {
    navText.innerHTML = tool.label + '<span class="nav-title-sep"> · </span>' + sub.label;
  } else {
    navText.textContent = tool.label;
  }
}

window.addEventListener('message', (e) => {
  const data = e.data;
  if (!data || typeof data !== 'object') return;

  if (data.type === 'subtools' && data.toolKey && Array.isArray(data.list)) {
    SUBTOOLS[data.toolKey] = data.list;
    renderMenu();
    updateNavTitle();
    if (data.toolKey === activeTool && data.list.length && !activeSubtool) {
      selectSubtool(data.toolKey, data.list[0].key, { silent: true });
    }
  }

  if (data.type === 'active-subtool' && data.toolKey && data.subtoolKey) {
    if (data.toolKey === activeTool && data.subtoolKey !== activeSubtool) {
      activeSubtool = data.subtoolKey;
      renderMenu();
      updateNavTitle();
    }
  }
});

btnMenu.addEventListener('click', openSidebar);
btnClose.addEventListener('click', closeSidebar);
sidebarBackdrop.addEventListener('click', closeSidebar);
btnTheme.addEventListener('click', toggleTheme);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSidebar();
});

(function init() {
  btnMenu.innerHTML = ICONS.app.hamburger;
  btnClose.innerHTML = ICONS.app.close;

  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) {}
  applyTheme(savedTheme);

  let initialKey = DEFAULT_TOOL;
  const hashKey = (location.hash || '').replace(/^#/, '');
  if (hashKey && TOOLS.some(t => t.key === hashKey)) {
    initialKey = hashKey;
  } else {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && TOOLS.some(t => t.key === saved)) initialKey = saved;
    } catch (e) {}
  }

  selectTool(initialKey, { silent: true });
})();

window.addEventListener('hashchange', () => {
  const key = (location.hash || '').replace(/^#/, '');
  if (key && TOOLS.some(t => t.key === key) && key !== activeTool) {
    selectTool(key, { silent: true });
  }
});
</script>
</body>
</html>
