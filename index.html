<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2EFEA">
<title>原神攻略工具集</title>
<style>
:root {
  --bg-base: #F2EFEA;
  --bg-surface: #FFFFFF;
  --bg-surface-2: #FAF8F5;
  --bg-hover: #F5F2ED;
  --border-subtle: #EBE6DF;
  --border-default: #DDD6CC;
  --text-primary: #1F1D1A;
  --text-secondary: #6B655C;
  --text-tertiary: #9C958A;
  --accent: #8B7355;
  --radius-sm: 8px;
  --radius-md: 12px;
  --std-font: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: 100dvh; }
html, body, button { font-family: var(--std-font); -webkit-font-smoothing: antialiased; }
body {
  background: var(--bg-base);
  color: var(--text-primary);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  letter-spacing: -0.2px;
}

/* ============ 顶部栏 ============ */
.app-navbar {
  flex: none;
  height: 52px;
  padding: 0 14px;
  background: rgba(242,239,234,.88);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 40;
}
.btn-toggle {
  width: 34px;
  height: 34px;
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  padding: 0;
  flex-shrink: 0;
}
.btn-toggle:hover { background: var(--bg-hover); }
.btn-toggle:active { transform: scale(.94); }
.btn-toggle svg { width: 18px; height: 18px; display: block; }
.nav-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}
.nav-title .emoji { font-size: 17px; line-height: 1; }
.nav-title .label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============ 侧边抽屉 ============ */
.sidebar-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31,29,26,.35);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 90;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s cubic-bezier(.16,1,.3,1);
}
.sidebar-backdrop.active { opacity: 1; pointer-events: auto; }
.sidebar-drawer {
  position: fixed;
  top: 0; bottom: 0; left: 0;
  width: 270px;
  max-width: 85vw;
  background: rgba(242,239,234,.97);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-right: 1px solid var(--border-subtle);
  z-index: 100;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.16,1,.3,1);
  box-shadow: 12px 0 32px rgba(31,29,26,.12);
}
.sidebar-drawer.open { transform: translateX(0); }
.sidebar-header {
  padding: 16px 14px 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.sidebar-header h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}
.sidebar-menu {
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border-radius: var(--radius-md);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: background .15s, color .15s, border-color .15s;
  position: relative;
}
.sidebar-item .item-emoji {
  font-size: 18px;
  width: 22px;
  text-align: center;
  flex-shrink: 0;
  line-height: 1;
}
.sidebar-item .item-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-item.active {
  background: var(--bg-surface);
  border-color: var(--border-subtle);
  color: var(--text-primary);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(31,29,26,.03);
}
.sidebar-item.active::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 20px;
  border-radius: 2px;
  background: var(--accent);
}

/* ============ 内容区 ============ */
.frame-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg-base);
}
.frame-view {
  position: absolute;
  inset: 0;
  display: none;
}
.frame-view.active { display: block; }
.frame-view iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: var(--bg-base);
}

/* 首次进入的加载遮罩 */
.loading-mask {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: rgba(242,239,234,.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text-secondary);
  font-size: 13px;
  pointer-events: none;
}
.loading-mask.show { display: flex; }
.spinner {
  width: 24px;
  height: 24px;
  border: 2.5px solid var(--border-subtle);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="app-navbar">
  <button type="button" class="btn-toggle" id="btnMenu" aria-label="打开菜单">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
  <div class="nav-title">
    <span class="emoji" id="navEmoji">🎴</span>
    <span class="label" id="navLabel">角色一图流</span>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<aside class="sidebar-drawer" id="sidebarDrawer">
  <div class="sidebar-header">
    <h3>工具导航</h3>
    <button class="btn-toggle" id="btnClose" aria-label="关闭菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
  </div>
  <nav class="sidebar-menu" id="sidebarMenu"></nav>
</aside>

<main class="frame-container" id="frameContainer">
  <div class="loading-mask" id="loadingMask">
    <div class="spinner"></div>
    <span>正在载入工具…</span>
  </div>
</main>

<script>
'use strict';

/* ========== 工具清单：新增工具时在这里加一行即可 ========== */
const TOOLS = [
  { key: 'character',   label: '角色一图流',      emoji: '🎴', src: 'character.html' },
  { key: 'image-tools', label: '图片处理整合',    emoji: '🖼️', src: 'image-tools.html' },
  { key: 'video-cover', label: '视频封面制作',    emoji: '🎬', src: 'video-cover.html' },
  { key: 'chart',       label: '图表生成器',      emoji: '📊', src: 'chart.html' },
  { key: 'weapon',      label: '武器卡片生成',    emoji: '⚔️', src: 'weapon.html' },
  { key: 'tier',        label: '角色梯队排行榜',  emoji: '🏆', src: 'tier.html' }
];

const DEFAULT_KEY = TOOLS[0].key;
const STORAGE_KEY = 'gtt_active_tool';

/* ========== DOM 引用 ========== */
const frameContainer = document.getElementById('frameContainer');
const sidebarDrawer = document.getElementById('sidebarDrawer');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const sidebarMenu = document.getElementById('sidebarMenu');
const loadingMask = document.getElementById('loadingMask');
const navEmoji = document.getElementById('navEmoji');
const navLabel = document.getElementById('navLabel');

/* ========== iframe 缓存：每个工具只创建一次 ========== */
const frameCache = new Map();   // key -> { view, iframe, loaded }

/* ========== 侧边菜单打开/关闭 ========== */
function openSidebar() {
  sidebarDrawer.classList.add('open');
  sidebarBackdrop.classList.add('active');
}
function closeSidebar() {
  sidebarDrawer.classList.remove('open');
  sidebarBackdrop.classList.remove('active');
}

/* ========== 创建工具 iframe（懒加载，只创建一次） ========== */
function ensureFrame(tool) {
  if (frameCache.has(tool.key)) return frameCache.get(tool.key);

  const view = document.createElement('div');
  view.className = 'frame-view';
  view.dataset.tool = tool.key;

  const iframe = document.createElement('iframe');
  iframe.title = tool.label;
  iframe.setAttribute('loading', 'lazy');
  iframe.src = tool.src;

  const record = { view, iframe, loaded: false };

  iframe.addEventListener('load', () => {
    record.loaded = true;
    // 如果加载完成的正好是当前激活的工具，隐藏遮罩
    if (view.classList.contains('active')) {
      loadingMask.classList.remove('show');
    }
  });

  view.appendChild(iframe);
  frameContainer.appendChild(view);
  frameCache.set(tool.key, record);
  return record;
}

/* ========== 切换工具 ========== */
function selectTool(key, opts) {
  const silent = opts && opts.silent;
  const tool = TOOLS.find(t => t.key === key) || TOOLS[0];
  const targetKey = tool.key;

  // 顶部标题
  navEmoji.textContent = tool.emoji;
  navLabel.textContent = tool.label;

  // 侧边菜单高亮
  sidebarMenu.querySelectorAll('.sidebar-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === targetKey);
  });

  // 内容区切换
  const record = ensureFrame(tool);
  frameCache.forEach((r, k) => {
    r.view.classList.toggle('active', k === targetKey);
  });

  // 首次未加载完成 → 显示遮罩
  if (!record.loaded) {
    loadingMask.classList.add('show');
  } else {
    loadingMask.classList.remove('show');
  }

  // 保存 & 更新 hash
  try { localStorage.setItem(STORAGE_KEY, targetKey); } catch (e) {}
  if (!silent) {
    try { history.replaceState(null, '', '#' + targetKey); } catch (e) {}
  }

  closeSidebar();
}

/* ========== 初始化侧边菜单 ========== */
TOOLS.forEach(tool => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'sidebar-item';
  btn.dataset.tool = tool.key;
  btn.innerHTML =
    '<span class="item-emoji">' + tool.emoji + '</span>' +
    '<span class="item-label">' + tool.label + '</span>';
  btn.addEventListener('click', () => selectTool(tool.key));
  sidebarMenu.appendChild(btn);
});

/* ========== 事件绑定 ========== */
document.getElementById('btnMenu').addEventListener('click', openSidebar);
document.getElementById('btnClose').addEventListener('click', closeSidebar);
sidebarBackdrop.addEventListener('click', closeSidebar);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSidebar();
});

/* 点击背景遮罩以外的抽屉内部不关闭 —— 已由 backdrop 处理，无需额外代码 */

/* ========== 启动：决定初始工具 ========== */
(function init() {
  let initialKey = DEFAULT_KEY;

  // 优先 hash
  const hashKey = (location.hash || '').replace(/^#/, '');
  if (hashKey && TOOLS.some(t => t.key === hashKey)) {
    initialKey = hashKey;
  } else {
    // 其次 localStorage
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && TOOLS.some(t => t.key === saved)) initialKey = saved;
    } catch (e) {}
  }

  selectTool(initialKey, { silent: true });
})();

/* 监听浏览器前进/后退的 hash 变化 */
window.addEventListener('hashchange', () => {
  const key = (location.hash || '').replace(/^#/, '');
  if (key && TOOLS.some(t => t.key === key)) {
    selectTool(key, { silent: true });
  }
});
</script>
</body>
</html>
