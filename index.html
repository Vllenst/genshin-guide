<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2EFEA">
<title>原神攻略工具集</title>
<style>
:root {
  --bg-base: #F2EFEA;
  --bg-surface: #FFFFFF;
  --bg-surface-2: #FAF8F5;
  --bg-hover: #F5F2ED;
  --border-subtle: #EBE6DF;
  --border-default: #DDD6CC;
  --text-primary: #1F1D1A;
  --text-secondary: #6B655C;
  --text-tertiary: #9C958A;
  --accent: #8B7355;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 2px rgba(31,29,26,.03);
  --std-font: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body, input, button { font-family: var(--std-font); -webkit-font-smoothing: antialiased; }
body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 14px;
  letter-spacing: -0.2px;
  min-height: 100vh;
  padding: 0 16px calc(40px + env(safe-area-inset-bottom));
}

.header {
  max-width: 640px;
  margin: 0 auto;
  padding: 40px 4px 22px;
  text-align: center;
}
.header h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.header p {
  font-size: 12.5px;
  color: var(--text-tertiary);
  letter-spacing: 0.2px;
}

.tool-list {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tool-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow-card);
  transition: transform .15s cubic-bezier(.16,1,.3,1), background .15s;
}
.tool-card:active {
  transform: scale(.98);
  background: var(--bg-hover);
}

.tool-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  background: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  line-height: 1;
}

.tool-text { flex: 1; min-width: 0; }
.tool-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.3px;
  margin-bottom: 2px;
}
.tool-desc {
  font-size: 12px;
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tool-arrow {
  width: 16px;
  height: 16px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  opacity: 0.55;
}

.footer {
  max-width: 640px;
  margin: 30px auto 0;
  text-align: center;
  font-size: 11px;
  color: var(--text-tertiary);
  letter-spacing: 0.3px;
  line-height: 1.8;
}
</style>
</head>
<body>

<div class="header">
  <h1>原神攻略工具集</h1>
  <p>一站式生成 · 高清导出</p>
</div>

<nav class="tool-list">

  <a class="tool-card" href="character.html">
    <div class="tool-icon">🎴</div>
    <div class="tool-text">
      <div class="tool-title">角色一图流</div>
      <div class="tool-desc">武器 · 圣遗物 · 天赋 · 命座 · 配队总览</div>
    </div>
    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
  </a>

  <a class="tool-card" href="image-tools.html">
    <div class="tool-icon">🖼️</div>
    <div class="tool-text">
      <div class="tool-title">图片处理整合</div>
      <div class="tool-desc">背景修改 · 双图羽化 · 对位裁切 · 图层拼接</div>
    </div>
    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
  </a>

  <a class="tool-card" href="video-cover.html">
    <div class="tool-icon">🎬</div>
    <div class="tool-text">
      <div class="tool-title">视频封面制作</div>
      <div class="tool-desc">视频封面 · 合集封面 · 4K 高清导出</div>
    </div>
    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
  </a>

  <a class="tool-card" href="chart.html">
    <div class="tool-icon">📊</div>
    <div class="tool-text">
      <div class="tool-title">图表生成器</div>
      <div class="tool-desc">雷达图 · 柱状图 · Excel / TXT 导入</div>
    </div>
    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
  </a>

  <a class="tool-card" href="weapon.html">
    <div class="tool-icon">⚔️</div>
    <div class="tool-text">
      <div class="tool-title">武器卡片生成</div>
      <div class="tool-desc">武器属性 · 特效 · 故事 · 2K 高清</div>
    </div>
    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
  </a>

  <a class="tool-card" href="tier.html">
    <div class="tool-icon">🏆</div>
    <div class="tool-text">
      <div class="tool-title">角色梯队排行榜</div>
      <div class="tool-desc">S / A / B 三档 · 全透明 2K PNG</div>
    </div>
    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
  </a>

</nav>

<div class="footer">
  点击卡片进入对应工具<br>
  所有数据仅保存在本地 · 无需登录
</div>

</body>
</html>
