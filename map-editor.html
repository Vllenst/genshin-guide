<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2EFEA">
<title>图标字典编辑器</title>
<link rel="stylesheet" href="shared-theme.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { font-family: var(--std-font); -webkit-font-smoothing: antialiased; background: var(--bg-base); color: var(--text-primary); font-size: 13px; letter-spacing: -0.2px; }
body { padding: 0 0 60px; min-height: 100vh; }

/* ============ 页面 header ============ */
.editor-header {
  position: sticky; top: 0; z-index: 50;
  height: 52px; padding: 0 12px;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 8px;
}
.editor-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme-btn {
  width: 34px; height: 34px;
  background: var(--bg-surface); border: 1px solid var(--border-default);
  border-radius: 8px; color: var(--text-primary);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  padding: 0;
}
.theme-btn svg { width: 18px; height: 18px; display: block; }

/* ============ 吸顶区（Tabs + 工具栏） ============ */
.sticky-head {
  position: sticky; top: 52px; z-index: 40;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-subtle);
  padding: 10px 12px;
}
.sticky-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg-sunken); border-radius: 12px; border: 1px solid var(--border-subtle); }
.tab { flex: 1; height: 34px; background: transparent; border: 0; border-radius: 9px; color: var(--text-secondary); font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; }
.tab.active { background: var(--bg-surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgba(31,29,26,.08); }

.actions-group {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
}
.actions-row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 0; height: 36px; padding: 0 12px;
  background: var(--bg-surface-2); border: 1px solid var(--border-subtle);
  border-radius: 10px; color: var(--text-primary);
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn.primary { background: var(--text-primary); color: var(--bg-base); border-color: var(--text-primary); }
.btn.danger { color: var(--danger); border-color: rgba(220,76,62,.3); background: var(--danger-bg); }
.btn input[type="file"] { display: none; }
.btn-icon { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
.btn-icon svg { width: 100%; height: 100%; display: block; }

/* ============ 条目列表 ============ */
.main { max-width: 760px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.entries { display: flex; flex-direction: column; gap: 8px; }
.entry-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
}
.entry-top { display: flex; align-items: center; gap: 8px; }
.entry-order {
  width: 56px; height: 32px; flex-shrink: 0;
  border-radius: 8px; background: var(--bg-sunken);
  border: 1px solid var(--border-default);
  color: var(--text-secondary); font-size: 12px; font-weight: 600;
  text-align: center; font-family: inherit; outline: none;
  -moz-appearance: textfield;
}
.entry-order::-webkit-outer-spin-button,
.entry-order::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.entry-order:focus { border-color: var(--accent); background: var(--bg-surface); color: var(--text-primary); }

.entry-thumb { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-sunken); object-fit: cover; flex-shrink: 0; display: block; }
.entry-key { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--bg-sunken); color: var(--text-primary); font-family: inherit; font-size: 12.5px; outline: none; }
.entry-key:focus { border-color: var(--accent); background: var(--bg-surface); }

.entry-mid { display: flex; align-items: center; gap: 6px; }
.entry-name { flex: 0 0 auto; width: 90px; min-width: 0; margin-right: auto; height: 34px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--bg-sunken); color: var(--text-primary); font-family: inherit; font-size: 12.5px; outline: none; }
.entry-name:focus { border-color: var(--accent); background: var(--bg-surface); }

.star-select { height: 34px; padding: 0 8px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--bg-sunken); color: var(--text-primary); font-family: inherit; font-size: 12.5px; outline: none; cursor: pointer; flex-shrink: 0; }
.mode-btn { height: 34px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--bg-sunken); color: var(--text-secondary); font-family: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
.mode-btn.mode-id { background: rgba(10,132,255,.12); color: #0A84FF; border-color: rgba(10,132,255,.35); }
.mode-btn.mode-url { background: rgba(139,115,85,.12); color: var(--accent); border-color: var(--accent); }
.mode-btn.mode-local { background: rgba(48,209,88,.12); color: #2A8A3E; border-color: rgba(48,209,88,.35); }
.entry-del { width: 34px; height: 34px; padding: 0; border: 1px solid rgba(220,76,62,.3); background: var(--danger-bg); color: var(--danger); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.entry-del svg { width: 14px; height: 14px; display: block; }

.empty-tip { padding: 50px 20px; text-align: center; color: var(--text-tertiary); font-size: 13px; line-height: 1.7; }
.empty-tip .big-icon { font-size: 36px; opacity: 0.4; margin-bottom: 8px; display: block; }

/* 弹窗 */
.modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-backdrop.show { display: flex; }
.modal { background: var(--bg-base); border-radius: 16px; width: 100%; max-width: 480px; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-height: 80vh; }
.modal-title { font-size: 15px; font-weight: 600; }
.modal textarea { width: 100%; height: 180px; padding: 10px; border: 1px solid var(--border-default); border-radius: 10px; background: var(--bg-sunken); color: var(--text-primary); font-family: inherit; font-size: 12px; resize: vertical; outline: none; line-height: 1.6; }
.modal-hint { font-size: 11.5px; color: var(--text-tertiary); line-height: 1.6; }
.modal-actions { display: flex; gap: 8px; }
.modal-actions .btn { flex: 1; height: 40px; }

.status-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg-base); border-top: 1px solid var(--border-subtle); padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--text-secondary); text-align: center; }
.status-bar.ok { color: var(--accent); }
.status-bar.err { color: var(--danger); }
</style>
</head>
<body>

<header class="editor-header">
  <div class="editor-title">图标字典编辑器</div>
  <button type="button" class="theme-btn" id="btnTheme"></button>
</header>

<div class="sticky-head">
  <div class="sticky-inner">
    <nav class="tabs">
      <button class="tab active" data-tab="characters">角色</button>
      <button class="tab" data-tab="artifacts">圣遗物</button>
      <button class="tab" data-tab="weapons">武器</button>
    </nav>

    <div class="actions-group">
      <div class="actions-row">
        <button type="button" class="btn primary" id="btnPaste"><span class="btn-icon"></span>粘贴 URL</button>
        <label class="btn"><span class="btn-icon"></span>上传本地图<input type="file" id="fileInput" accept="image/*" multiple></label>
      </div>
      <div class="actions-row">
        <button type="button" class="btn" id="btnLoad"><span class="btn-icon"></span>载入</button>
        <button type="button" class="btn" id="btnExport"><span class="btn-icon"></span>导出</button>
        <button type="button" class="btn danger" id="btnClear"><span class="btn-icon"></span>清空</button>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="entries" id="entries"></div>
  <div class="empty-tip" id="emptyTip" style="display:none;">
    <span class="big-icon">📭</span>
    当前分类还没有条目<br>
    点上方按钮开始
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title">粘贴图标链接</div>
    <div class="modal-hint">每行一个完整 URL，程序自动提取短 ID 并查 Amber 中文名。</div>
    <textarea id="pasteArea" placeholder="https://api.lunaris.moe/data/assets/avataricon/UI_AvatarIcon_SkirkNew.webp"></textarea>
    <div class="modal-actions">
      <button type="button" class="btn" id="modalCancel">取消</button>
      <button type="button" class="btn primary" id="modalConfirm">解析并添加</button>
    </div>
  </div>
</div>

<div class="status-bar" id="status">就绪</div>

<script src="icons.js"></script>
<script src="icons/icon-loader.js"></script>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "icon_dict_editor_v3";
  var THEME_KEY = "gtt_theme";

  var DEFAULT_CONFIG = {
    characters: { prefix: "https://api.lunaris.moe/data/assets/avataricon/UI_AvatarIcon_", ext: ".webp" },
    artifacts:  { prefix: "https://api.lunaris.moe/data/assets/artifacts/UI_RelicIcon_",   ext: ".webp" },
    weapons:    { prefix: "https://api.lunaris.moe/data/assets/weaponicon/UI_EquipIcon_",   ext: ".webp" }
  };
  var config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

  var data = { characters: [], artifacts: [], weapons: [] };
  var currentTab = "characters";
  var tempThumbs = {};

  /* Amber 数据 */
  var AMBER_ENDPOINTS = {
    characters: "https://gi.yatta.moe/api/v2/CHS/avatar",
    weapons:    "https://gi.yatta.moe/api/v2/CHS/weapon",
    artifacts:  "https://gi.yatta.moe/api/v2/CHS/reliquary"
  };
  var amberCache = { characters: null, weapons: null, artifacts: null };
  var amberLoading = {};

  /* 角色编号表（从 icons/characters.txt 读取） */
  var CHAR_ORDER_TO_NAME = {};
  var CHAR_NAME_TO_ORDER = {};

  function stripAmberPrefix(icon) {
    if (!icon) return "";
    return String(icon)
      .replace(/^UI_AvatarIcon_/i, "")
      .replace(/^UI_EquipIcon_/i, "")
      .replace(/^UI_RelicIcon_/i, "")
      .toLowerCase();
  }

  async function loadAmberData(type) {
    if (amberCache[type]) return amberCache[type];
    if (amberLoading[type]) return amberLoading[type];

    var promise = (async function () {
      var res = await fetch(AMBER_ENDPOINTS[type]);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var json = await res.json();
      var raw = (json && json.data) || json || {};
      var items = raw.items || raw;
      var map = {};
      Object.keys(items).forEach(function (k) {
        var item = items[k];
        if (!item || typeof item !== "object") return;
        var name = item.name || "";
        if (!name) return;
        var icon = item.icon || "";
        var id = stripAmberPrefix(icon);
        if (id) map[id] = name;
        if (item.id != null) map[String(item.id)] = name;
      });
      amberCache[type] = map;
      return map;
    })();

    amberLoading[type] = promise;
    try { await promise; } finally { amberLoading[type] = null; }
    return promise;
  }

  async function lookupAmberName(type, id) {
    if (!id) return "";
    var normalized = String(id).toLowerCase()
      .replace(/^ui_avataricon_/i, "")
      .replace(/^ui_equipicon_/i, "")
      .replace(/^ui_relicicon_/i, "");
    try {
      var map = await loadAmberData(type);
      return map[normalized] || map[String(id).toLowerCase()] || "";
    } catch (e) {
      return "";
    }
  }

  /* ============ 读取角色编号 txt ============ */
  async function loadCharOrderTxt() {
    try {
      var res = await fetch("./icons/characters.txt?t=" + Date.now());
      if (!res.ok) {
        console.warn("characters.txt HTTP " + res.status);
        return;
      }
      var text = await res.text();
      CHAR_ORDER_TO_NAME = {};
      CHAR_NAME_TO_ORDER = {};
      text.split(/\r?\n/).forEach(function (line) {
        line = line.trim();
        if (!line || line.startsWith("#")) return;
        var parts = line.split(/[\s,，\t]+/);
        if (parts.length < 2) return;
        var order = parseInt(parts[0], 10);
        var name = parts.slice(1).join(" ").trim();
        if (!order || !name) return;
        CHAR_ORDER_TO_NAME[order] = name;
        CHAR_NAME_TO_ORDER[name] = order;
      });
      console.log("characters.txt 加载成功，共 " + Object.keys(CHAR_NAME_TO_ORDER).length + " 条");
    } catch (e) {
      console.warn("characters.txt 加载失败：", e.message);
    }
  }

  /* ============ DOM ============ */
  var entriesEl = document.getElementById("entries");
  var emptyTip = document.getElementById("emptyTip");
  var statusBar = document.getElementById("status");
  var fileInput = document.getElementById("fileInput");
  var btnTheme = document.getElementById("btnTheme");
  var modalBackdrop = document.getElementById("modalBackdrop");
  var pasteArea = document.getElementById("pasteArea");

  function setStatus(msg, type) {
    statusBar.textContent = msg;
    statusBar.className = "status-bar" + (type ? " " + type : "");
  }
  function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ data: data, config: config })); } catch (e) {} }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      if (parsed && parsed.data && parsed.data.characters && parsed.data.artifacts && parsed.data.weapons) {
        data = parsed.data;
        if (parsed.config) config = parsed.config;
      }
    } catch (e) {}
  }

  function starColor(s) { return (ICON_LIB && ICON_LIB.starColors && ICON_LIB.starColors[s]) || "#939393"; }

  function detectMode(key) {
    if (!key) return "id";
    if (/^https?:\/\//i.test(key)) return "url";
    if (/\.(webp|png|jpe?g|gif|svg)$/i.test(key)) return "local";
    return "id";
  }

  function resolveUrl(type, key, mode) {
    if (!key) return "";
    if (mode === "local") return "./icons/" + key;
    if (mode === "url") return key;
    var cfg = config[type];
    return cfg.prefix + key + (cfg.ext || "");
  }

  /* ============ 短 ID 提取（三种类型通用） ============ */
  function extractShortId(fileName) {
    var fullId = String(fileName || "").replace(/\.[^.]+$/, "");
    return fullId.replace(/^UI_(?:AvatarIcon|EquipIcon|RelicIcon)_/i, "");
  }

  /* 圣遗物：从短 ID 提取 5 位数字编号 */
  function extractRelicOrder(shortId) {
    var m = /^(\d{5})(?:_\d+)?$/.exec(String(shortId || ""));
    return m ? parseInt(m[1], 10) : 0;
  }

  function makeThumbFor(row, cb) {
    var star = row.star || 5;
    var mode = detectMode(row.key);
    var src = "";
    if (mode === "local" && tempThumbs[row.key]) src = tempThumbs[row.key];
    else src = resolveUrl(currentTab, row.key, mode);
    if (!src) { cb(""); return; }

    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function () {
      try { cb(ICON_LIB.applyBackground(img, star, { size: 80 })); } catch (e) { cb(""); }
    };
    img.onerror = function () { cb(""); };
    img.src = src;
  }

  function render() {
    var list = data[currentTab] || [];
    /* 空序号排最后 */
    var sorted = list.slice().sort(function (a, b) {
      var ao = a.order || 99999;
      var bo = b.order || 99999;
      return ao - bo;
    });

    entriesEl.innerHTML = "";
    if (!sorted.length) { emptyTip.style.display = "block"; return; }
    emptyTip.style.display = "none";

    sorted.forEach(function (row) {
      var card = document.createElement("div");
      card.className = "entry-card";

      /* 第一行：序号 + 缩略图 + ID */
      var top = document.createElement("div");
      top.className = "entry-top";

      var inpOrder = document.createElement("input");
      inpOrder.type = "number"; inpOrder.className = "entry-order";
      inpOrder.value = row.order || "";
      inpOrder.title = "序号";
      inpOrder.addEventListener("change", function () {
        var v = (inpOrder.value || "").trim();
        row.order = v === "" ? 0 : (parseInt(v, 10) || 0);
        /* 角色 Tab：填了序号自动补中文名（前提是中文名为空） */
        if (currentTab === "characters" && !row.name && row.order > 0) {
          var autoName = CHAR_ORDER_TO_NAME[row.order];
          if (autoName) row.name = autoName;
        }
        saveLocal(); render();
      });
      top.appendChild(inpOrder);

      var thumb = document.createElement("img");
      thumb.className = "entry-thumb"; thumb.alt = "";
      top.appendChild(thumb);
      makeThumbFor(row, function (url) {
        if (url) thumb.src = url;
        else { thumb.style.background = starColor(row.star || 5); thumb.removeAttribute("src"); }
      });

      var inpKey = document.createElement("input");
      inpKey.type = "text"; inpKey.className = "entry-key";
      inpKey.value = row.key || "";
      var mode = detectMode(row.key);
      inpKey.placeholder = mode === "url" ? "完整 URL" : mode === "local" ? "本地文件名" : "短 ID（如 SkirkNew）";
      inpKey.addEventListener("input", function () {
        var oldKey = row.key;
        row.key = inpKey.value;
        if (oldKey !== row.key && tempThumbs[oldKey]) {
          tempThumbs[row.key] = tempThumbs[oldKey];
          delete tempThumbs[oldKey];
        }
        saveLocal();
      });
      inpKey.addEventListener("blur", render);
      top.appendChild(inpKey);
      card.appendChild(top);

      /* 第二行：中文名 + 星级 + 模式 + 删除 */
      var mid = document.createElement("div");
      mid.className = "entry-mid";

      var inpName = document.createElement("input");
      inpName.type = "text"; inpName.className = "entry-name";
      inpName.value = row.name || ""; inpName.placeholder = "中文名";
      inpName.addEventListener("input", function () { row.name = inpName.value; saveLocal(); });
      inpName.addEventListener("blur", function () {
        var name = (inpName.value || "").trim();
        row.name = name;
        /* 角色 Tab：填了中文名自动补序号 */
        if (currentTab === "characters" && name) {
          var autoOrder = CHAR_NAME_TO_ORDER[name];
          if (autoOrder) row.order = autoOrder;
        }
        saveLocal(); render();
      });
      mid.appendChild(inpName);

      var selStar = document.createElement("select");
      selStar.className = "star-select";
      [1, 2, 3, 4, 5].forEach(function (s) {
        var opt = document.createElement("option");
        opt.value = s; opt.textContent = s + "★";
        if (s === (row.star || 5)) opt.selected = true;
        selStar.appendChild(opt);
      });
      selStar.addEventListener("change", function () {
        row.star = parseInt(selStar.value, 10) || 5;
        saveLocal(); render();
      });
      mid.appendChild(selStar);

      var modeBtn = document.createElement("button");
      modeBtn.type = "button";
      var modes = ["id", "url", "local"];
      var modeIdx = modes.indexOf(mode);
      modeBtn.className = "mode-btn mode-" + mode;
      modeBtn.textContent = mode === "id" ? "ID" : mode === "url" ? "URL" : "本地";
      modeBtn.addEventListener("click", function () {
        var next = modes[(modeIdx + 1) % 3];
        var oldKey = row.key;
        if (next === "id" && oldKey) row.key = extractShortId(oldKey);
        else if (next === "url") row.key = "";
        else if (next === "local") row.key = "";
        saveLocal(); render();
      });
      mid.appendChild(modeBtn);

      var btnDel = document.createElement("button");
      btnDel.type = "button"; btnDel.className = "entry-del";
      btnDel.innerHTML = ICONS.ui.trash;
      btnDel.addEventListener("click", function () {
        var idx = data[currentTab].indexOf(row);
        if (idx >= 0) data[currentTab].splice(idx, 1);
        delete tempThumbs[row.key];
        saveLocal(); render(); setStatus("已删除", "ok");
      });
      mid.appendChild(btnDel);

      card.appendChild(mid);
      entriesEl.appendChild(card);
    });
  }

  /* ============ 粘贴 URL ============ */
  async function parsePastedUrls(text) {
    var lines = String(text || "").split(/\r?\n/);
    var urls = lines.map(function (l) { return l.trim(); }).filter(function (l) { return /^https?:\/\//i.test(l); });
    if (!urls.length) { setStatus("未识别到有效链接", "err"); return; }

    setStatus("正在加载 Amber 数据…");
    var amberReady = false;
    try { await loadAmberData(currentTab); amberReady = true; } catch (e) { amberReady = false; }

    var list = data[currentTab];
    var maxOrder = list.reduce(function (m, r) { return Math.max(m, r.order || 0); }, 0);

    var newRows = [];
    urls.forEach(function (url) {
      maxOrder++;
      var fileName = url.split("/").pop().split("?")[0];   // UI_AvatarIcon_SkirkNew.webp
      var shortId = extractShortId(fileName);                // SkirkNew
      var row = { order: maxOrder, key: shortId, name: "", star: 5 };

      /* 圣遗物：自动填 order（末尾 5 位数字） */
      if (currentTab === "artifacts") {
        var relicOrder = extractRelicOrder(shortId);
        if (relicOrder) row.order = relicOrder;
      }

      list.push(row);
      newRows.push({ row: row, fullId: fileName.replace(/\.[^.]+$/, "") });
    });

    saveLocal(); render();
    setStatus("已添加 " + urls.length + " 条，正在查询中文名…");

    for (var i = 0; i < newRows.length; i++) {
      var item = newRows[i];
      if (!amberReady) break;
      var name = await lookupAmberName(currentTab, item.fullId);
      if (name) {
        item.row.name = name;
        /* 角色 Tab：如果 txt 里有对应编号，覆盖 order */
        if (currentTab === "characters" && CHAR_NAME_TO_ORDER[name]) {
          item.row.order = CHAR_NAME_TO_ORDER[name];
        }
      }
      saveLocal(); render();
    }

    if (!amberReady) {
      setStatus("Amber 加载失败，中文名请手动填", "err");
    } else {
      var filled = newRows.filter(function (it) { return it.row.name; }).length;
      setStatus("完成 · 自动填充 " + filled + " / " + newRows.length + " 条", "ok");
    }
    saveLocal(); render();
  }

  function openPasteModal() { pasteArea.value = ""; modalBackdrop.classList.add("show"); setTimeout(function () { pasteArea.focus(); }, 50); }
  function closePasteModal() { modalBackdrop.classList.remove("show"); }

  function handleFiles(files) {
    if (!files || !files.length) return;
    var list = data[currentTab];
    var maxOrder = list.reduce(function (m, r) { return Math.max(m, r.order || 0); }, 0);
    var total = files.length, done = 0;
    Array.prototype.forEach.call(files, function (f) {
      maxOrder++;
      var row = { order: maxOrder, key: f.name, name: "", star: 5 };
      list.push(row);
      var reader = new FileReader();
      reader.onload = function (e) {
        tempThumbs[f.name] = e.target.result;
        done++;
        if (done >= total) { saveLocal(); render(); setStatus("已导入 " + total + " 张", "ok"); }
      };
      reader.onerror = function () { done++; if (done >= total) { saveLocal(); render(); } };
      reader.readAsDataURL(f);
    });
  }

  function clearCurrent() {
    var label = { characters: "角色", artifacts: "圣遗物", weapons: "武器" }[currentTab];
    if (!confirm("确定清空「" + label + "」的所有条目吗？")) return;
    data[currentTab] = [];
    saveLocal(); render(); setStatus("已清空", "ok");
  }

  function loadFromRepo() {
    setStatus("正在从仓库载入…");
    fetch("./icons/icon-dict.js?t=" + Date.now())
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (code) {
        var sandbox = { window: {} };
        new Function("window", code)(sandbox.window);
        var dict = sandbox.window.ICON_DICT || {};
        if (dict.config) config = dict.config;
        ["characters", "artifacts", "weapons"].forEach(function (type) {
          var obj = dict[type] || {};
          var keys = Object.keys(obj);
          data[type] = keys.map(function (k, i) {
            var item = obj[k] || {};
            return { order: item.order || (i + 1), key: k, name: item.name || "", star: item.star || 5 };
          });
        });
        saveLocal(); render(); setStatus("已从仓库载入", "ok");
      })
      .catch(function (e) { setStatus("载入失败：" + e.message, "err"); });
  }

  function esc(s) { return String(s || "").replace(/\\/g, "\\\\").replace(/"/g, '\\"'); }

  function buildDictJS() {
    var lines = [];
    lines.push("window.ICON_DICT = {");
    lines.push("  config: {");
    ["characters", "artifacts", "weapons"].forEach(function (type, ti) {
      var cfg = config[type];
      lines.push('    ' + type + ': { prefix: "' + esc(cfg.prefix) + '", ext: "' + esc(cfg.ext || "") + '" }' + (ti < 2 ? "," : ""));
    });
    lines.push("  },");

    var types = ["characters", "artifacts", "weapons"];
    var labels = { characters: "角色", artifacts: "圣遗物", weapons: "武器" };

    types.forEach(function (type, ti) {
      lines.push("");
      lines.push("  /* ============ " + labels[type] + " ============ */");
      lines.push("  " + type + ": {");

      var list = data[type].slice()
        .filter(function (it) { return it.key; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });

      if (!list.length) lines.push("    // 暂无条目");

      list.forEach(function (item, i) {
        var mode = detectMode(item.key);
        var parts = ['name: "' + esc(item.name) + '"', "star: " + (item.star || 5), "order: " + (item.order || (i + 1))];
        if (mode === "local") parts.push("local: true");
        var line = '    "' + esc(item.key) + '": { ' + parts.join(", ") + " }";
        if (i < list.length - 1) line += ",";
        lines.push(line);
      });

      lines.push("  }" + (ti < types.length - 1 ? "," : ""));
    });

    lines.push("};");
    lines.push("");
    return lines.join("\n");
  }

  function exportJS() {
    var blob = new Blob([buildDictJS()], { type: "text/javascript;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "icon-dict.js";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    setStatus("已导出，上传到 icons/ 覆盖", "ok");
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    btnTheme.innerHTML = theme === "dark" ? ICONS.app.moonBold : ICONS.app.sunBold;
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }
  function toggleTheme() {
    var cur = document.documentElement.getAttribute("data-theme") || "light";
    applyTheme(cur === "dark" ? "light" : "dark");
  }

  function injectIcons() {
    var map = { "btnPaste": ICONS.ui.plus, "btnLoad": ICONS.ui.import, "btnExport": ICONS.ui.export, "btnClear": ICONS.ui.trash };
    Object.keys(map).forEach(function (id) {
      var el = document.querySelector("#" + id + " .btn-icon");
      if (el) el.innerHTML = map[id];
    });
    var fileBtn = document.querySelector("label.btn .btn-icon");
    if (fileBtn) fileBtn.innerHTML = ICONS.ui.plus;
  }

  document.querySelectorAll(".tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      currentTab = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("active", b === btn); });
      render();
    });
  });

  fileInput.addEventListener("change", function (e) { handleFiles(e.target.files); e.target.value = ""; });
  document.getElementById("btnPaste").addEventListener("click", openPasteModal);
  document.getElementById("modalCancel").addEventListener("click", closePasteModal);
  document.getElementById("modalConfirm").addEventListener("click", function () {
    closePasteModal();
    parsePastedUrls(pasteArea.value);
  });
  modalBackdrop.addEventListener("click", function (e) { if (e.target === modalBackdrop) closePasteModal(); });
  document.getElementById("btnClear").addEventListener("click", clearCurrent);
  document.getElementById("btnLoad").addEventListener("click", loadFromRepo);
  document.getElementById("btnExport").addEventListener("click", exportJS);
  btnTheme.addEventListener("click", toggleTheme);

  (async function init() {
    injectIcons();
    var savedTheme = "light";
    try { savedTheme = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
    applyTheme(savedTheme);
    await loadCharOrderTxt();
    loadLocal();
    render();
    setStatus("就绪 · 编辑自动保存");
  })();

})();
</script>
</body>
</html>
