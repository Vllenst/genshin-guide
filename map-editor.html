<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2EFEA">
<title>图标映射表编辑器</title>
<link rel="stylesheet" href="shared-theme.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: var(--std-font);
  -webkit-font-smoothing: antialiased;
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 13px;
  letter-spacing: -0.2px;
}
body {
  padding: 0 0 60px;
  transition: background-color .25s ease, color .25s ease;
  min-height: 100vh;
}

/* ============ 顶部栏 ============ */
.editor-header {
  position: sticky; top: 0; z-index: 40;
  height: 52px; padding: 0 12px;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 8px;
  transition: background-color .25s ease, border-color .25s ease;
}
.editor-title {
  font-size: 15px; font-weight: 600;
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.theme-btn {
  width: 34px; height: 34px;
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 8px;
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s, transform .12s;
  padding: 0; flex-shrink: 0;
}
.theme-btn:active { transform: scale(.94); }
.theme-btn svg { width: 18px; height: 18px; display: block; }

/* ============ 主体容器 ============ */
.main {
  max-width: 760px;
  margin: 0 auto;
  padding: 12px 12px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ============ 顶部 Tab ============ */
.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--bg-sunken);
  border-radius: 12px;
  border: 1px solid var(--border-subtle);
}
.tab {
  flex: 1;
  height: 34px;
  background: transparent;
  border: 0;
  border-radius: 9px;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s cubic-bezier(.16,1,.3,1);
}
.tab.active {
  background: var(--bg-surface);
  color: var(--accent);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(31,29,26,.08);
}

/* ============ 操作区 ============ */
.actions-group {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow-card);
}
.actions-section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-tertiary);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 0 2px;
}
.actions-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.btn {
  flex: 1;
  min-width: 0;
  height: 38px;
  padding: 0 12px;
  background: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.btn:hover { background: var(--bg-hover); }
.btn:active { transform: scale(.97); }
.btn.primary {
  background: var(--text-primary);
  color: var(--bg-base);
  border-color: var(--text-primary);
}
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
.btn.danger {
  color: var(--danger);
  border-color: var(--danger-border, rgba(220,76,62,.3));
  background: var(--danger-bg);
}
.btn.danger:hover { background: var(--danger-hover, rgba(220,76,62,.16)); }
.btn input[type="file"] { display: none; }
.btn-icon {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-icon svg { width: 100%; height: 100%; display: block; }

/* ============ 条目列表 ============ */
.entries {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.entry-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow-card);
  transition: border-color .15s;
}
.entry-card:hover { border-color: var(--border-default); }

.entry-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.entry-order {
  width: 32px; height: 32px;
  flex-shrink: 0;
  border-radius: 8px;
  background: var(--bg-sunken);
  border: 1px solid var(--border-default);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
  outline: none;
  -moz-appearance: textfield;
}
.entry-order::-webkit-outer-spin-button,
.entry-order::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.entry-order:focus {
  border-color: var(--accent);
  background: var(--bg-surface);
  color: var(--text-primary);
}

.entry-thumb {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-sunken);
  object-fit: cover;
  flex-shrink: 0;
  display: block;
}

.entry-key {
  flex: 1;
  min-width: 0;
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  background: var(--bg-sunken);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12.5px;
  outline: none;
  overflow: hidden;
  text-overflow: ellipsis;
}
.entry-key:focus { border-color: var(--accent); background: var(--bg-surface); }

/* 第二行：中文名 + 星级 + 删除 */
.entry-mid {
  display: flex;
  align-items: center;
  gap: 6px;
}
.entry-name {
  flex: 1;
  min-width: 0;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  background: var(--bg-sunken);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12.5px;
  outline: none;
}
.entry-name:focus { border-color: var(--accent); background: var(--bg-surface); }

.star-select {
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  background: var(--bg-sunken);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12.5px;
  outline: none;
  cursor: pointer;
  font-weight: 500;
  flex-shrink: 0;
}

.entry-del {
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--danger-border, rgba(220,76,62,.3));
  background: var(--danger-bg);
  color: var(--danger);
  border-radius: 8px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all .15s;
  flex-shrink: 0;
}
.entry-del:hover { background: var(--danger-hover, rgba(220,76,62,.16)); }
.entry-del:active { transform: scale(.96); }
.entry-del svg { width: 14px; height: 14px; display: block; }

.empty-tip {
  padding: 50px 20px;
  text-align: center;
  color: var(--text-tertiary);
  font-size: 13px;
  line-height: 1.7;
}
.empty-tip .big-icon {
  font-size: 36px;
  opacity: 0.4;
  margin-bottom: 8px;
  display: block;
}

/* ============ 底部状态栏 ============ */
.status-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: var(--bg-base);
  border-top: 1px solid var(--border-subtle);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  transition: background-color .25s ease, color .15s;
}
.status-bar.ok { color: var(--accent); }
.status-bar.err { color: var(--danger); }
</style>
</head>
<body>

<header class="editor-header">
  <div class="editor-title">图标映射表编辑器</div>
  <button type="button" class="theme-btn" id="btnTheme" aria-label="切换主题"></button>
</header>

<div class="main">
  <nav class="tabs">
    <button class="tab active" data-tab="characters">角色</button>
    <button class="tab" data-tab="artifacts">圣遗物</button>
    <button class="tab" data-tab="weapons">武器</button>
  </nav>

  <div class="actions-group">
    <div class="actions-section-title">导入 / 导出</div>
    <div class="actions-row">
      <label class="btn">
        <span class="btn-icon"></span>导入图片
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button type="button" class="btn" id="btnLoad">
        <span class="btn-icon"></span>从仓库载入
      </button>
      <button type="button" class="btn primary" id="btnExport">
        <span class="btn-icon"></span>导出
      </button>
    </div>

    <div class="actions-section-title" style="margin-top:4px;">编辑</div>
    <div class="actions-row">
      <button type="button" class="btn" id="btnAdd">
        <span class="btn-icon"></span>添加一行
      </button>
      <button type="button" class="btn" id="btnSort">
        <span class="btn-icon"></span>按序号排序
      </button>
      <button type="button" class="btn danger" id="btnClear">
        <span class="btn-icon"></span>清空分类
      </button>
    </div>
  </div>

  <div class="entries" id="entries"></div>
  <div class="empty-tip" id="emptyTip" style="display:none;">
    <span class="big-icon">📭</span>
    当前分类还没有条目<br>
    点上方「导入图片」或「添加一行」开始
  </div>
</div>

<div class="status-bar" id="status">就绪</div>

<script src="icons.js"></script>
<script src="icons/icon-loader.js"></script>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "icon_map_editor_data_v3";
  var THEME_KEY = "gtt_theme";

  var data = { characters: [], artifacts: [], weapons: [] };
  var currentTab = "characters";
  var tempThumbs = {};

  var entriesEl = document.getElementById("entries");
  var emptyTip = document.getElementById("emptyTip");
  var statusBar = document.getElementById("status");
  var fileInput = document.getElementById("fileInput");
  var btnTheme = document.getElementById("btnTheme");

  /* ============ 状态 ============ */
  function setStatus(msg, type) {
    statusBar.textContent = msg;
    statusBar.className = "status-bar" + (type ? " " + type : "");
  }

  /* ============ 存储 ============ */
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      if (parsed && parsed.characters && parsed.artifacts && parsed.weapons) data = parsed;
    } catch (e) {}
  }

  /* ============ 缩略图 ============ */
  function starColor(star) {
    return (ICON_LIB && ICON_LIB.starColors && ICON_LIB.starColors[star]) || "#939393";
  }

  function makeThumbFor(row, cb) {
    var key = row.key, star = row.star || 5;
    if (!key) { cb(""); return; }
    if (tempThumbs[key]) {
      var img = new Image();
      img.onload = function () {
        try { cb(ICON_LIB.applyBackground(img, star, { size: 80 })); } catch (e) { cb(""); }
      };
      img.onerror = function () { cb(""); };
      img.src = tempThumbs[key];
      return;
    }
    /* 新路径：不分星级文件夹 */
    var path = "./icons/" + currentTab + "/" + key;
    var img2 = new Image();
    img2.crossOrigin = "anonymous";
    img2.onload = function () {
      try { cb(ICON_LIB.applyBackground(img2, star, { size: 80 })); } catch (e) { cb(""); }
    };
    img2.onerror = function () { cb(""); };
    img2.src = path;
  }

  /* ============ 渲染 ============ */
  function render() {
    var list = data[currentTab] || [];
    var sorted = list.slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);
    });

    entriesEl.innerHTML = "";
    if (!sorted.length) {
      emptyTip.style.display = "block";
      return;
    }
    emptyTip.style.display = "none";

    sorted.forEach(function (row) {
      var card = document.createElement("div");
      card.className = "entry-card";

      /* 第一行：序号 + 缩略图 + 文件名 */
      var top = document.createElement("div");
      top.className = "entry-top";

      var inpOrder = document.createElement("input");
      inpOrder.type = "number";
      inpOrder.className = "entry-order";
      inpOrder.value = row.order || 1;
      inpOrder.min = 1;
      inpOrder.title = "序号";
      inpOrder.addEventListener("change", function () {
        row.order = parseInt(inpOrder.value, 10) || 1;
        saveLocal();
      });
      top.appendChild(inpOrder);

      var thumb = document.createElement("img");
      thumb.className = "entry-thumb";
      thumb.alt = "";
      top.appendChild(thumb);
      makeThumbFor(row, function (url) {
        if (url) thumb.src = url;
        else { thumb.style.background = starColor(row.star || 5); thumb.removeAttribute("src"); }
      });

      var inpKey = document.createElement("input");
      inpKey.type = "text";
      inpKey.className = "entry-key";
      inpKey.value = row.key || "";
      inpKey.placeholder = "文件名";
      inpKey.addEventListener("input", function () {
        var oldKey = row.key;
        row.key = inpKey.value;
        if (oldKey !== row.key && tempThumbs[oldKey]) {
          tempThumbs[row.key] = tempThumbs[oldKey];
          delete tempThumbs[oldKey];
        }
        saveLocal();
      });
      inpKey.addEventListener("blur", render);
      top.appendChild(inpKey);

      card.appendChild(top);

      /* 第二行：中文名 + 星级 + 删除 */
      var mid = document.createElement("div");
      mid.className = "entry-mid";

      var inpName = document.createElement("input");
      inpName.type = "text";
      inpName.className = "entry-name";
      inpName.value = row.name || "";
      inpName.placeholder = "中文名";
      inpName.addEventListener("input", function () { row.name = inpName.value; saveLocal(); });
      mid.appendChild(inpName);

      var selStar = document.createElement("select");
      selStar.className = "star-select";
      [1, 2, 3, 4, 5].forEach(function (s) {
        var opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s + "★";
        if (s === (row.star || 5)) opt.selected = true;
        selStar.appendChild(opt);
      });
      selStar.addEventListener("change", function () {
        row.star = parseInt(selStar.value, 10) || 5;
        saveLocal();
        render();
      });
      mid.appendChild(selStar);

      var btnDel = document.createElement("button");
      btnDel.type = "button";
      btnDel.className = "entry-del";
      btnDel.innerHTML = ICONS.ui.trash + "<span>删除</span>";
      btnDel.addEventListener("click", function () {
        var idx = data[currentTab].indexOf(row);
        if (idx >= 0) data[currentTab].splice(idx, 1);
        delete tempThumbs[row.key];
        saveLocal();
        render();
        setStatus("已删除", "ok");
      });
      mid.appendChild(btnDel);

      card.appendChild(mid);
      entriesEl.appendChild(card);
    });
  }

  /* ============ 添加 ============ */
  function addRow() {
    var list = data[currentTab];
    var maxOrder = list.reduce(function (m, r) { return Math.max(m, r.order || 0); }, 0);
    list.push({ order: maxOrder + 1, key: "", name: "", star: 5 });
    saveLocal();
    render();
    setStatus("已添加一行", "ok");
  }

  /* ============ 导入图片 ============ */
  function handleFiles(files) {
    if (!files || !files.length) return;
    var list = data[currentTab];
    var maxOrder = list.reduce(function (m, r) { return Math.max(m, r.order || 0); }, 0);
    var total = files.length, done = 0;

    Array.prototype.forEach.call(files, function (f) {
      maxOrder++;
      var row = { order: maxOrder, key: f.name, name: "", star: 5 };
      list.push(row);
      var reader = new FileReader();
      reader.onload = function (e) {
        tempThumbs[f.name] = e.target.result;
        done++;
        if (done >= total) { saveLocal(); render(); setStatus("已导入 " + total + " 张图", "ok"); }
      };
      reader.onerror = function () {
        done++;
        if (done >= total) { saveLocal(); render(); }
      };
      reader.readAsDataURL(f);
    });
  }

  /* ============ 排序 ============ */
  function sortByOrder() {
    data[currentTab] = data[currentTab].slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);
    });
    saveLocal();
    render();
    setStatus("已按序号排序", "ok");
  }

  /* ============ 清空 ============ */
  function clearCurrent() {
    var label = { characters: "角色", artifacts: "圣遗物", weapons: "武器" }[currentTab];
    if (!confirm("确定清空「" + label + "」的所有条目吗？")) return;
    data[currentTab] = [];
    saveLocal();
    render();
    setStatus("已清空", "ok");
  }

  /* ============ 从仓库载入 ============ */
  function loadFromRepo() {
    setStatus("正在从仓库载入…");
    fetch("./icons/icon-map.js?t=" + Date.now())
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (code) {
        var sandbox = { window: {} };
        new Function("window", code)(sandbox.window);
        var map = sandbox.window.ICON_MAP || {};
        ["characters", "artifacts", "weapons"].forEach(function (type) {
          var obj = map[type] || {};
          var keys = Object.keys(obj);
          data[type] = keys.map(function (k, i) {
            var item = obj[k] || {};
            return {
              order: item.order || (i + 1),
              key: k,
              name: item.name || "",
              star: item.star || 5
            };
          });
        });
        saveLocal();
        render();
        setStatus("已从仓库载入", "ok");
      })
      .catch(function (e) { setStatus("载入失败：" + e.message, "err"); });
  }

  /* ============ 导出 ============ */
  function esc(str) { return String(str || "").replace(/\\/g, "\\\\").replace(/"/g, '\\"'); }

  function buildIconMapJS() {
    var lines = [];
    lines.push("/* ============================================================");
    lines.push(" * 图标映射表");
    lines.push(" * key   = 完整文件名（含扩展名）");
    lines.push(" * name  = 中文全名");
    lines.push(" * star  = 星级（1~5）");
    lines.push(" * order = 排序序号（数字越小越前）");
    lines.push(" * ============================================================ */");
    lines.push("window.ICON_MAP = {");

    var types = ["characters", "artifacts", "weapons"];
    var typeLabels = { characters: "角色", artifacts: "圣遗物", weapons: "武器" };

    types.forEach(function (type, ti) {
      lines.push("");
      lines.push("  /* ============ " + typeLabels[type] + " ============ */");
      lines.push("  " + type + ": {");

      var list = data[type].slice()
        .filter(function (it) { return it.key; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });

      if (!list.length) lines.push("    // 暂无条目");

      list.forEach(function (item, i) {
        var parts = ['name: "' + esc(item.name) + '"'];
        parts.push("star: " + (item.star || 5));
        parts.push("order: " + (item.order || (i + 1)));
        var line = '    "' + esc(item.key) + '": { ' + parts.join(", ") + " }";
        if (i < list.length - 1) line += ",";
        lines.push(line);
      });

      lines.push("  }" + (ti < types.length - 1 ? "," : ""));
    });

    lines.push("};");
    lines.push("");
    return lines.join("\n");
  }

  function exportJS() {
    var blob = new Blob([buildIconMapJS()], { type: "text/javascript;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "icon-map.js";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    setStatus("已导出，请手动上传到 icons/ 目录", "ok");
  }

  /* ============ 主题 ============ */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    /* 浅色显示太阳（当前白天），深色显示月亮（当前夜晚） */
    btnTheme.innerHTML = theme === "dark" ? ICONS.app.moonBold : ICONS.app.sunBold;
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }
  function toggleTheme() {
    var cur = document.documentElement.getAttribute("data-theme") || "light";
    applyTheme(cur === "dark" ? "light" : "dark");
  }

  /* ============ 注入按钮图标 ============ */
  function injectIcons() {
    var map = {
      "btnLoad": ICONS.ui.import,
      "btnExport": ICONS.ui.export,
      "btnAdd": ICONS.ui.plus,
      "btnSort": ICONS.ui.arrowUp,
      "btnClear": ICONS.ui.trash
    };
    Object.keys(map).forEach(function (id) {
      var el = document.querySelector("#" + id + " .btn-icon");
      if (el) el.innerHTML = map[id];
    });
    var fileBtn = document.querySelector("label.btn .btn-icon");
    if (fileBtn) fileBtn.innerHTML = ICONS.ui.plus;
  }

  /* ============ 事件绑定 ============ */
  document.querySelectorAll(".tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      currentTab = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      render();
    });
  });

  fileInput.addEventListener("change", function (e) {
    handleFiles(e.target.files);
    e.target.value = "";
  });

  document.getElementById("btnAdd").addEventListener("click", addRow);
  document.getElementById("btnSort").addEventListener("click", sortByOrder);
  document.getElementById("btnClear").addEventListener("click", clearCurrent);
  document.getElementById("btnLoad").addEventListener("click", loadFromRepo);
  document.getElementById("btnExport").addEventListener("click", exportJS);
  btnTheme.addEventListener("click", toggleTheme);

  /* ============ 初始化 ============ */
  (function init() {
    injectIcons();
    var savedTheme = "light";
    try { savedTheme = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
    applyTheme(savedTheme);
    loadLocal();
    render();
    setStatus("就绪 · 编辑自动保存到本地");
  })();

})();
</script>
</body>
</html>
