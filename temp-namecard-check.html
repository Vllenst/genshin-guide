<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名片图链接探测</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  background: #f5f5f5; color: #222; font-size: 14px;
  padding: 12px; padding-bottom: 80px;
  line-height: 1.5;
}
h1 { font-size: 17px; margin-bottom: 8px; }
.hint { font-size: 12px; color: #666; margin-bottom: 12px; line-height: 1.6; }
.card {
  background: #fff; border-radius: 10px; padding: 12px;
  margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
}
.badge.ok { background: #e6f7e6; color: #2a7a2a; }
.badge.fail { background: #fdecea; color: #b3261e; }
.badge.run { background: #e8f0fe; color: #1a5ccc; }
pre {
  background: #fafafa; border: 1px solid #eee; border-radius: 8px;
  padding: 10px; font-size: 12px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-all;
  max-height: 320px; overflow-y: auto;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.btn {
  display: block; width: 100%; height: 44px;
  background: #222; color: #fff; border: 0; border-radius: 10px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  margin-top: 10px; font-family: inherit;
}
.btn:active { opacity: .85; }
.btn.sec {
  background: #fff; color: #222; border: 1px solid #ddd;
}
.progress {
  height: 6px; background: #eee; border-radius: 3px;
  overflow: hidden; margin: 8px 0;
}
.progress > div {
  height: 100%; background: #222; width: 0%; transition: width .2s;
}
.status { font-size: 12px; color: #666; }
.section-title {
  font-size: 13px; font-weight: 600; color: #444;
  margin-bottom: 6px;
}
#output { display: none; }
</style>
</head>
<body>

<h1>名片图链接探测</h1>
<div class="hint">
  以 <code>characters.txt</code> 为角色主表，从 <code>icon-dict.js</code> 查短 ID，
  拼 <code>UI_NameCardPic_{shortId}_P.png</code> 探测 Lunaris 外链。
  输出格式：<code>编号 角色名 URL</code>，按编号倒序。
</div>

<div class="card">
  <div class="row">
    <span class="status" id="statusText">准备中…</span>
    <span class="badge run" id="badge">等待</span>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
  <div class="status" id="subStatus"></div>
</div>

<div id="output">

  <div class="card">
    <div class="section-title">✅ 成功 <span id="okCount">0</span></div>
    <pre id="okList"></pre>
    <button class="btn" onclick="copyOk()">复制成功列表</button>
  </div>

  <div class="card">
    <div class="section-title">❌ 失败 <span id="failCount">0</span></div>
    <pre id="failList"></pre>
  </div>

  <div class="card" id="extraCard" style="display:none;">
    <div class="section-title">⚠️ 字典里有但 characters.txt 没有</div>
    <pre id="extraList"></pre>
  </div>

</div>

<script src="shared/gi-icons/icon-dict.js"></script>
<script>
'use strict';

const PREFIX = 'https://api.lunaris.moe/data/assets/namecardpic/';
const SUFFIX = '_P.png';
const CONCURRENCY = 5;

const okList = [];
const failList = [];
const extraList = [];

function stripPrefix(key) {
  return key.replace(/^UI_AvatarIcon_/i, '').replace(/\.[^.]+$/, '');
}

function setStatus(t) { document.getElementById('statusText').textContent = t; }
function setSubStatus(t) { document.getElementById('subStatus').textContent = t; }
function setBadge(t, c) {
  const b = document.getElementById('badge');
  b.textContent = t; b.className = 'badge ' + c;
}
function setProgress(c, t) {
  document.getElementById('progressBar').style.width = (c / t * 100) + '%';
}

/* 读 characters.txt → [{ order, name }]，原顺序 */
async function loadCharList() {
  const res = await fetch('shared/data/characters.txt?t=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const list = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('#')) return;
    const parts = line.split(/[\s,，\t]+/);
    if (parts.length < 2) return;
    const order = parseInt(parts[0], 10);
    const name = parts.slice(1).join(' ').trim();
    if (!order || !name) return;
    list.push({ order, name });
  });
  return list;
}

/* 从 icon-dict 查角色名 → 短 ID */
function findShortIdByName(name, dict) {
  for (const key in dict) {
    const item = dict[key];
    if (item && item.name === name) {
      return stripPrefix(key);
    }
  }
  return '';
}

async function urlExists(url) {
  try {
    let res = await fetch(url, { method: 'HEAD' });
    if (res.ok) return true;
    if (res.status === 405) {
      res = await fetch(url);
      return res.ok;
    }
    return false;
  } catch (e) {
    try {
      const r2 = await fetch(url);
      return r2.ok;
    } catch (e2) {
      return false;
    }
  }
}

async function probeOne(item) {
  const shortId = findShortIdByName(item.name, window.ICON_DICT.characters);
  if (!shortId) {
    failList.push({ ...item, shortId: '', reason: 'icon-dict 无此角色' });
    return;
  }
  const url = PREFIX + shortId + SUFFIX;
  const ok = await urlExists(url);
  if (ok) {
    okList.push({ ...item, shortId, url });
  } else {
    failList.push({ ...item, shortId, url, reason: '链接 404' });
  }
}

async function run() {
  const dict = window.ICON_DICT && window.ICON_DICT.characters;
  if (!dict) {
    setStatus('icon-dict.js 未加载！');
    setBadge('错误', 'fail');
    return;
  }

  setStatus('加载 characters.txt…');
  let list;
  try {
    list = await loadCharList();
  } catch (e) {
    setStatus('characters.txt 加载失败：' + e.message);
    setBadge('错误', 'fail');
    return;
  }

  setSubStatus(`characters.txt 读到 ${list.length} 条`);
  setBadge('运行中', 'run');
  setStatus(`开始探测 ${list.length} 个角色…`);

  let done = 0;
  for (let i = 0; i < list.length; i += CONCURRENCY) {
    const batch = list.slice(i, i + CONCURRENCY);
    await Promise.all(batch.map(it => probeOne(it)));
    done += batch.length;
    setProgress(done, list.length);
    setStatus(`探测中… ${done}/${list.length}`);
  }

  /* 结果按 order 倒序 */
  okList.sort((a, b) => b.order - a.order);
  failList.sort((a, b) => b.order - a.order);

  /* 找出 icon-dict 有、但 characters.txt 没有的角色 */
  const txtNames = new Set(list.map(it => it.name));
  for (const key in dict) {
    const item = dict[key];
    if (item && item.name && !txtNames.has(item.name)) {
      extraList.push({ name: item.name, shortId: stripPrefix(key) });
    }
  }

  setProgress(list.length, list.length);
  setBadge('完成', 'ok');
  setStatus(`完成：成功 ${okList.length}，失败 ${failList.length}`);

  document.getElementById('okCount').textContent = okList.length;
  document.getElementById('failCount').textContent = failList.length;

  document.getElementById('okList').textContent =
    okList.map(o => o.order + ' ' + o.name + ' ' + o.url).join('\n') || '（无）';

  document.getElementById('failList').textContent =
    failList.map(o => o.order + ' ' + o.name + '（' + (o.shortId || '?') + '）— ' + o.reason).join('\n') || '（无）';

  if (extraList.length) {
    document.getElementById('extraCard').style.display = 'block';
    document.getElementById('extraList').textContent =
      extraList.map(o => o.name + '（' + o.shortId + '）').join('\n');
  }

  document.getElementById('output').style.display = 'block';
  setSubStatus('翻到下面查看结果');
}

function copyText(text, label) {
  if (!text) { alert('列表为空'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => alert(label + '已复制'),
      () => fallbackCopy(text, label)
    );
  } else {
    fallbackCopy(text, label);
  }
}
function fallbackCopy(text, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert(label + '已复制'); }
  catch (e) { alert('复制失败，请手动选中复制'); }
  ta.remove();
}
function copyOk() {
  const text = okList.map(o => o.order + ' ' + o.name + ' ' + o.url).join('\n');
  copyText(text, '成功列表');
}

window.addEventListener('DOMContentLoaded', run);
</script>
</body>
</html>
