<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名片图探测 · 诊断版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  background: #f5f5f5; color: #222; font-size: 14px;
  padding: 12px; padding-bottom: 40px; line-height: 1.5;
}
h1 { font-size: 17px; margin-bottom: 10px; }
.card {
  background: #fff; border-radius: 10px; padding: 12px;
  margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.title { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 8px; }
.line { font-size: 12px; padding: 4px 0; word-break: break-all; }
.ok { color: #2a7a2a; }
.fail { color: #b3261e; }
.wait { color: #888; }
pre {
  background: #fafafa; border: 1px solid #eee; border-radius: 8px;
  padding: 10px; font-size: 12px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-all;
  max-height: 300px; overflow-y: auto;
  font-family: ui-monospace, Menlo, monospace;
}
img.testimg { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
</style>
</head>
<body>

<h1>名片图探测 · 诊断</h1>

<div class="card">
  <div class="title">① 依赖加载</div>
  <div class="line" id="diagIconDict">icon-dict.js：检测中…</div>
  <div class="line" id="diagCharTxt">characters.txt：检测中…</div>
</div>

<div class="card">
  <div class="title">② 单张测试图（丝柯克）</div>
  <div class="line" id="diagSingle">加载中…</div>
  <div id="singleImgBox"></div>
</div>

<div class="card">
  <div class="title">③ 批量探测结果</div>
  <div class="line" id="diagBatch">等待①②先完成…</div>
  <pre id="batchLog"></pre>
</div>

<script src="shared/gi-icons/icon-dict.js"></script>
<script>
'use strict';

const PREFIX = 'https://api.lunaris.moe/data/assets/namecardpic/';
const SUFFIX = '_P.png';
const TEST_URL = PREFIX + 'UI_NameCardPic_SkirkNew' + SUFFIX;

const diagIconDict = document.getElementById('diagIconDict');
const diagCharTxt = document.getElementById('diagCharTxt');
const diagSingle = document.getElementById('diagSingle');
const singleImgBox = document.getElementById('singleImgBox');
const diagBatch = document.getElementById('diagBatch');
const batchLog = document.getElementById('batchLog');

function log(msg, cls) {
  const div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.textContent = msg;
  batchLog.appendChild(div);
}

/* ① 检查 icon-dict */
let dictOK = false;
try {
  if (window.ICON_DICT && window.ICON_DICT.characters) {
    const n = Object.keys(window.ICON_DICT.characters).length;
    diagIconDict.textContent = 'icon-dict.js：✅ 已加载，' + n + ' 个角色';
    diagIconDict.className = 'line ok';
    dictOK = true;
  } else {
    diagIconDict.textContent = 'icon-dict.js：❌ 加载了但没有 characters 数据';
    diagIconDict.className = 'line fail';
  }
} catch (e) {
  diagIconDict.textContent = 'icon-dict.js：❌ 异常 ' + e.message;
  diagIconDict.className = 'line fail';
}

/* ② 单张图测试 */
function testSingleImage() {
  return new Promise(resolve => {
    diagSingle.textContent = '加载中…';
    diagSingle.className = 'line wait';
    const img = new Image();
    const t0 = Date.now();
    img.onload = () => {
      diagSingle.textContent = '✅ 成功加载（' + (Date.now() - t0) + 'ms，' + img.naturalWidth + '×' + img.naturalHeight + '）';
      diagSingle.className = 'line ok';
      img.className = 'testimg';
      singleImgBox.innerHTML = '';
      singleImgBox.appendChild(img);
      resolve(true);
    };
    img.onerror = () => {
      diagSingle.textContent = '❌ 加载失败（onerror 触发，耗时 ' + (Date.now() - t0) + 'ms）';
      diagSingle.className = 'line fail';
      resolve(false);
    };
    img.src = TEST_URL;
  });
}

/* ③ 批量探测（用 Image） */
function urlExists(url) {
  return new Promise(resolve => {
    const img = new Image();
    let settled = false;
    const done = ok => { if (!settled) { settled = true; resolve(ok); } };
    img.onload = () => done(true);
    img.onerror = () => done(false);
    setTimeout(() => done(false), 12000);
    img.src = url;
  });
}

function stripPrefix(key) {
  return key.replace(/^UI_AvatarIcon_/i, '').replace(/\.[^.]+$/, '');
}

async function loadCharList() {
  const res = await fetch('shared/data/characters.txt?t=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const list = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('#')) return;
    const parts = line.split(/[\s,，\t]+/);
    if (parts.length < 2) return;
    const order = parseInt(parts[0], 10);
    const name = parts.slice(1).join(' ').trim();
    if (!order || !name) return;
    list.push({ order, name });
  });
  return list;
}

function findShortIdByName(name, dict) {
  for (const key in dict) {
    const item = dict[key];
    if (item && item.name === name) return stripPrefix(key);
  }
  return '';
}

async function runBatch(charList) {
  batchLog.innerHTML = '';
  diagBatch.textContent = '开始，共 ' + charList.length + ' 个…';
  diagBatch.className = 'line';

  let ok = 0, fail = 0;

  for (let i = 0; i < charList.length; i++) {
    const item = charList[i];
    const shortId = findShortIdByName(item.name, window.ICON_DICT.characters);
    if (!shortId) {
      fail++;
      log('❌ ' + item.order + ' ' + item.name + '（icon-dict 无此角色）', 'fail');
      continue;
    }
    const url = PREFIX + shortId + SUFFIX;
    const exists = await urlExists(url);
    if (exists) {
      ok++;
      log('✅ ' + item.order + ' ' + item.name + ' → ' + shortId, 'ok');
    } else {
      fail++;
      log('❌ ' + item.order + ' ' + item.name + ' → ' + shortId + '（' + url + '）', 'fail');
    }
    diagBatch.textContent = '进行中：' + (i + 1) + '/' + charList.length + '（成功 ' + ok + '，失败 ' + fail + '）';
    if (i % 10 === 9) await new Promise(r => setTimeout(r, 30));
  }

  diagBatch.textContent = '完成：成功 ' + ok + '，失败 ' + fail;
  diagBatch.className = 'line ' + (fail === 0 ? 'ok' : 'fail');
}

/* 主流程 */
(async function () {
  const singleOK = await testSingleImage();
  log('单张测试：' + (singleOK ? '✅ 通过' : '❌ 失败') + ' → ' + TEST_URL, singleOK ? 'ok' : 'fail');

  if (!dictOK) {
    diagCharTxt.textContent = 'characters.txt：跳过（icon-dict 未加载）';
    diagCharTxt.className = 'line fail';
    diagBatch.textContent = '依赖缺失，终止';
    diagBatch.className = 'line fail';
    return;
  }

  let charList;
  try {
    charList = await loadCharList();
    diagCharTxt.textContent = 'characters.txt：✅ 读到 ' + charList.length + ' 个角色';
    diagCharTxt.className = 'line ok';
  } catch (e) {
    diagCharTxt.textContent = 'characters.txt：❌ ' + e.message;
    diagCharTxt.className = 'line fail';
    diagBatch.textContent = 'characters.txt 加载失败，终止';
    diagBatch.className = 'line fail';
    return;
  }

  await runBatch(charList);
})();
</script>
</body>
</html>
