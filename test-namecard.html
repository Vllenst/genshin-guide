<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名片图 CORS 测试</title>
<style>
body { font-family: system-ui, sans-serif; padding: 16px; background: #F2EFEA; color: #222; }
.item { padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; }
.ok { background: #e8f7ee; border-color: #a8dab5; }
.fail { background: #fdecea; border-color: #f5a8a0; }
.url { font-weight: 600; word-break: break-all; margin-bottom: 6px; font-size: 11px; }
.res { color: #666; font-size: 12px; }
</style>
</head>
<body>
<h1 style="font-size:16px;">名片图 CORS 测试</h1>
<div id="out">加载中…</div>
<script>
var urls = [
  "https://api.lunaris.moe/data/assets/namecardpic/UI_NameCardPic_SkirkNew_P.png",
  "https://api.lunaris.moe/data/assets/namecardpic/UI_NameCardPic_Escoffier_P.png",
  "https://api.lunaris.moe/data/assets/namecardpic/UI_NameCardPic_Hutao_P.png"
];
var out = document.getElementById("out");

(async function () {
  for (var i = 0; i < urls.length; i++) {
    var url = urls[i];
    var div = document.createElement("div");
    div.className = "item";
    div.innerHTML = '<div class="url">' + url + '</div><div class="res">测试中…</div>';
    out.appendChild(div);
    var resEl = div.querySelector(".res");

    try {
      var img = new Image();
      img.crossOrigin = "anonymous";
      await new Promise(function (resolve, reject) {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });

      // 尝试画到 canvas 看能不能 toDataURL（CORS 的最终判定）
      try {
        var canvas = document.createElement("canvas");
        canvas.width = 100; canvas.height = 100;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, 100, 100);
        canvas.toDataURL("image/png");

        div.className = "item ok";
        resEl.textContent = "✅ 支持 CORS · 可以裁剪（原图 " + img.width + "×" + img.height + "）";
      } catch (e) {
        div.className = "item fail";
        resEl.textContent = "❌ 图片能显示但不支持 CORS，无法 Canvas 裁剪 · " + e.message;
      }
    } catch (e) {
      div.className = "item fail";
      resEl.textContent = "❌ 图片加载失败 · " + e.message;
    }
  }
})();
</script>
</body>
</html>
