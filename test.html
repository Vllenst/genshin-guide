<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图标库测试</title>
<style>
body {
  font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  background: #F2EFEA;
  color: #222;
  padding: 16px;
  margin: 0;
  line-height: 1.6;
}
h1 { font-size: 18px; margin-bottom: 12px; }
.section { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #eee; }
.section h2 { font-size: 14px; margin: 0 0 10px; color: #8B7355; }
.row { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #eee; word-break: break-all; }
.row:last-child { border-bottom: 0; }
.ok { color: #2a8a3e; font-weight: 600; }
.fail { color: #c0392b; font-weight: 600; }
.key { color: #666; }
.val { color: #222; }
.preview { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.preview img { width: 120px; height: 120px; border-radius: 10px; border: 1px solid #ddd; }
.err { color: #c0392b; font-size: 12px; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>

<h1>图标库测试</h1>

<div class="section">
  <h2>基础信息</h2>
  <div class="row" id="baseInfo">加载中…</div>
</div>

<div class="section">
  <h2>匹配测试</h2>
  <div id="matchList">加载中…</div>
</div>

<div class="section">
  <h2>加载并生成背景（预览）</h2>
  <div class="preview" id="previewBox">加载中…</div>
  <div class="err" id="errBox"></div>
</div>

<script src="icons/icon-map.js"></script>
<script src="icons/icon-loader.js"></script>
<script>
(async function () {
  // ---- 基础信息 ----
  document.getElementById('baseInfo').innerHTML =
    '<span class="key">ICON_BASE：</span><span class="val">' + ICON_LIB.base + '</span>';

  // ---- 匹配测试 ----
  var tests = ['薇斯娜', 'Vesna', '旅行者', '旅行者·火', '旅行者（火）'];
  var html = '';
  tests.forEach(function (t) {
    var r = ICON_LIB.match('characters', t);
    if (r) {
      html += '<div class="row"><span class="ok">✓</span> ' +
        t + ' → <span class="val">' + r.key + '</span> <span class="key">(' + r.name + ', ' + r.star + '★)</span></div>';
    } else {
      html += '<div class="row"><span class="fail">✗</span> ' + t + ' → 未匹配</div>';
    }
  });
  document.getElementById('matchList').innerHTML = html;

  // ---- 加载预览 ----
  var previewBox = document.getElementById('previewBox');
  var errBox = document.getElementById('errBox');
  previewBox.innerHTML = '';

  var names = ['薇斯娜', '旅行者'];
  for (var i = 0; i < names.length; i++) {
    try {
      var result = await ICON_LIB.fromName('characters', names[i]);
      if (result && result.dataURL) {
        var img = document.createElement('img');
        img.src = result.dataURL;
        img.title = result.name;
        previewBox.appendChild(img);
      } else {
        var div = document.createElement('div');
        div.textContent = names[i] + '：未找到';
        previewBox.appendChild(div);
      }
    } catch (e) {
      errBox.textContent += names[i] + ' 加载失败：' + e.message + '\n';
    }
  }
})();
</script>

</body>
</html>
