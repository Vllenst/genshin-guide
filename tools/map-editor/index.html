<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<!-- =========================================================================
     图标字典编辑器 · index.html
     =========================================================================
     HTML 模块导航：
       【HTML 模块 1】 head / 资源引用
       【HTML 模块 2】 分类 Tab + 操作按钮
       【HTML 模块 3】 条目列表容器
       【HTML 模块 4】 粘贴 URL 弹窗
       【HTML 模块 5】 状态栏
       【HTML 模块 6】 JS 引用
     ========================================================================= -->
<head>
<!-- 【HTML 模块 1】head / 资源引用 -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2EFEA">
<title>图标字典编辑器</title>
<link rel="stylesheet" href="../../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 【HTML 模块 2】分类 Tab + 操作按钮 -->
<div class="sticky-head">
  <div class="sticky-inner">
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="characters">角色</button>
      <button class="tab-btn" data-tab="artifacts">圣遗物</button>
      <button class="tab-btn" data-tab="weapons">武器</button>
      <button class="tab-btn" data-tab="monsters">怪物</button>
    </nav>

    <div class="actions-group">
      <div class="actions-row">
        <button type="button" class="ios-btn-fill" id="btnSync"><span class="btn-icon"></span>从 Amber 同步</button>
        <button type="button" id="btnPaste"><span class="btn-icon"></span>粘贴 URL</button>
      </div>
      <div class="actions-row">
        <button type="button" id="btnLoad"><span class="btn-icon"></span>载入</button>
        <button type="button" id="btnExport"><span class="btn-icon"></span>导出</button>
        <button type="button" class="btn-danger" id="btnClear"><span class="btn-icon"></span>清空</button>
      </div>
    </div>
  </div>
</div>

<!-- 【HTML 模块 3】条目列表容器 -->
<div class="main">
  <div class="entries" id="entries"></div>
  <div class="empty-tip" id="emptyTip" style="display:none;">
    <span class="big-icon">📭</span>
    当前分类还没有条目<br>
    点上方按钮开始
  </div>
</div>

<!-- 【HTML 模块 4】粘贴 URL 弹窗 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title">粘贴图标链接</div>
    <div class="modal-hint">每行一个完整 URL，程序自动提取图标名并查 Amber 中文名。</div>
    <textarea id="pasteArea" placeholder="https://api.lunaris.moe/data/assets/avataricon/UI_AvatarIcon_SkirkNew.webp"></textarea>
    <div class="modal-actions">
      <button type="button" id="modalCancel">取消</button>
      <button type="button" class="ios-btn-fill" id="modalConfirm">解析并添加</button>
    </div>
  </div>
</div>

<!-- 【HTML 模块 5】状态栏 -->
<div class="status-bar" id="status">就绪</div>

<!-- 【HTML 模块 6】JS 引用 -->
<script src="../../shared/ui-icons.js"></script>
<script src="../../shared/gi-icons/icon-loader.js"></script>
<script src="app.js"></script>
</body>
</html>
