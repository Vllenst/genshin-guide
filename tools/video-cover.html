<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2EFEA">
<title>封面制作工具</title>
<link rel="stylesheet" href="../shared-theme.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body, input, button, select, textarea { font-family: var(--std-font); -webkit-font-smoothing: antialiased; }
body {
  background: var(--bg-base); color: var(--text-primary); font-size: 13px;
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
button svg, .btn svg, .btn-sm svg, .btn-xs svg,
.ios-btn-fill svg, .file-btn svg, .icon-only svg {
  width: 1em; height: 1em; display: inline-block; vertical-align: middle; flex-shrink: 0;
}

/* ========== 顶部栏 ========== */
.app-header {
  position: sticky; top: 0; z-index: 50;
  height: 52px; padding: 0 14px;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: center;
}
.seg-control {
  display: flex; background: var(--bg-sunken); padding: 3px;
  border-radius: 12px; border: 1px solid var(--border-subtle); gap: 2px;
}
.seg-btn {
  min-width: 96px; height: 32px;
  background: transparent; border: 0; border-radius: 9px;
  color: var(--text-secondary); font-family: inherit;
  font-size: 13px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 10px;
}
.seg-btn.active {
  background: var(--bg-surface); color: var(--text-primary);
  font-weight: 600; box-shadow: 0 1px 3px rgba(31,29,26,.08);
}

/* ========== 预览区 ========== */
.preview-sticky {
  position: sticky; top: 52px; z-index: 35;
  background: var(--bg-base);
  padding: 10px 14px; border-bottom: 1px solid var(--border-subtle);
}
.preview-frame {
  max-width: 900px; margin: 0 auto; position: relative;
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: 6px; display: flex; justify-content: center;
  box-shadow: var(--shadow-card);
}
#svgPreviewHost {
  display: block; background: #1c1c22; width: 100%; height: auto;
  aspect-ratio: 16 / 9; border-radius: 6px;
}
#svgPreviewHost > svg { width: 100%; height: 100%; display: block; }

.float-toolbar {
  position: absolute; top: 12px; right: 12px;
  display: flex; gap: 4px; z-index: 15;
}
.float-btn {
  height: 30px; min-width: 30px; padding: 0 8px;
  border-radius: 8px;
  background: rgba(255,255,255,0.9); border: 1px solid var(--border-subtle);
  color: var(--text-primary); font-family: inherit;
  font-size: 12px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  box-shadow: var(--shadow-btn);
}
[data-theme="dark"] .float-btn { background: rgba(30,28,26,0.9); }
.float-btn:active { transform: scale(.95); }
.float-btn svg { width: 15px; height: 15px; display: block; }
.float-btn-danger { color: var(--danger); border-color: var(--danger-border); }

/* ========== 表单布局 ========== */
.grid {
  display: flex; flex-direction: column; gap: 14px;
  padding: 14px; max-width: 900px; margin: 0 auto; width: 100%;
}
.ios-section-header {
  font-size: 12px; font-weight: 600; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 0 4px 6px; display: flex; align-items: center; justify-content: space-between;
}
.ios-group {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-card);
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 640px) { .row2 { grid-template-columns: 1fr; } }
label.ios-field {
  display: flex; flex-direction: column; gap: 5px;
  font-size: 11px; color: var(--text-secondary); font-weight: 500;
}
input[type="text"], input[type="number"], select, textarea {
  width: 100%; height: var(--ctl-h); padding: 0 12px;
  border-radius: 8px; border: 1px solid var(--border-default);
  background: var(--bg-sunken); color: var(--text-primary);
  font-size: 13px; font-family: inherit; outline: none;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
  background: var(--bg-surface); border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { height: 64px; padding: 8px 12px; resize: vertical; line-height: 1.4; }

/* 文件选择器 */
.file-picker {
  display: flex; align-items: center; gap: 8px; height: 40px;
  padding: 0 8px 0 4px; border: 1px dashed var(--border-default);
  border-radius: 8px; background: var(--bg-surface-2);
}
.file-btn {
  height: 30px; padding: 0 12px; font-size: 12px;
  background: var(--bg-surface); border: 1px solid var(--border-default);
  border-radius: 8px; color: var(--text-primary); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.file-btn input[type="file"] { display: none; }
.file-picker-name {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-size: 12px; color: var(--text-tertiary);
}

/* 滑块 */
.control-item { display: flex; flex-direction: column; gap: 5px; }
.control-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-secondary); }
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
.num-box {
  display: inline-flex; align-items: center; padding: 0 8px;
  height: 32px; width: 82px; flex-shrink: 0;
  background: var(--bg-sunken); border: 1px solid var(--border-default);
  border-radius: 8px;
}
.num-box input[type="number"] {
  width: 100%; height: 100%; border: none; background: transparent;
  padding: 0; text-align: right; font-size: 12px;
}
.num-box .unit-tag { font-size: 11px; color: var(--text-tertiary); margin-left: 3px; }

/* 按钮 */
.btn {
  height: var(--ctl-h); padding: 0 14px;
  background: var(--bg-surface); border: 1px solid var(--border-default);
  border-radius: 8px; color: var(--text-primary);
  font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  box-shadow: var(--shadow-btn);
}
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--text-primary); color: var(--bg-base); border-color: var(--text-primary);
}
.btn-danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn-xs { height: 26px; padding: 0 8px; font-size: 11px; border-radius: 8px; }
.full-width { width: 100%; }

/* 缩略图 */
.clickable-thumb {
  width: 42px; height: 42px; border-radius: 8px;
  background: var(--bg-sunken); border: 1px solid var(--border-default);
  object-fit: cover; cursor: pointer; flex-shrink: 0;
}

/* 浮动素材卡片 */
.float-item {
  background: var(--bg-surface-2); border: 1px solid var(--border-subtle);
  border-radius: 10px; padding: 10px;
  display: flex; flex-direction: column; gap: 8px;
}
.float-item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.float-thumb { width: 44px; height: 32px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-subtle); }

/* 底部工具栏 */
.bottom-dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--bg-base);
  border-top: 1px solid var(--border-subtle);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; align-items: center; justify-content: center;
}
.export-btn-main {
  width: 100%; max-width: 480px; height: 46px;
  font-size: 15px; font-weight: 600;
  background: var(--text-primary); color: var(--bg-base);
  border: 1px solid var(--text-primary); border-radius: 999px;
  box-shadow: 0 4px 16px rgba(31,29,26,.18);
  cursor: pointer; font-family: inherit;
}

/* 弹层 */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: var(--mask);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
.sheet-backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 201; background: var(--bg-surface);
  overflow-y: auto; overscroll-behavior: contain;
  left: 0; right: 0; bottom: 0;
  border-radius: 16px 16px 0 0; max-height: 75dvh;
  padding: 6px 0 calc(10px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform .32s cubic-bezier(.16,1,.3,1);
}
.sheet.show { transform: translateY(0); }
@media (min-width: 1024px) {
  .sheet {
    left: 50%; right: auto; bottom: auto; top: 50%; width: 360px;
    max-height: 70vh; border-radius: 16px; padding: 8px 0 10px;
    transform: translate(-50%, -48%) scale(.96); opacity: 0;
    transition: transform .22s, opacity .22s;
  }
  .sheet.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
.sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 6px auto 4px; opacity: .55; }
@media (min-width: 1024px) { .sheet-handle { display: none; } }
.sheet-header { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .6px; padding: 8px 22px; }
.sheet-list { display: flex; flex-direction: column; padding: 0 8px; }
.sheet-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; height: 48px; padding: 0 14px;
  background: transparent; border: 0; border-radius: 10px;
  font-family: inherit; font-size: 14px; font-weight: 500;
  color: var(--text-primary); text-align: left; cursor: pointer;
}
.sheet-item:hover { background: var(--bg-hover); }
.sheet-item.active { color: var(--accent); font-weight: 600; }
.sheet-item-check { width: 16px; height: 16px; opacity: 0; color: var(--accent); }
.sheet-item.active .sheet-item-check { opacity: 1; }

.status-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--bg-base); border-top: 1px solid var(--border-subtle);
  padding: 6px 16px calc(6px + env(safe-area-inset-bottom));
  font-size: 12px; color: var(--text-secondary); text-align: center;
}
</style>
</head>

<body>

<header class="app-header">
  <div class="seg-control" id="coverTypeSeg">
    <button type="button" class="seg-btn active" data-type="video">视频封面</button>
    <button type="button" class="seg-btn" data-type="collection">合集封面</button>
  </div>
</header>

<!-- ==================== 视频封面模式 ==================== -->
<div id="videoMode">
  <div class="preview-sticky">
    <div class="preview-frame">
      <div id="svgPreviewHost"></div>
      <div class="float-toolbar">
        <button type="button" class="float-btn" id="btnGuides" title="参考线">参考线</button>
        <button type="button" class="float-btn" id="btnExportVideo" title="导出配置">导出</button>
        <label class="float-btn" title="导入配置" style="cursor:pointer;">
          导入
          <input type="file" id="importVideoInput" accept=".json" style="display:none">
        </label>
        <button type="button" class="float-btn float-btn-danger" id="btnClearVideo" title="清空">清空</button>
      </div>
    </div>
  </div>

  <main class="grid">
    <!-- 字体 -->
    <section>
      <div class="ios-section-header">字体（仅作用于导出图片）</div>
      <div class="ios-group">
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" id="labelVideoFont">默认系统字体</div>
          <button type="button" class="btn btn-sm" onclick="App.openFontPicker('video')">选择字体</button>
        </div>
      </div>
    </section>

    <!-- 游戏 Logo -->
    <section>
      <div class="ios-section-header">游戏 Logo</div>
      <div class="ios-group">
        <div style="display:flex; align-items:center; gap:8px;">
          <img id="logoThumb" class="clickable-thumb" alt="">
          <select id="logoSelect" style="flex:1;"></select>
        </div>
        <div class="control-item">
          <div class="control-header"><span>Logo 尺寸</span></div>
          <div class="slider-row">
            <input type="range" id="capLogoSize" min="50" max="400" value="200" oninput="App.syncVal('capLogoSize', this.value)">
            <div class="num-box"><input type="number" id="capLogoSizeInput" min="50" max="400" value="200" oninput="App.syncVal('capLogoSize', this.value)"><span class="unit-tag">px</span></div>
          </div>
        </div>
        <div class="control-item">
          <div class="control-header"><span>Logo 圆角</span></div>
          <div class="slider-row">
            <input type="range" id="capLogoRounded" min="0" max="100" value="50" oninput="App.syncVal('capLogoRounded', this.value)">
            <div class="num-box"><input type="number" id="capLogoRoundedInput" min="0" max="100" value="50" oninput="App.syncVal('capLogoRounded', this.value)"><span class="unit-tag">%</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 画布背景 -->
    <section>
      <div class="ios-section-header">画布背景</div>
      <div class="ios-group">
        <div class="file-picker">
          <label class="file-btn">上传文件<input type="file" id="bgFile" accept="image/*"></label>
          <span class="file-picker-name" id="bgFileName">未选择文件</span>
        </div>
        <div class="row2">
          <div class="control-item">
            <div class="control-header"><span>背景亮度</span></div>
            <div class="slider-row">
              <input type="range" id="midBrightness" min="-100" max="100" value="-50" oninput="App.syncVal('midBrightness', this.value)">
              <div class="num-box"><input type="number" id="midBrightnessInput" min="-100" max="100" value="-50" oninput="App.syncVal('midBrightness', this.value)"><span class="unit-tag">%</span></div>
            </div>
          </div>
          <div class="control-item">
            <div class="control-header"><span>背景模糊</span></div>
            <div class="slider-row">
              <input type="range" id="midBlur" min="0" max="100" value="50" oninput="App.syncVal('midBlur', this.value)">
              <div class="num-box"><input type="number" id="midBlurInput" min="0" max="100" value="50" oninput="App.syncVal('midBlur', this.value)"><span class="unit-tag">%</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 攻略模式 -->
    <section>
      <div class="ios-section-header">攻略模式</div>
      <div class="ios-group">
        <div class="seg-control" id="guideTypeSeg" style="width:100%;">
          <button type="button" class="seg-btn active" data-type="boss" style="flex:1;">BOSS攻略</button>
          <button type="button" class="seg-btn" data-type="character" style="flex:1;">角色攻略</button>
          <button type="button" class="seg-btn" data-type="custom" style="flex:1;">自定义</button>
        </div>

        <!-- BOSS 模式面板 -->
        <div id="bossPanel">
          <label class="ios-field">BOSS 名称
            <input type="text" id="bossNameInput" placeholder="如：游雪的护刃" oninput="App.onBossNameInput(this.value)" onblur="App.matchBossName(this.value)">
          </label>
          <div style="font-size:11px; color:var(--text-tertiary); line-height:1.5;">在 data/monsters.txt 中查找对应图标</div>
        </div>

        <!-- 角色模式面板 -->
        <div id="characterPanel" style="display:none;">
          <label class="ios-field">角色名称
            <input type="text" id="characterNameInput" placeholder="如：达达利亚" oninput="App.onCharacterNameInput(this.value)" onblur="App.matchCharacterName(this.value)">
          </label>
          <div style="font-size:11px; color:var(--text-tertiary); line-height:1.5;">在 data/character-art.txt 查立绘，在 icon-dict.js 查名片图</div>
          <div class="control-item">
            <div class="control-header"><span>立绘 X 位置</span></div>
            <div class="slider-row">
              <input type="range" id="characterX" min="0" max="3840" value="2650" oninput="App.syncVal('characterX', this.value)">
              <div class="num-box"><input type="number" id="characterXInput" min="0" max="3840" value="2650" oninput="App.syncVal('characterX', this.value)"><span class="unit-tag">px</span></div>
            </div>
          </div>
        </div>

        <!-- 自定义面板 -->
        <div id="customPanel" style="display:none;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
            <span style="font-size:12px; color:var(--text-secondary);">浮动素材</span>
            <button type="button" class="btn btn-xs" onclick="App.addFloat()">+ 添加素材</button>
          </div>
          <div id="floatList" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
      </div>
    </section>

    <!-- 胶囊标签 -->
    <section>
      <div class="ios-section-header">胶囊标签</div>
      <div class="ios-group">
        <label class="ios-field">标签文字
          <input type="text" id="capTextInput" placeholder="如：攻略 / 速刷" oninput="App.set('capText', this.value)">
        </label>
        <div class="control-item">
          <div class="control-header"><span>文字亮度</span></div>
          <div class="slider-row">
            <input type="range" id="capTextBrightness" min="0" max="200" value="100" oninput="App.syncVal('capTextBrightness', this.value)">
            <div class="num-box"><input type="number" id="capTextBrightnessInput" min="0" max="200" value="100" oninput="App.syncVal('capTextBrightness', this.value)"><span class="unit-tag">%</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 主标题 -->
    <section>
      <div class="ios-section-header">主标题</div>
      <div class="ios-group">
        <label class="ios-field">
          <textarea id="mainTextInput" rows="2" placeholder="输入主标题（支持回车两行）" oninput="App.set('mainText', this.value)"></textarea>
        </label>
      </div>
    </section>

    <!-- 副标题 -->
    <section>
      <div class="ios-section-header">副标题</div>
      <div class="ios-group">
        <div class="row2">
          <label class="ios-field">第一行
            <input type="text" id="sub1Input" placeholder="第一行文字" oninput="App.set('sub1', this.value)">
          </label>
          <label class="ios-field">字号
            <select id="sub1Select" onchange="App.setSubSize(1, this.value)">
              <option value="200" selected>小字号 (200)</option>
              <option value="250">大字号 (250)</option>
            </select>
          </label>
        </div>
        <div class="row2">
          <label class="ios-field">第二行
            <input type="text" id="sub2Input" placeholder="第二行文字" oninput="App.set('sub2', this.value)">
          </label>
          <label class="ios-field">字号
            <select id="sub2Select" onchange="App.setSubSize(2, this.value)">
              <option value="200">小字号 (200)</option>
              <option value="250" selected>大字号 (250)</option>
            </select>
          </label>
        </div>
      </div>
    </section>
  </main>

  <div class="bottom-dock">
    <button class="export-btn-main" onclick="App.exportPNG()">生成并导出 4K PNG</button>
  </div>
</div>

<!-- ==================== 合集封面模式 ==================== -->
<div id="collectionMode" style="display:none;">
  <div class="preview-sticky">
    <div class="preview-frame">
      <div id="collectionPreview" style="width:100%; aspect-ratio:16/9; background:#1c1c22; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center;"></div>
      <div class="float-toolbar">
        <button type="button" class="float-btn" id="btnClearCollection" title="清空">清空</button>
      </div>
    </div>
  </div>

  <main class="grid">
    <section>
      <div class="ios-section-header">画布</div>
      <div class="ios-group">
        <div class="row2">
          <label class="ios-field">输出分辨率
            <select id="collectionSize" onchange="App.setCollection('sizePreset', this.value)">
              <option value="2k" selected>2560 × 1440（2K 推荐）</option>
              <option value="1920">1920 × 1080</option>
              <option value="1280">1280 × 720</option>
            </select>
          </label>
          <div>
            <div class="ios-field">背景图</div>
            <div class="file-picker">
              <label class="file-btn">上传<input type="file" id="collectionBgFile" accept="image/*"></label>
              <span class="file-picker-name" id="collectionBgName">未选择文件</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="ios-section-header">字体（仅作用于导出图片）</div>
      <div class="ios-group">
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" id="labelCollectionFont">默认系统字体</div>
          <button type="button" class="btn btn-sm" onclick="App.openFontPicker('collection')">选择字体</button>
        </div>
      </div>
    </section>

    <section>
      <div class="ios-section-header">文字内容</div>
      <div class="ios-group">
        <label class="ios-field">主标题
          <textarea rows="2" id="collectionTitle" placeholder="输入合集主标题" oninput="App.setCollection('title', this.value)"></textarea>
        </label>
        <label class="ios-field">副标题
          <textarea rows="2" id="collectionSubtitle" placeholder="输入合集副标题" oninput="App.setCollection('subtitle', this.value)"></textarea>
        </label>
      </div>
    </section>
  </main>

  <div class="bottom-dock">
    <button class="export-btn-main" onclick="App.exportCollection()">导出合集封面 PNG</button>
  </div>
</div>

<!-- 字体弹层 -->
<div class="sheet-backdrop" id="fontSheetBackdrop" onclick="App.closeFontPicker()"></div>
<div class="sheet" id="fontSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">选择字体</div>
  <div class="sheet-list" id="fontSheetList"></div>
</div>

<script src="../icons.js"></script>
<script src="../icons/icon-loader.js"></script>
<script src="../icons/icon-dict.js"></script>
<script>
'use strict';

/* =========================================================================
 * 常量
 * ========================================================================= */
const SVG_W = 3840;
const SVG_H = 2160;
const BLUR_MAX_PX = 100;

const BOSS_BASE_URL = '../assets/video-cover/boss-base.png';
const LOGO_BASE_URL = '../assets/video-cover/';
const DEFAULT_LOGO_FILE = 'gi-logo.png';

const DEFAULT_MAIN_TEXTS = {
  boss: '世界Boss\n&地方传奇',
  character: '角色培养\n攻略图鉴',
  custom: ''
};

/* =========================================================================
 * 状态
 * ========================================================================= */
const state = {
  showGuides: true,
  safeBoundX: 480,
  bg: '',
  midBrightness: -50,
  midBlur: 50,
  capX: 550, capY: 150, capH: 250,
  capLogoSize: 200, capLogoRounded: 50,
  capFontSize: 180, capText: '', capTextBrightness: 100,
  capLogo: '',
  capEdgeInset: 2 / 3, capLogoGap: 40,
  mainX: 550, mainY: 760, mainSize: 340, mainLineGap: 350,
  mainText: '', mainColor: '#ffffff',
  subX: 550, subY: 1500, sub1Size: 200, sub2Size: 250,
  sub1: '', sub2: '', subColor: '#ffffff', subLineGap: 250,
  sigX: 550, sigY: 1980, sigSize: 100, sigStarBoost: 15, sigColor: '#ffffff',
  fontData: '', fontName: '', fontFileName: '',
  // 攻略模式
  guideType: 'boss',
  bossNameInput: '',
  bossAvatar: null,   // { url, w, h }
  characterNameInput: '',
  characterArt: null, // { url, w, h }
  characterX: 2650,
  floatImg: []        // 自定义模式用
};

const collectionState = {
  sizePreset: '2k',
  W: 2560, H: 1440,
  bg: '', bgLoadedImg: null,
  fontData: '', fontName: '', fontFileName: '',
  title: '', subtitle: ''
};

/* =========================================================================
 * 匹配数据（txt 和 icon-dict）
 * ========================================================================= */
let MONSTERS_DICT = {};   // 中文名 -> 短 ID
let CHARACTER_ART_DICT = {}; // 角色名 -> 完整 URL
let CHAR_SHORTID = {};    // 角色名 -> 短 ID（从 icon-dict.js 反查）
let LOGO_LIST = [];       // [{ name, file }]

async function loadDataFiles() {
  // monsters.txt
  try {
    const res = await fetch('../data/monsters.txt?t=' + Date.now());
    if (res.ok) {
      const txt = await res.text();
      txt.split(/\r?\n/).forEach(line => {
        line = line.trim();
        if (!line || line.startsWith('#')) return;
        const parts = line.split(/\s+/);
        if (parts.length >= 2) {
          MONSTERS_DICT[parts[0]] = parts[1];
        }
      });
    }
  } catch (e) { console.warn('monsters.txt 加载失败', e); }

  // character-art.txt
  try {
    const res = await fetch('../data/character-art.txt?t=' + Date.now());
    if (res.ok) {
      const txt = await res.text();
      txt.split(/\r?\n/).forEach(line => {
        line = line.trim();
        if (!line || line.startsWith('#')) return;
        const idx = line.indexOf(' ');
        if (idx > 0) {
          const name = line.slice(0, idx).trim();
          const url = line.slice(idx + 1).trim();
          if (name && url) CHARACTER_ART_DICT[name] = url;
        }
      });
    }
  } catch (e) { console.warn('character-art.txt 加载失败', e); }

  // icon-dict.js 里的角色短 ID
  const dict = window.ICON_DICT && window.ICON_DICT.characters;
  if (dict) {
    for (const key in dict) {
      const item = dict[key];
      if (item && item.name) {
        let shortId = key;
        if (item.local) {
          shortId = key.replace(/^UI_AvatarIcon_/i, '').replace(/\.[^.]+$/, '');
        }
        CHAR_SHORTID[item.name] = shortId;
      }
    }
  }

  // data/logos.txt（可选）
  try {
    const res = await fetch('../data/logos.txt?t=' + Date.now());
    if (res.ok) {
      const txt = await res.text();
      txt.split(/\r?\n/).forEach(line => {
        line = line.trim();
        if (!line || line.startsWith('#')) return;
        const parts = line.split(/\s+/);
        if (parts.length >= 2) {
          LOGO_LIST.push({ name: parts[0], file: parts[1] });
        }
      });
    }
  } catch (e) {}
  if (!LOGO_LIST.length) {
    LOGO_LIST.push({ name: '原神', file: DEFAULT_LOGO_FILE });
  }
}

/* =========================================================================
 * 工具函数
 * ========================================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function num(v) { return (v === '' || v == null || isNaN(Number(v))) ? 0 : Number(v); }
function getFormattedDateStr() {
  const now = new Date();
  return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function showToast(msg, type) {
  // 简化版提示：用 status bar 或 alert
  console.log('[' + (type || 'info') + '] ' + msg);
  const bar = document.getElementById('hiddenStatus') || document.createElement('div');
  // 用简单的 alert 兜底
  if (type === 'error') alert(msg);
}

/* =========================================================================
 * SVG 生成
 * ========================================================================= */
const measureCtx = document.createElement('canvas').getContext('2d');
function getFontFamily() {
  return state.fontName ? `'${state.fontName}'` : 'system-ui, sans-serif';
}
function measureTextWidth(text, size, font) {
  measureCtx.font = `${size}px ${font || getFontFamily()}`;
  return measureCtx.measureText(String(text)).width;
}
function capsulePath(x, y, w, h) {
  const r = h / 2;
  return `M ${x + r} ${y} H ${x + w - r} A ${r} ${r} 0 0 1 ${x + w} ${y + r} A ${r} ${r} 0 0 1 ${x + w - r} ${y + h} H ${x + r} A ${r} ${r} 0 0 1 ${x} ${y + r} A ${r} ${r} 0 0 1 ${x + r} ${y} Z`;
}
function getCapsuleGeometry() {
  const s = state;
  const R = s.capH / 2;
  const inset = (s.capEdgeInset == null ? 2 / 3 : s.capEdgeInset) * R;
  const logoW = s.capLogo ? s.capLogoSize : 0;
  const textW = measureTextWidth(s.capText, s.capFontSize, getFontFamily());
  const logoGap = logoW ? (s.capLogoGap == null ? 40 : s.capLogoGap) : 0;
  const contentW = logoW + logoGap + textW;
  const capW = contentW + 2 * inset;
  return {
    R, inset, logoW, logoGap, textW, capW,
    logoX: s.capX + inset,
    logoY: s.capY + (s.capH - s.capLogoSize) / 2,
    textRightX: s.capX + capW - inset,
    textBaseline: s.capY + s.capH / 2 + s.capFontSize * 0.35,
    capPath: capsulePath(s.capX, s.capY, capW, s.capH)
  };
}
function getFloatGeom(o) {
  const imgH = SVG_H * o.scale;
  const imgW = imgH * (o.w / Math.max(1, o.h));
  return { x: o.x - imgW / 2, y: (SVG_H - imgH) / 2, imgW, imgH };
}

function buildSVG(showGuides) {
  const s = state;
  const font = getFontFamily();
  const fontFace = s.fontData ? `@font-face{font-family:'${s.fontName}';src:url("${s.fontData}");font-display:block}` : '';

  const cap = getCapsuleGeometry();
  const logoX = cap.logoX, logoY = cap.logoY;
  const textRightX = cap.textRightX, textBaseline = cap.textBaseline, capPath = cap.capPath;

  const mainLines = String(s.mainText || '').split('\n').filter((l, i) => l.trim() !== '' || i === 0).slice(0, 2);
  const subLines = [];
  if (s.sub1) subLines.push({ key: 'sub1', t: s.sub1, size: s.sub1Size || 200 });
  if (s.sub2) subLines.push({ key: 'sub2', t: s.sub2, size: s.sub2Size || 250 });

  const sigLeft = 'GENSHIN IMPACT', sigStar = '✧', sigRight = 'GRILLED TIGER FISH LW';
  const starSize = s.sigSize + s.sigStarBoost;
  const gapW = measureTextWidth(' ', s.sigSize, font);
  const wL = measureTextWidth(sigLeft, s.sigSize, font);
  const wS = measureTextWidth(sigStar, starSize, font);
  const sigStarCX = s.sigX + wL + gapW + wS / 2;
  const sigBaseline = s.sigY;

  // 收集浮动素材
  const allFloats = collectFloats();
  const lowerFloats = allFloats.filter(o => o.underMiddle);
  const upperFloats = allFloats.filter(o => !o.underMiddle);

  const floatClipDefs = allFloats.map(o => {
    const { x, y, imgW, imgH } = getFloatGeom(o);
    const r = Math.min(100, Math.max(0, Number(o.rounded) || 0));
    const radius = Math.min(imgW, imgH) / 2 * (r / 100);
    return `<clipPath id="fclip-${o.id}"><rect x="${x}" y="${y}" width="${imgW}" height="${imgH}" rx="${radius}" ry="${radius}"/></clipPath>`;
  }).join('');

  function floatImages(arr) {
    return arr.map(o => {
      const { x, y, imgW, imgH } = getFloatGeom(o);
      return `<image data-float-id="${o.id}" href="${o.url}" x="${x}" y="${y}" width="${imgW}" height="${imgH}" preserveAspectRatio="xMidYMid meet" clip-path="url(#fclip-${o.id})"/>`;
    }).join('');
  }

  // 参考线
  const cropW = SVG_H * 4 / 3;
  const guideContent = s.showGuides ? (
    [s.safeBoundX, s.safeBoundX + cropW / 2, s.safeBoundX + cropW * 3 / 4, s.safeBoundX + cropW]
      .map(x => `<line x1="${x}" y1="0" x2="${x}" y2="${SVG_H}" stroke="#888888" stroke-width="2" stroke-dasharray="12 12" opacity="0.5" vector-effect="non-scaling-stroke"/>`).join('')
  ) : '';

  const adaptLayer = (s.bg && s.capText) ? `
    <g filter="url(#capTextBrightnessFilter)" mask="url(#capTextMask)">
      <image href="${s.bg}" x="0" y="0" width="${SVG_W}" height="${SVG_H}" preserveAspectRatio="xMidYMid slice"/>
    </g>` : '';

  const capShadowFilter = `
    <filter id="capShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="${cap.R * 0.18}" dy="${cap.R * 0.18}" stdDeviation="0" flood-color="#000000" flood-opacity="0.5"/>
    </filter>`;

  const blurPx = (Math.min(100, Math.max(0, Number(s.midBlur) || 0)) / 100) * BLUR_MAX_PX;
  const midPad = Math.max(1, blurPx * 3);
  const midFilter = `
    <filter id="midFilter" x="${-midPad}" y="${-midPad}" width="${SVG_W + midPad * 2}" height="${SVG_H + midPad * 2}" filterUnits="userSpaceOnUse">
      <feGaussianBlur id="midBlurFe" stdDeviation="${blurPx}"/>
      <feComponentTransfer id="midBrightnessFe">
        <feFuncR type="linear" slope="${1 + s.midBrightness / 100}"/>
        <feFuncG type="linear" slope="${1 + s.midBrightness / 100}"/>
        <feFuncB type="linear" slope="${1 + s.midBrightness / 100}"/>
      </feComponentTransfer>
    </filter>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${SVG_W}" height="${SVG_H}" viewBox="0 0 ${SVG_W} ${SVG_H}">
<defs>
  <style>${fontFace} text { font-family: ${font}; paint-order: fill; text-rendering: geometricPrecision; font-synthesis: none; }</style>
  <linearGradient id="midMask" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#fff"/>
    <stop offset="60%" stop-color="#000"/><stop offset="100%" stop-color="#000"/>
  </linearGradient>
  <mask id="midMaskUse"><rect x="0" y="0" width="${SVG_W}" height="${SVG_H}" fill="url(#midMask)"/></mask>
  ${s.capLogo ? `<clipPath id="logoClip"><rect x="${logoX}" y="${logoY}" width="${s.capLogoSize}" height="${s.capLogoSize}" rx="${s.capLogoRounded}" ry="${s.capLogoRounded}"/></clipPath>` : ''}
  ${capShadowFilter}${midFilter}
  <filter id="capTextBrightnessFilter" x="-20%" y="-20%" width="140%" height="140%">
    <feComponentTransfer id="capTextBrightnessFe">
      <feFuncR type="linear" slope="${Math.max(0, s.capTextBrightness) / 100}"/>
      <feFuncG type="linear" slope="${Math.max(0, s.capTextBrightness) / 100}"/>
      <feFuncB type="linear" slope="${Math.max(0, s.capTextBrightness) / 100}"/>
    </feComponentTransfer>
  </filter>
  ${s.bg && s.capText ? `<mask id="capTextMask"><text data-field="capText" x="${textRightX}" y="${textBaseline}" font-size="${s.capFontSize}" fill="#fff" text-anchor="end">${esc(s.capText)}</text></mask>` : ''}
  ${floatClipDefs}
</defs>

${s.bg ? `<image href="${s.bg}" x="0" y="0" width="${SVG_W}" height="${SVG_H}" preserveAspectRatio="xMidYMid slice"/>` : '<rect width="3840" height="2160" fill="#1c1c22"/>'}
${floatImages(lowerFloats)}
${s.bg ? `<g mask="url(#midMaskUse)" filter="url(#midFilter)"><image id="midBlurImage" href="${s.bg}" x="${-midPad}" y="${-midPad}" width="${SVG_W + midPad * 2}" height="${SVG_H + midPad * 2}" preserveAspectRatio="none"/></g>` : ''}
${floatImages(upperFloats)}
<g filter="url(#capShadow)">
  <path id="capCapsulePath" d="${capPath}" fill="#ffffff"/>
  ${s.capLogo ? `<image href="${s.capLogo}" x="${logoX}" y="${logoY}" width="${s.capLogoSize}" height="${s.capLogoSize}" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>` : ''}
  <text data-field="capText" filter="url(#capTextBrightnessFilter)" x="${textRightX}" y="${textBaseline}" font-size="${s.capFontSize}" fill="#ffffff" text-anchor="end">${esc(s.capText)}</text>
</g>
${adaptLayer}

<g>
  ${mainLines.map((line, i) => {
    const y = s.mainY + i * s.mainLineGap;
    return `<text data-field="mainText.${i}" x="${s.mainX + 12}" y="${y + 12}" font-size="${s.mainSize}" fill="#000" opacity="0.5">${esc(line)}</text>` +
           `<text data-field="mainText.${i}" x="${s.mainX}" y="${y}" font-size="${s.mainSize}" fill="${s.mainColor}">${esc(line)}</text>`;
  }).join('')}
</g>

<g>
  ${subLines.map((line, i) => {
    const subGap = s.subLineGap == null ? 250 : s.subLineGap;
    const y = (subLines.length === 1 ? s.subY + subGap / 2 : s.subY) + i * subGap;
    return `<text data-field="${line.key}" x="${s.subX + 12}" y="${y + 12}" font-size="${line.size}" fill="#000" opacity="0.5">${esc(line.t)}</text>` +
           `<text data-field="${line.key}" x="${s.subX}" y="${y}" font-size="${line.size}" fill="${s.subColor}">${esc(line.t)}</text>`;
  }).join('')}
</g>

<g>
  <text x="${s.sigX + 12}" y="${sigBaseline + 12}" font-size="${s.sigSize}" fill="#000" opacity="0.5">${esc(sigLeft)}</text>
  <text x="${s.sigX}" y="${sigBaseline}" font-size="${s.sigSize}" fill="${s.sigColor}">${esc(sigLeft)}</text>
  <text x="${sigStarCX + 12}" y="${sigBaseline + 12}" font-size="${starSize}" fill="#000" opacity="0.5" text-anchor="middle">${sigStar}</text>
  <text x="${sigStarCX}" y="${sigBaseline}" font-size="${starSize}" fill="${s.sigColor}" text-anchor="middle">${sigStar}</text>
  <text x="${s.sigX + wL + gapW + wS + gapW + 12}" y="${sigBaseline + 12}" font-size="${s.sigSize}" fill="#000" opacity="0.5">${esc(sigRight)}</text>
  <text x="${s.sigX + wL + gapW + wS + gapW}" y="${sigBaseline}" font-size="${s.sigSize}" fill="${s.sigColor}">${esc(sigRight)}</text>
</g>

<g id="guideLayer" pointer-events="none">${guideContent}</g>
</svg>`;
}

function collectFloats() {
  if (state.guideType === 'boss') {
    const arr = [];
    // 底图（固定参数）
    arr.push({
      id: 'boss-base',
      url: BOSS_BASE_URL,
      w: 1000, h: 1000,   // 占位，加载后更新
      x: 2650,
      scale: 0.7,
      rounded: 0,
      underMiddle: true
    });
    // 头像
    if (state.bossAvatar && state.bossAvatar.url) {
      arr.push({
        id: 'boss-avatar',
        url: state.bossAvatar.url,
        w: state.bossAvatar.w,
        h: state.bossAvatar.h,
        x: 2650,
        scale: 0.5,
        rounded: 100,
        underMiddle: true
      });
    }
    return arr;
  }
  if (state.guideType === 'character') {
    if (state.characterArt && state.characterArt.url) {
      return [{
        id: 'character-art',
        url: state.characterArt.url,
        w: state.characterArt.w,
        h: state.characterArt.h,
        x: state.characterX,
        scale: 1,
        rounded: 0,
        underMiddle: false
      }];
    }
    return [];
  }
  // custom
  return state.floatImg;
}

/* =========================================================================
 * 预览挂载
 * ========================================================================= */
let previewSvgEl = null;
let rafJobs = new Map();
let rafScheduled = false;
function scheduleRaf(key, job) {
  rafJobs.set(key, job);
  if (rafScheduled) return;
  rafScheduled = true;
  requestAnimationFrame(() => {
    rafScheduled = false;
    const jobs = Array.from(rafJobs.values());
    rafJobs.clear();
    jobs.forEach(fn => { try { fn(); } catch (e) {} });
  });
}

function mountPreview() {
  const host = document.getElementById('svgPreviewHost');
  if (!host) return;
  host.innerHTML = buildSVG(state.showGuides);
  previewSvgEl = host.querySelector('svg');
}

/* =========================================================================
 * 应用接口
 * ========================================================================= */
const App = {
  // === 通用 ===
  set(key, value) {
    if (state[key] === value) return;
    state[key] = value;
    mountPreview();
    persist();
  },
  syncVal(key, val) {
    if (val === '' || isNaN(val)) return;
    state[key] = Number(val);
    const slider = document.getElementById(key);
    const input = document.getElementById(key + 'Input');
    if (document.activeElement !== slider && slider) slider.value = val;
    if (document.activeElement !== input && input) input.value = val;
    mountPreview();
    persist();
  },
  setSubSize(line, value) {
    state[line === 1 ? 'sub1Size' : 'sub2Size'] = Number(value);
    mountPreview();
    persist();
  },

  // === 攻略模式 ===
  setGuideType(type) {
    const oldType = state.guideType;
    const oldDefault = DEFAULT_MAIN_TEXTS[oldType] || '';
    if (!state.mainText || state.mainText === oldDefault) {
      state.mainText = DEFAULT_MAIN_TEXTS[type] || '';
      const mainInput = document.getElementById('mainTextInput');
      if (mainInput) mainInput.value = state.mainText;
    }
    state.guideType = type;

    document.querySelectorAll('#guideTypeSeg .seg-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.type === type);
    });
    document.getElementById('bossPanel').style.display = type === 'boss' ? 'block' : 'none';
    document.getElementById('characterPanel').style.display = type === 'character' ? 'block' : 'none';
    document.getElementById('customPanel').style.display = type === 'custom' ? 'block' : 'none';

    mountPreview();
    persist();
  },

  onBossNameInput(val) { state.bossNameInput = val; },
  async matchBossName(name) {
    name = (name || '').trim();
    if (!name) { state.bossAvatar = null; mountPreview(); return; }
    const shortId = MONSTERS_DICT[name];
    if (!shortId) {
      alert('在 data/monsters.txt 中未找到「' + name + '」');
      state.bossAvatar = null;
      mountPreview();
      return;
    }
    const url = 'https://api.lunaris.moe/data/assets/monstericon/UI_MonsterIcon_' + shortId + '.png';
    try {
      const img = await loadImage(url);
      state.bossAvatar = { url, w: img.width, h: img.height };
      mountPreview();
      persist();
    } catch (e) {
      alert('图标加载失败：' + url);
    }
  },

  onCharacterNameInput(val) { state.characterNameInput = val; },
  async matchCharacterName(name) {
    name = (name || '').trim();
    if (!name) {
      state.characterArt = null;
      mountPreview();
      return;
    }
    const artUrl = CHARACTER_ART_DICT[name];
    const shortId = CHAR_SHORTID[name];

    if (!artUrl) {
      alert('在 data/character-art.txt 中未找到「' + name + '」的立绘');
      state.characterArt = null;
      mountPreview();
      return;
    }

    try {
      const img = await loadImage(artUrl);
      state.characterArt = { url: artUrl, w: img.width, h: img.height };
    } catch (e) {
      alert('立绘加载失败：' + artUrl);
      state.characterArt = null;
    }

    // 名片图作为背景
    if (shortId) {
      const namecardUrl = 'https://api.lunaris.moe/data/assets/namecardpic/UI_NameCardPic_' + shortId + '_P.png';
      try {
        await loadImage(namecardUrl);
        state.bg = namecardUrl;
        const bgNameEl = document.getElementById('bgFileName');
        if (bgNameEl) bgNameEl.textContent = '已自动加载名片图';
      } catch (e) {}
    }

    mountPreview();
    persist();
  },

  // === 浮动素材（自定义模式）===
  addFloat() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = () => {
      const f = input.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          state.floatImg.push({
            id: 'f_' + Date.now(),
            url: reader.result,
            w: img.width, h: img.height,
            x: SVG_W * 0.75, scale: 1, rounded: 0, underMiddle: false
          });
          renderFloatList();
          mountPreview();
          persist();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(f);
    };
    input.click();
  },

let FONT_LIST = [];

async function loadFontList() {

async function installFont(target) {
  if (target === 'collection') {
    if (!collectionState.fontData || !window.FontFace) return;
    try {
      if (loadedCollectionFontFace) { try { document.fonts.delete(loadedCollectionFontFace); } catch (e) {} }
      const ff = new FontFace(collectionState.fontName, `url("${collectionState.fontData}")`);
      const loaded = await ff.load();
      document.fonts.add(loaded);
      loadedCollectionFontFace = loaded;
    } catch (e) {}
    return;
  }
  if (!state.fontData || !window.FontFace) return;
  try {
    if (loadedFontFace) { try { document.fonts.delete(loadedFontFace); } catch (e) {} }
    const ff = new FontFace(state.fontName, `url("${state.fontData}")`);
    const loaded = await ff.load();
    document.fonts.add(loaded);
    loadedFontFace = loaded;
  } catch (e) {}
}

/* =========================================================================
 * 合集封面 Canvas 绘制
 * ========================================================================= */
function collectionSizeValue(preset) {
  if (preset === '1920') return [1920, 1080];
  if (preset === '1280') return [1280, 720];
  return [2560, 1440];
}

function updateFileNameDisplay(input) {

async function drawCollectionCanvas(canvas) {
  const W = collectionState.W, H = collectionState.H;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  if (collectionState.bg) {
    let img = collectionState.bgLoadedImg;
    if (!img || img.src !== collectionState.bg) {
      img = await new Promise(resolve => {
        const i = new Image();
        i.crossOrigin = 'anonymous';
        i.onload = () => resolve(i);
        i.onerror = () => resolve(null);
        i.src = collectionState.bg;
      });
      if (img) collectionState.bgLoadedImg = img;
    }
    if (img) {
      const blurPx = Math.max(12, Math.round(W * 0.015));
      const pad = Math.ceil(blurPx * 3) + 20;
      const off = document.createElement('canvas');
      off.width = W + pad * 2; off.height = H + pad * 2;
      const offCtx = off.getContext('2d');
      offCtx.fillStyle = '#000';
      offCtx.fillRect(0, 0, off.width, off.height);
      const scale = Math.max(off.width / img.width, off.height / img.height);
      const iw = img.width * scale, ih = img.height * scale;
      const ix = (off.width - iw) / 2, iy = (off.height - ih) / 2;
      offCtx.save();
      offCtx.filter = `blur(${blurPx}px)`;
      offCtx.drawImage(img, ix, iy, iw, ih);
      offCtx.restore();
      ctx.drawImage(off, pad, pad, W, H, 0, 0, W, H);
    } else {
      ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
    }
  } else {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  }

  drawCollectionText(ctx);
}

function drawCollectionText(ctx) {
  const W = collectionState.W, H = collectionState.H;
  const baseSize = W * 0.10;
  const maxWidth = W * 0.85;
  const fontName = collectionState.fontName || 'system-ui';
  const font = `"${fontName}", system-ui, sans-serif`;
  const titleLines = String(collectionState.title || '').split(/\r?\n/);
  const subtitleLines = String(collectionState.subtitle || '').split(/\r?\n/);
  const title = titleLines.filter(t => t !== '').map(text => ({ text, color: '#ffffff', group: 'title' }));
  const subtitle = subtitleLines.filter(t => t !== '').map(text => ({ text, color: '#ffe898', group: 'subtitle' }));
  const lines = title.concat(subtitle);
  if (!lines.length) return;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  const normalGap = baseSize * 0.12, groupGap = baseSize;

  const measured = lines.map(item => {
    let fs = baseSize;
    ctx.font = `${fs}px ${font}`;
    while (ctx.measureText(item.text).width > maxWidth && fs > 12) {
      fs -= 1; ctx.font = `${fs}px ${font}`;
    }
    return { ...item, fs };
  });

  let totalHeight = 0;
  measured.forEach((line, i) => {
    totalHeight += line.fs;
    if (i < measured.length - 1) {
      totalHeight += measured[i + 1].group !== line.group ? groupGap : normalGap;
    }
  });

  let y = H / 2 - totalHeight / 2;
  for (let i = 0; i < measured.length; i++) {
    const line = measured[i];
    y += line.fs / 2;
    ctx.font = `${line.fs}px ${font}`;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 50;
    ctx.strokeText(line.text, W / 2, y);
    ctx.fillStyle = line.color; ctx.fillText(line.text, W / 2, y);
    y += line.fs / 2;
    if (i < measured.length - 1) {
      y += measured[i + 1].group !== line.group ? groupGap : normalGap;
    }
  }
}

async function renderCollection() {
  const box = document.getElementById('collectionPreview');
  if (!box) return;
  let canvas = box.querySelector('canvas');
  if (!canvas) { canvas = document.createElement('canvas'); box.appendChild(canvas); }
  await drawCollectionCanvas(canvas);
}

/* =========================================================================
 * 数据持久化（IndexedDB）
 * ========================================================================= */
const IDB_NAME = 'video_cover_db';
const IDB_STORE = 'state';

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

let persistTimer = null;
function persist() {
  if (persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(async () => {
    try {
      const db = await openIDB();
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const store = tx.objectStore(IDB_STORE);
      // 序列化：剔除不可序列化的
      const stateSave = { ...state };
      const collectionSave = { ...collectionState };
      delete collectionSave.bgLoadedImg;
      store.put(stateSave, 'video_state');
      store.put(collectionSave, 'collection_state');
    } catch (e) {}
  }, 500);
}

async function loadPersist() {
  try {
    const db = await openIDB();
    return new Promise(resolve => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const r1 = store.get('video_state');
      const r2 = store.get('collection_state');
      let done = 0;
      const check = () => { if (++done >= 2) resolve(); };
      r1.onsuccess = () => { if (r1.result) Object.assign(state, r1.result); check(); };
      r2.onsuccess = () => { if (r2.result) Object.assign(collectionState, r2.result); check(); };
      r1.onerror = r2.onerror = check;
    });
  } catch (e) {}
}

function getExportBaseName() {
  const s2 = (state.sub2 || '').trim();

  const mt = (state.mainText || '').trim();
  let name = s2 || s1 || mt || '视频封面';
  return name.replace(/[\r\n]+/g, '').replace(/[\\/:*?"<>|]/g, '_');
}

    btn.addEventListener('click', () => App.setGuideType(btn.dataset.type));
  });

  // 背景上传
  document.getElementById('bgFile').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    updateFileNameDisplay(e.target);
    const reader = new FileReader();
    reader.onload = () => {
      state.bg = reader.result;
      mountPreview();
      persist();
    };
    reader.readAsDataURL(f);
    e.target.value = '';
  });

  // 合集封面背景
  document.getElementById('collectionBgFile').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    updateFileNameDisplay(e.target);
    const reader = new FileReader();
    reader.onload = () => {
      collectionState.bg = reader.result;
      collectionState.bgLoadedImg = null;
      renderCollection();
      persist();
    };
    reader.readAsDataURL(f);
    e.target.value = '';
  });

  // 参考线
  document.getElementById('btnGuides').addEventListener('click', () => App.toggleGuides());

  // 导出/导入/清空
  document.getElementById('btnExportVideo').addEventListener('click', () => App.exportConfig());
  document.getElementById('importVideoInput').addEventListener('change', e => App.importConfig(e.target));
  document.getElementById('btnClearVideo').addEventListener('click', () => App.clearAll());
  document.getElementById('btnClearCollection').addEventListener('click', () => App.clearCollection());
}

/* =========================================================================
 * 主题同步
 * ========================================================================= */
window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'theme') {
    const html = document.documentElement;
    html.classList.add('theme-switching');
    html.setAttribute('data-theme', e.data.theme);
    void html.offsetHeight;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        html.classList.remove('theme-switching');
      });
    });
  }
});

/* =========================================================================
 * 初始化
 * ========================================================================= */
(async function init() {
  // 加载数据
  await loadDataFiles();
  await loadFontList();
  await loadPersist();

  // 恢复字体
  if (state.fontData) await installFont('');
  if (collectionState.fontData) await installFont('collection');

  // 初始化 Logo 下拉
  const logoSelect = document.getElementById('logoSelect');
  if (logoSelect) {
    logoSelect.innerHTML = LOGO_LIST.map((l, i) =>
      '<option value="' + esc(l.file) + '">' + esc(l.name) + '</option>'
    ).join('');
    // 默认选中第一个
    if (!state.capLogo) state.capLogo = LOGO_BASE_URL + LOGO_LIST[0].file;
    logoSelect.value = LOGO_LIST[0].file;
    logoSelect.addEventListener('change', function () {
      state.capLogo = LOGO_BASE_URL + this.value;
      const t = document.getElementById('logoThumb');
      if (t) t.src = state.capLogo;
      mountPreview();
      persist();
    });
    const t = document.getElementById('logoThumb');
    if (t) t.src = state.capLogo;
  }

  syncInputsFromState();
  renderFloatList();
  bindEvents();
  mountPreview();
})();

</script>
