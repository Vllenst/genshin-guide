<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>武器卡片生成器 正式版</title>
<style>
    :root {
        --page-bg: #0d0d0d;
        --panel-bg: #1b1b1b;
        --line: #333;
        --text: #fff;
        --muted: #aaa;
        --gold: #d8c8b0;
        --blue: #498fcc;
        --green: #359697;
        --red: #b33;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 12px;
        background: var(--page-bg);
        color: var(--text);
        font-family: var(--font);
        font-weight: 400;
    }
    .app {
        max-width: 980px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .topbar,
    .preview-frame,
    .group {
        background: var(--panel-bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .topbar {
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
    }
    .topbar-title {
        font-size: 15px;
        color: var(--gold);
        margin-right: auto;
    }
    .topbar-actions {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: flex-end;
    }
    .topbar-actions button {
        width: 76px;
        min-width: 76px;
        padding: 8px 0;
        text-align: center;
    }
    .preview-sticky {
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(180deg, #0d0d0d 0%, rgba(13,13,13,.94) 78%, rgba(13,13,13,0) 100%);
        padding-bottom: 8px;
    }
    .preview-frame {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 10px;
    }
    .preview-wrapper {
        width: 230px;
        border-radius: 10px;
        overflow: hidden;
        background: transparent;
        box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }
    #svgPreview { display: block; width: 100%; height: auto; background: transparent; }
    .group { padding: 12px; }
    .group h3 {
        margin: 0 0 10px;
        color: var(--gold);
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid #333;
        padding-bottom: 8px;
        font-weight: 400;
    }
    .drawer-title {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
    }
    .drawer-toggle {
        width: 56px;
        min-width: 56px;
        padding: 6px 0;
        background: #333;
        color: #eee;
        border: 1px solid #555;
    }
    .group.collapsed h3 {
        margin-bottom: 0;
        border-bottom: 0;
        padding-bottom: 0;
    }
    .group.collapsed .drawer-content { display: none; }
    .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }
    .grid.one { grid-template-columns: 1fr; }
    label {
        display: flex;
        flex-direction: column;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
    }
    input, select, textarea, button { font-family: var(--font); }
    input[type="text"], select, textarea {
        width: 100%;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid #4c4c4c;
        border-radius: 8px;
        background: #111;
        color: #fff;
        font-size: 14px;
        outline: none;
    }
    input[type="text"], select { height: 38px; }
    textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
    input[type="file"] {
        width: 100%;
        color: #aaa;
        font-size: 12px;
        border: 1px dashed #4c4c4c;
        border-radius: 8px;
        padding: 8px;
        background: #111;
    }
    button {
        border: 0;
        border-radius: 8px;
        padding: 9px 11px;
        background: var(--gold);
        color: #111;
        font-size: 13px;
        cursor: pointer;
        font-weight: 400;
    }
    button.secondary { background: var(--blue); color: #fff; }
    button.green { background: var(--green); color: #fff; }
    button.danger { background: var(--red); color: #fff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .hint { color: #888; font-size: 11px; line-height: 1.45; }
    .export-main {
        width: 100%;
        min-height: 48px;
        font-size: 16px;
        background: #DCA454;
        color: #111;
        margin-bottom: env(safe-area-inset-bottom);
    }
    @media (max-width: 720px) {
        body { padding: 8px; }
        .grid { grid-template-columns: 1fr; }
        .topbar-title { width: 100%; margin-right: 0; }
        button { width: 100%; }
        .topbar-actions button { width: 76px; min-width: 76px; }
        .drawer-toggle { width: 56px; min-width: 56px; }
    }
</style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="topbar-title">武器卡片生成器</div>
        <div class="topbar-actions">
            <button class="secondary" onclick="exportConfig()">导出 JSON</button>
            <button class="green" onclick="document.getElementById('importJson').click()">导入 JSON</button>
            <button class="danger" onclick="clearAll()">清空</button>
        </div>
        <input id="importJson" type="file" accept=".json" style="display:none" onchange="importConfig(this)" />
    </div>

    <div class="preview-sticky">
        <div class="preview-frame">
            <div class="preview-wrapper" id="previewWrapper"></div>
        </div>
    </div>
    <div class="hint">预览、JSON 配置和 PNG 导出都来自同一份数据。JSON 会保存当前填写内容和已上传素材。</div>

    <div class="group" data-drawer="base">
        <h3><span class="drawer-title">基础信息</span><button class="drawer-toggle" onclick="toggleDrawer('base')">收起</button></h3>
        <div class="drawer-content">
            <div class="grid">
                <label>武器名称<input id="inpName" type="text" placeholder="例如：钺矛"></label>
                <label>武器类型
                    <select id="inpType">
                        <option value="">请选择</option>
                        <option value="弓">弓</option>
                        <option value="单手剑">单手剑</option>
                        <option value="双手剑">双手剑</option>
                        <option value="长柄武器">长柄武器</option>
                        <option value="法器">法器</option>
                    </select>
                </label>
                <label>副词条名称<input id="inpSubLabel" type="text" placeholder="例如：攻击力"></label>
                <label>副词条数值<input id="inpSubVal" type="text" placeholder="例如：13.1%"></label>
                <label>基础攻击力<input id="inpMainVal" type="text" placeholder="例如：187"></label>
                <label>星级
                    <select id="inpStar">
                        <option value="1">1星</option>
                        <option value="2">2星</option>
                        <option value="3">3星</option>
                        <option value="4" selected>4星</option>
                        <option value="5">5星</option>
                    </select>
                </label>
                <label>精炼等级
                    <select id="inpRefine">
                        <option value="1" selected>精炼1阶</option>
                        <option value="2">精炼2阶</option>
                        <option value="3">精炼3阶</option>
                        <option value="4">精炼4阶</option>
                        <option value="5">精炼5阶</option>
                    </select>
                </label>
            </div>
            <div class="hint" style="margin-top:8px;">等级固定为 Lv.90/90；精炼框数字会和精炼等级自动绑定。</div>
        </div>
    </div>

    <div class="group" data-drawer="assets">
        <h3><span class="drawer-title">素材</span><button class="drawer-toggle" onclick="toggleDrawer('assets')">收起</button></h3>
        <div class="drawer-content">
            <div class="grid">
                <label>上传武器图片<input id="weaponFile" type="file" accept="image/*"></label>
                <label>上传五角星图片<input id="starFile" type="file" accept="image/*"></label>
                <label>替换字体 (TTF/WOFF)<input id="fontFile" type="file" accept=".ttf,.woff,.woff2"></label>
            </div>
        </div>
    </div>

    <div class="group" data-drawer="text">
        <h3><span class="drawer-title">特效与故事</span><button class="drawer-toggle" onclick="toggleDrawer('text')">收起</button></h3>
        <div class="drawer-content">
            <div class="grid one">
                <label>特效名称<input id="inpSkillName" type="text" placeholder="例如：沉重"></label>
                <label>特效描述（用 [[文字]] 标记蓝色高亮）<textarea id="inpSkillDesc" placeholder="例如：造成[[320%]]攻击力的额外伤害"></textarea></label>
                <label>背景故事描述<textarea id="inpBgDesc" placeholder="输入背景故事"></textarea></label>
            </div>
        </div>
    </div>

    <button class="export-main" id="downloadPngBtn">生成并导出 2K PNG</button>
</div>

<script>
    const CARD = { width: 230, exportWidth: 1920 };
    const AREA = { titleH: 29, statsY: 29, statsH: 105, descY: 134 };
    const LAYOUT = {
        name: { x: 13, y: 22, size: 15 },
        type: { x: 13, y: 44, size: 10 },
        subLabel: { x: 13, y: 57, size: 10 },
        subVal: { x: 13, y: 70, size: 11 },
        mainLabel: { x: 13, y: 85, size: 10 },
        mainVal: { x: 13, y: 105, size: 20 },
        stars: { x: 13, y: 113, size: 13, gap: 16 },
        weapon: { w: 120, right: 227 },
        level: { x: 13, y: 145, w: 55, h: 14, textX: 41, textY: 155, size: 10 },
        refine: { x: 13, y: 165, w: 16, h: 16, numX: 21, numY: 177, numSize: 12, textX: 33, textY: 177, textSize: 11 },
        textLeft: 13,
        textRight: 217,
        skillY: 208,
        skillTitleY: 195,
        skillSize: 11,
        lineGap: 13,
        dividerGap: 10,
        storyGap: 10
    };
    const starBaseColors = { 1: '#727C85', 2: '#5A8F6A', 3: '#5084A5', 4: '#8F65A7', 5: '#A67C47' };
    const starPath = 'M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z';
    const skillColor = '#333D49';
    const storyColor = '#6A6F76';

    let weaponDataUrl = '';
    let starDataUrl = '';
    let fontDataUrl = '';
    let customFontName = '';
    let latestSvg = '';

    function escapeXML(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&apos;');
    }

    function hexToHsl(hex) {
        const num = parseInt(hex.replace('#',''), 16);
        const r = ((num >> 16) & 0xFF) / 255;
        const g = ((num >> 8) & 0xFF) / 255;
        const b = (num & 0xFF) / 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h = 0, s = 0;
        const l = (max + min) / 2;
        if (max !== min) {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            if (max === g) h = (b - r) / d + 2;
            if (max === b) h = (r - g) / d + 4;
            h /= 6;
        }
        return [h * 360, s * 100, l * 100];
    }

    function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs((h / 60) % 2 - 1));
        const m = l - c / 2;
        let r = 0, g = 0, b = 0;
        if (0 <= h && h < 60) { r = c; g = x; b = 0; }
        else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
        else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
        else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
        else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
        else { r = c; g = 0; b = x; }
        r = Math.round((r + m) * 255);
        g = Math.round((g + m) * 255);
        b = Math.round((b + m) * 255);
        return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }

    function makeDeepColor(hex) {
        const [h, s, l] = hexToHsl(hex);
        return hslToHex(h, Math.min(100, s * 1.4 + 15), Math.max(15, l * 0.62));
    }

    function darkenColor(hex, amount) {
        const num = parseInt(hex.replace('#',''), 16);
        const r = Math.max(0, Math.round(((num >> 16) & 0xFF) * (1 - amount)));
        const g = Math.max(0, Math.round(((num >> 8) & 0xFF) * (1 - amount)));
        const b = Math.max(0, Math.round((num & 0xFF) * (1 - amount)));
        return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }

    function readFileAsDataURL(file) {
        return new Promise(resolve => {
            if (!file) return resolve('');
            const reader = new FileReader();
            reader.onload = event => resolve(event.target.result);
            reader.readAsDataURL(file);
        });
    }

    async function loadCustomFont(name, url) {
        if (!name || !url || typeof FontFace === 'undefined') return;
        try {
            const font = new FontFace(name, `url(${url})`);
            const loaded = await font.load();
            document.fonts.add(loaded);
        } catch (err) {
            console.warn('自定义字体加载失败，测量将回退到默认字体', err);
        }
    }

    function cleanText(text) {
        return String(text || '').trim().replace(/\[\[(.*?)\]\]/g, '$1');
    }

    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');

    function measureTextWidth(text, size, fontFamily) {
        measureCtx.font = `${size}px ${fontFamily}`;
        return measureCtx.measureText(text).width;
    }

    function isPunctuationOnly(text) {
        return /^[\s，。；：！？、“”‘’（）《》【】·…—,.!?;:()[\]{}'"-]+$/.test(text);
    }

    function wrapText(text, maxWidth, size, fontFamily) {
        const chars = Array.from(cleanText(text));
        const lines = [];
        let line = '';
        chars.forEach(char => {
            const nextLine = line + char;
            if (line && measureTextWidth(nextLine, size, fontFamily) > maxWidth) {
                lines.push(line);
                line = char;
            } else {
                line = nextLine;
            }
        });
        if (line) {
            lines.push(line);
        }
        const fixedLines = [];
        lines.forEach(item => {
            if (fixedLines.length && isPunctuationOnly(item)) {
                fixedLines[fixedLines.length - 1] += item;
            } else {
                fixedLines.push(item);
            }
        });
        return fixedLines.length ? fixedLines : [''];
    }

    function richChars(text, prefix = '') {
        const normalized = String(text || '').trim().replace(/^[·•\s]+/, '');
        const chars = Array.from(prefix).map(char => ({ char, highlight: false }));
        const regex = /\[\[(.*?)\]\]/g;
        let lastIndex = 0;
        let match;
        while ((match = regex.exec(normalized)) !== null) {
            Array.from(normalized.slice(lastIndex, match.index)).forEach(char => chars.push({ char, highlight: false }));
            Array.from(match[1]).forEach(char => chars.push({ char, highlight: true }));
            lastIndex = regex.lastIndex;
        }
        Array.from(normalized.slice(lastIndex)).forEach(char => chars.push({ char, highlight: false }));
        return chars;
    }

    function linePlainText(line) {
        return line.map(part => part.char).join('');
    }

    function wrapRichText(text, maxWidth, size, fontFamily, prefix = '') {
        const paragraphs = String(text || '').split(/\n/).map(p => p.trim()).filter(p => p.length);
        const allLines = [];
        paragraphs.forEach(para => {
            const chars = richChars(para, prefix);
            const lines = [];
            let line = [];
            chars.forEach(part => {
                const nextLine = line.concat(part);
                if (line.length && measureTextWidth(linePlainText(nextLine), size, fontFamily) > maxWidth) {
                    lines.push(line);
                    line = [part];
                } else {
                    line = nextLine;
                }
            });
            if (line.length) lines.push(line);

            const fixedLines = [];
            lines.forEach(item => {
                if (fixedLines.length && isPunctuationOnly(linePlainText(item))) {
                    fixedLines[fixedLines.length - 1] = fixedLines[fixedLines.length - 1].concat(item);
                } else {
                    fixedLines.push(item);
                }
            });
            allLines.push(...(fixedLines.length ? fixedLines : [[{ char: '', highlight: false }]]));
        });
        return allLines.length ? allLines : [[{ char: '', highlight: false }]];
    }

    function textLine(x, y, value, size, fill, extra = '') {
        return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" ${extra}>${escapeXML(value)}</text>`;
    }

    function richTextLine(x, y, line, size, fill) {
        let out = `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}">`;
        line.forEach(part => {
            out += `<tspan fill="${part.highlight ? '#1E88E5' : fill}">${escapeXML(part.char)}</tspan>`;
        });
        out += '</text>';
        return out;
    }

    function statLabel(x, y, value, size) {
        return `<text x="${x}" y="${y}" font-size="${size}" fill="#FFFFFF" fill-opacity="0.62" font-weight="400">${escapeXML(value)}</text>`;
    }

    function renderStars(count) {
        let out = '';
        for (let i = 0; i < count; i++) {
            const x = LAYOUT.stars.x + i * LAYOUT.stars.gap;
            if (starDataUrl) {
                out += `<image href="${escapeXML(starDataUrl)}" x="${x}" y="${LAYOUT.stars.y}" width="${LAYOUT.stars.size}" height="${LAYOUT.stars.size}" preserveAspectRatio="xMidYMid meet"/>`;
            } else {
                const scale = LAYOUT.stars.size / 24;
                out += `<g transform="translate(${x},${LAYOUT.stars.y}) scale(${scale})"><path d="${starPath}" fill="#FFCC33"/></g>`;
            }
        }
        return out;
    }

    function getCardData() {
        return {
            name: document.getElementById('inpName').value,
            type: document.getElementById('inpType').value,
            subLabel: document.getElementById('inpSubLabel').value,
            subVal: document.getElementById('inpSubVal').value,
            mainVal: document.getElementById('inpMainVal').value,
            star: parseInt(document.getElementById('inpStar').value, 10) || 4,
            refine: parseInt(document.getElementById('inpRefine').value, 10) || 1,
            skillName: document.getElementById('inpSkillName').value,
            skillDesc: document.getElementById('inpSkillDesc').value,
            bgDesc: document.getElementById('inpBgDesc').value
        };
    }

    let currentCardHeight = 409;

    function renderSvg(data) {
        const baseColor = starBaseColors[data.star] || starBaseColors[4];
        const titleColor = makeDeepColor(baseColor);
        const statsLeftColor = darkenColor(baseColor, 0.4);
        const fontFamily = customFontName ? `'${customFontName}', sans-serif` : `'Microsoft YaHei', 'PingFang SC', sans-serif`;
        const textAreaWidth = Math.max(1, LAYOUT.textRight - LAYOUT.textLeft);
        const skillLines = wrapRichText(data.skillDesc, textAreaWidth, LAYOUT.skillSize, fontFamily, '·');
        const storyLines = wrapText(data.bgDesc, textAreaWidth, LAYOUT.skillSize, fontFamily);
        const lastSkillY = LAYOUT.skillY + (skillLines.length - 1) * LAYOUT.lineGap;
        const textAscent = LAYOUT.skillSize * 0.78;
        const textDescent = LAYOUT.skillSize * 0.22;
        const dividerY = lastSkillY + textDescent + LAYOUT.dividerGap;
        const storyStartY = dividerY + LAYOUT.storyGap + textAscent;
        const lastStoryY = storyStartY + (storyLines.length - 1) * LAYOUT.lineGap;
        const cardH = Math.max(AREA.descY + 80, Math.ceil(lastStoryY + textDescent + 3 * LAYOUT.lineGap));
        currentCardHeight = cardH;

        let fontStyle = '';
        if (fontDataUrl && customFontName) {
            fontStyle = `@font-face{font-family:'${customFontName}';src:url('${fontDataUrl}');}`;
        }

        let svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg id="svgPreview" xmlns="http://www.w3.org/2000/svg" width="${CARD.width}" height="${cardH}" viewBox="0 0 ${CARD.width} ${cardH}">
<defs>
    <style>
        ${fontStyle}
        text { font-family: ${fontFamily}; dominant-baseline: alphabetic; font-weight: 400; }
    </style>
    <clipPath id="cardClip"><rect x="0" y="0" width="${CARD.width}" height="${cardH}" rx="10" ry="10"/></clipPath>
    <clipPath id="textAreaClip"><rect x="${LAYOUT.textLeft}" y="${AREA.descY}" width="${LAYOUT.textRight - LAYOUT.textLeft}" height="${cardH - AREA.descY}"/></clipPath>
    <linearGradient id="statsGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="${statsLeftColor}"/>
        <stop offset="100%" stop-color="${baseColor}"/>
    </linearGradient>
    <pattern id="softPattern" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M16 3 C18 11 21 14 29 16 C21 18 18 21 16 29 C14 21 11 18 3 16 C11 14 14 11 16 3Z" fill="#000" opacity="0.035"/>
    </pattern>
    <filter id="weaponShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.38"/>
    </filter>
</defs>
<g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="${CARD.width}" height="${cardH}" fill="#F8F5EE"/>
    <rect x="0" y="0" width="${CARD.width}" height="${AREA.titleH}" fill="${titleColor}"/>
    ${textLine(LAYOUT.name.x, LAYOUT.name.y, data.name, LAYOUT.name.size, '#fff')}

    <rect x="0" y="${AREA.statsY}" width="${CARD.width}" height="${AREA.statsH}" fill="url(#statsGrad)"/>
    <rect x="0" y="${AREA.statsY}" width="${CARD.width}" height="${AREA.statsH}" fill="url(#softPattern)" opacity="0.35"/>
    ${textLine(LAYOUT.type.x, LAYOUT.type.y, data.type, LAYOUT.type.size, '#fff')}
    ${statLabel(LAYOUT.subLabel.x, LAYOUT.subLabel.y, data.subLabel, LAYOUT.subLabel.size)}
    ${textLine(LAYOUT.subVal.x, LAYOUT.subVal.y, data.subVal, LAYOUT.subVal.size, '#fff')}
    ${statLabel(LAYOUT.mainLabel.x, LAYOUT.mainLabel.y, '基础攻击力', LAYOUT.mainLabel.size)}
    ${textLine(LAYOUT.mainVal.x, LAYOUT.mainVal.y, data.mainVal, LAYOUT.mainVal.size, '#fff')}
    ${renderStars(data.star)}
    ${weaponDataUrl ? `<image href="${escapeXML(weaponDataUrl)}" x="${LAYOUT.weapon.right - LAYOUT.weapon.w}" y="${AREA.statsY}" width="${LAYOUT.weapon.w}" height="${AREA.statsH}" preserveAspectRatio="xMaxYMid meet" filter="url(#weaponShadow)"/>` : ''}

    <rect x="0" y="${AREA.descY}" width="${CARD.width}" height="${cardH - AREA.descY}" fill="#F6F2E7"/>
    <rect x="0" y="${AREA.descY}" width="${CARD.width}" height="${cardH - AREA.descY}" fill="url(#softPattern)" opacity="0.28"/>
    <rect x="${LAYOUT.level.x}" y="${LAYOUT.level.y}" width="${LAYOUT.level.w}" height="${LAYOUT.level.h}" rx="2.8" fill="#3F4851"/>
    <text x="${LAYOUT.level.textX}" y="${LAYOUT.level.textY}" text-anchor="middle" font-size="${LAYOUT.level.size}" fill="#fff">Lv.90/90</text>
    <rect x="${LAYOUT.refine.x}" y="${LAYOUT.refine.y}" width="${LAYOUT.refine.w}" height="${LAYOUT.refine.h}" rx="2.5" fill="#3F4851"/>
    <text x="${LAYOUT.refine.numX}" y="${LAYOUT.refine.numY}" text-anchor="middle" font-size="${LAYOUT.refine.numSize}" fill="#fff">${data.refine}</text>
    ${textLine(LAYOUT.refine.textX, LAYOUT.refine.textY, `精炼${data.refine}阶`, LAYOUT.refine.textSize, '#C7B06A')}
    <g clip-path="url(#textAreaClip)">
    ${textLine(LAYOUT.textLeft, LAYOUT.skillTitleY, data.skillName, LAYOUT.skillSize, skillColor)}
`;

        skillLines.forEach((line, index) => {
            svg += richTextLine(LAYOUT.textLeft, LAYOUT.skillY + index * LAYOUT.lineGap, line, LAYOUT.skillSize, skillColor);
        });

        svg += `</g><line x1="${LAYOUT.textLeft}" y1="${dividerY}" x2="${LAYOUT.textRight}" y2="${dividerY}" stroke="#000" stroke-opacity="0.12" stroke-width="1"/><g clip-path="url(#textAreaClip)">`;

        storyLines.forEach((line, index) => {
            svg += textLine(LAYOUT.textLeft, storyStartY + index * LAYOUT.lineGap, line, LAYOUT.skillSize, storyColor);
        });

        svg += `</g>
</g>
<rect x="1.5" y="1.5" width="${CARD.width - 3}" height="${cardH - 3}" rx="8.5" ry="8.5" fill="none" stroke="${baseColor}" stroke-width="3"/>
</svg>`;
        return svg;
    }

    function updateSvg() {
        latestSvg = renderSvg(getCardData());
        document.getElementById('previewWrapper').innerHTML = latestSvg;
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function safeFilename(name) {
        return (String(name || '武器').trim() || '武器').replace(/[\\/:*?"<>|]/g, '_');
    }

    function setValue(id, value) {
        const el = document.getElementById(id);
        if (el) el.value = value ?? '';
    }

    function applyCardData(data = {}) {
        setValue('inpName', data.name);
        setValue('inpType', data.type);
        setValue('inpSubLabel', data.subLabel);
        setValue('inpSubVal', data.subVal);
        setValue('inpMainVal', data.mainVal);
        setValue('inpStar', data.star || 4);
        setValue('inpRefine', data.refine || 1);
        setValue('inpSkillName', data.skillName);
        setValue('inpSkillDesc', data.skillDesc);
        setValue('inpBgDesc', data.bgDesc);
        updateSvg();
    }

    function exportConfig() {
        const config = {
            version: 'weapon-card-formal-v1',
            data: getCardData(),
            assets: {
                weaponDataUrl,
                starDataUrl,
                fontDataUrl,
                customFontName
            }
        };
        downloadBlob(
            new Blob([JSON.stringify(config, null, 2)], { type: 'application/json;charset=utf-8' }),
            `${safeFilename(getCardData().name)}_武器卡片配置.json`
        );
    }

    function importConfig(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async event => {
            try {
                const config = JSON.parse(event.target.result);
                if (config.data) {
                    applyCardData(config.data);
                } else if (config.state) {
                    applyCardData({
                        name: config.state.nameText,
                        type: config.state.typeText,
                        subLabel: config.state.subLabelText,
                        subVal: config.state.subValText,
                        mainVal: config.state.mainValText,
                        star: 4,
                        refine: parseInt(String(config.state.refineBoxText || '1'), 10) || 1,
                        skillName: config.state.skillNameText,
                        skillDesc: config.state.skillDescText,
                        bgDesc: config.state.storyText
                    });
                } else {
                    throw new Error('不是可识别的武器卡片 JSON');
                }
                if (config.assets) {
                    weaponDataUrl = config.assets.weaponDataUrl || '';
                    starDataUrl = config.assets.starDataUrl || '';
                    fontDataUrl = config.assets.fontDataUrl || '';
                    customFontName = config.assets.customFontName || (fontDataUrl ? `CustomWeaponFont_${Date.now()}` : '');
                    await loadCustomFont(customFontName, fontDataUrl);
                }
                updateSvg();
            } catch (err) {
                alert('JSON 导入失败：' + (err.message || '文件格式不正确'));
            } finally {
                input.value = '';
            }
        };
        reader.readAsText(file);
    }

    function clearAll() {
        applyCardData({
            name: '',
            type: '',
            subLabel: '',
            subVal: '',
            mainVal: '',
            star: 4,
            refine: 1,
            skillName: '',
            skillDesc: '',
            bgDesc: ''
        });
        weaponDataUrl = '';
        starDataUrl = '';
        fontDataUrl = '';
        customFontName = '';
        const weaponFile = document.getElementById('weaponFile');
        const starFile = document.getElementById('starFile');
        const fontFile = document.getElementById('fontFile');
        if (weaponFile) weaponFile.value = '';
        if (starFile) starFile.value = '';
        if (fontFile) fontFile.value = '';
        updateSvg();
    }

    function toggleDrawer(name) {
        const group = document.querySelector(`[data-drawer="${name}"]`);
        if (!group) return;
        group.classList.toggle('collapsed');
        const btn = group.querySelector('.drawer-toggle');
        if (btn) btn.textContent = group.classList.contains('collapsed') ? '展开' : '收起';
    }

    document.getElementById('downloadPngBtn').addEventListener('click', async function() {
        const btn = this;
        btn.disabled = true;
        btn.textContent = '导出中...';
        updateSvg();
        try {
            const svgBlob = new Blob([latestSvg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = reject;
                img.src = url;
            });
            const canvas = document.createElement('canvas');
            canvas.width = CARD.exportWidth;
            canvas.height = Math.round(CARD.exportWidth * currentCardHeight / CARD.width);
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            canvas.toBlob(blob => {
                if (blob) {
                    downloadBlob(blob, `${safeFilename(getCardData().name)}_武器卡片_2K.png`);
                } else {
                    alert('导出失败：无法生成图片，请重试');
                }
            }, 'image/png');
        } catch (err) {
            alert('导出失败：' + (err.message || '请重试'));
        } finally {
            btn.disabled = false;
            btn.textContent = '生成并导出 2K PNG';
        }
    });

    document.querySelectorAll('.app input, .app select, .app textarea').forEach(el => {
        if (el.type === 'file') return;
        if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio') {
            el.addEventListener('change', updateSvg);
        } else {
            el.addEventListener('input', updateSvg);
        }
    });

    document.getElementById('weaponFile').addEventListener('change', async event => {
        weaponDataUrl = await readFileAsDataURL(event.target.files[0]);
        updateSvg();
    });

    document.getElementById('starFile').addEventListener('change', async event => {
        starDataUrl = await readFileAsDataURL(event.target.files[0]);
        updateSvg();
    });

    document.getElementById('fontFile').addEventListener('change', async event => {
        const file = event.target.files[0];
        fontDataUrl = await readFileAsDataURL(file);
        customFontName = file ? `CustomWeaponFont_${Date.now()}` : '';
        await loadCustomFont(customFontName, fontDataUrl);
        updateSvg();
    });

    updateSvg();
</script>
</body>
</html>
